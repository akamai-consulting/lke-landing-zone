# .checkov.yaml — Checkov IaC security scan configuration.
# Run via: `llz check checkov` (the CI job runs exactly that). It was `make
# checkov` until the checks moved into the llz binary; an instance has no
# Makefile, so that spelling could only fail.
#
# WHAT THIS ACTUALLY SCANS, so a green run is not mistaken for coverage. An
# instance's terraform-iac-bootstrap roots are thin wrappers: they declare a
# couple of resources and otherwise call the llz-* modules, where the real
# resources live. Checkov does not follow those — their source is git::ssh:// and
# the job has no SSH key — so it logs "Failed to download module" and scans the
# wrappers. Measured on a real instance: 1 passed, 0 failed, 1 skipped across
# four roots.
#
# --download-external-modules is deliberately NOT set: it would report findings
# in module code an instance cannot fix, only suppress, and the template repo
# already scans terraform-modules/* directly where those resources are authored.
# What this gate is worth keeping for is the resources an operator adds to a
# ROOT, which nothing else looks at.
#
# Adding per-resource suppressions in .tf files (preferred over global skips):
#   resource "linode_lke_cluster" "this" {
#     #checkov:skip=CKV_LIN_1:reason why this specific resource is exempt
#   }
#
# Adding project-wide skips (use only for structural false positives, document reason):
#   skip-check:
#     - CKV_XYZ

# Resolve Terraform variable defaults where possible; reduces false positives
# that arise from conditional expressions and variable-driven resource configs.
evaluate-variables: true

skip-check:
  # The argocd namespace is created by Terraform solely to give the Helm release
  # a pre-existing namespace. ArgoCD's own pod security is enforced by its Helm
  # chart values; we do not set PSA labels on it via Terraform because ArgoCD
  # manages its own workload security model.
  - CKV_K8S_30

  # local_sensitive_file writes the LKE kubeconfig to runner.temp with mode 0600.
  # The file is deleted in the cleanup step. Checkov flags local file writes for
  # secrets generally; this is a documented, time-limited credential path.
  - CKV_TF_2
