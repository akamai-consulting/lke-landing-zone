# GENERATED by `llz ci managed-fresh --write` — do not hand-edit.
# Covers every token-free file in a digest-locked class of .template-manifest
# (today: `managed`). Those render byte-identically in every instance, which is
# what makes one digest valid for all of them.
#
# `llz ci managed-fresh` (part of `llz lint`) recomputes these offline and fails
# when an instance hand-edits a file the next `llz upgrade` would overwrite.
#
