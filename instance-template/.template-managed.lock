# token, so their rendered bytes differ per instance and no single digest can
# cover them. `llz upgrade` still overwrites them from a clean render (which is
# correct — the render substitutes each instance's own tokens); they simply get
# no drift detection. Listed so the gap is auditable rather than invisible:
#   .template-manifest
