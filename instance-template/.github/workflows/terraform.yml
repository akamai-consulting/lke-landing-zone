name: Terraform Infrastructure

# Thin caller for the LOCAL reusable workflow llz-terraform.yml — the full
# pipeline body (plan / apply / destroy across cluster, cluster-bootstrap,
# object-storage + OpenBao bootstrap + converge gate) lives in
# .github/workflows/llz-terraform.yml, which copier delivers into THIS repo
# alongside this stub. Because that reusable is same-repo, `secrets: inherit`
# actually delivers this instance's repo + environment secrets — unlike the old
# cross-org `uses:` form, where inheritance silently arrived empty for any adopter
# whose org differs from the template's (#200/#201). The reusable runs in the
# `llz` container image and calls the terraform-init / fetch-kubeconfig composite
# actions from this repo's own vendored .github/actions/ tree — nothing is
# fetched from the template repo at runtime (ADR 0003).
# The dispatch inputs below are FORWARDED to the reusable as explicit
# workflow_call inputs (`with:`) — a reusable workflow's github.event.inputs is
# empty across the workflow_call boundary, so it reads them via `inputs`.
# ADOPTERS: no fork needed for secrets — the whole job graph is local.
# `upstream_org` / `llz_version` still name the template's images + Terraform
# module sources (re-pinned by `llz upgrade`); fork only if you want to own those
# artifacts too.

on:
  push:
    branches: [main, master]
    paths:
      - 'terraform-iac-bootstrap/**'
      # THE SPEC, which renders the tfvars the roots read. A spec-only PR changes
      # the plan without touching a single .tf file, and until now it selected this
      # workflow on neither trigger — so `llz ci pr-touches` classified on two
      # prefixes (landingzone.yaml, environments/) that could never be reached,
      # because a PR containing only them ran nothing at all. The filter and the
      # classifier now agree on what counts as a Terraform change.
      - 'landingzone.yaml'
      - 'environments/**'
      - '.github/workflows/terraform.yml'
      # The PIPELINE ITSELF, which this stub is only the trigger surface for.
      # Listing this file and not the reusable it calls watched the 90-line caller
      # and ignored the body that plans and applies — so a `copier update` that
      # changed the apply logic (or the composite actions it drives) merged with no
      # plan run against it. The reusable and the actions are `managed`, so they
      # change on exactly the upgrades an operator most wants a plan for.
      # ALL the reusable bodies, not just llz-terraform.yml: this pipeline calls
      # llz-discover-deployments.yml and llz-bootstrap-openbao.yml too, and naming
      # them one at a time is what left this filter one file short to begin with.
      # They are all `managed`, so a `copier update` moves them together anyway.
      - '.github/workflows/llz-*.yml'
      - '.github/actions/**'
  pull_request:
    branches: [main, master]
    # ready_for_review is NOT in GitHub's default set (opened / synchronize /
    # reopened) and is load-bearing here: llz-terraform.yml's plan job skips DRAFT
    # pull requests, because it writes Terraform state (`llz ci tf-import`) with
    # nothing serializing it against a concurrent apply. Without this type, taking
    # a PR out of draft fires no event at all, so the plan an operator just asked
    # for would never run — they would have to push an empty commit to get it.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'terraform-iac-bootstrap/**'
      # THE SPEC, which renders the tfvars the roots read. A spec-only PR changes
      # the plan without touching a single .tf file, and until now it selected this
      # workflow on neither trigger — so `llz ci pr-touches` classified on two
      # prefixes (landingzone.yaml, environments/) that could never be reached,
      # because a PR containing only them ran nothing at all. The filter and the
      # classifier now agree on what counts as a Terraform change.
      - 'landingzone.yaml'
      - 'environments/**'
      - '.github/workflows/terraform.yml'
      # The PIPELINE ITSELF, which this stub is only the trigger surface for.
      # Listing this file and not the reusable it calls watched the 90-line caller
      # and ignored the body that plans and applies — so a `copier update` that
      # changed the apply logic (or the composite actions it drives) merged with no
      # plan run against it. The reusable and the actions are `managed`, so they
      # change on exactly the upgrades an operator most wants a plan for.
      # ALL the reusable bodies, not just llz-terraform.yml: this pipeline calls
      # llz-discover-deployments.yml and llz-bootstrap-openbao.yml too, and naming
      # them one at a time is what left this filter one file short to begin with.
      # They are all `managed`, so a `copier update` moves them together anyway.
      - '.github/workflows/llz-*.yml'
      - '.github/actions/**'
      # THE TEMPLATE PIN, which is here now and was deliberately absent before.
      #
      # It belongs here because a pin-only upgrade PR is exactly where a newly
      # required value goes unnoticed (v0.0.42 and TF_STATE_ENCRYPTION_PASSPHRASE),
      # and `repo-readiness` is the job that asks. It was listed once, then removed,
      # for a good reason: a paths: filter selects the WORKFLOW, not a job, so it
      # also selected `Plan Cluster (PR)` — whose `llz ci tf-import` step WRITES
      # cluster/<deployment>/terraform.tfstate with nothing serializing it against a
      # concurrent apply. Handing that write to an automated non-draft PR was not
      # worth catching a rare pin bump.
      #
      # WHAT CHANGED: that step is now gated on `changed-paths`, so it runs only for
      # a PR whose diff touches terraform-iac-bootstrap/, landingzone.yaml or
      # environments/. A pin-only or workflow-only PR selects this workflow, gets
      # repo-readiness and a plan, and writes no state. The write and this filter
      # entry are two halves of one decision — TestPinInTriggerImpliesImportIsPathGated
      # fails if either moves without the other, because the pin arriving here while
      # the import loses its gate silently restores the hazard.
      - '.copier-answers.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to run'
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
      module:
        description: 'Which module to target'
        required: true
        type: choice
        options:
          - cluster
          - object-storage
          # 0-n Managed Postgres clusters (spec.cluster.databases). A deployment
          # that declared none renders `databases = {}` and this applies cleanly
          # while provisioning nothing, so it is safe to run on any deployment.
          - databases
          - all
      region:
        # NOTE: input name kept as `region` for backwards compatibility with
        # existing state-key paths (cluster/<deployment>/terraform.tfstate)
        # and GitHub Environment names (infra-<deployment>). The value is
        # really a *deployment*.
        #
        # Free-form string, NOT a fixed `choice` list: deployments are created
        # dynamically by `llz env add` (the docs stress there is no hardcoded env
        # list), so a choice input would reject any env an adopter adds (e.g.
        # `myteam-dev`). Must match a deployment you scaffolded
        # (^[a-z][a-z0-9-]{1,30}$) with a tfvars set + infra-<deployment> Environment.
        description: 'Deployment name — NOT a Linode region (this field is named `region` for state-key compatibility). e.g. primary | staging | lab | e2e (must have a tfvars set + infra-<deployment> Environment)'
        required: true
        type: string
      confirm_destroy:
        description: 'Required for destroy: destroy:<deployment>:cluster | destroy:<deployment>:object-storage | destroy:<deployment>:databases'
        required: false
        type: string
      drain_data_buckets:
        description: 'On destroy, EMPTY (not delete) the Loki/Harbor buckets once the cluster is gone. Default false — they hold real logs and images.'
        required: false
        type: boolean
        default: false
      assert_loki:
        description: 'DEPRECATED alias for assert_invariants, accepted so a `merge`-class caller stub that still passes the old key does not fail the RUN. GitHub rejects an undeclared input at startup — no jobs, no logs — and terraform.yml is exactly the file a 3-way merge can strand on the old name. Remove after one release.'
        required: false
        type: boolean
        default: false
      assert_mutating:
        description: 'Run the FULL assert-suite instead of the day-2 allow-list: the lanes that mutate real state, plus the ones that need release-e2e fixtures. release-e2e sets this; leave it off for anything running against a deployment you care about.'
        required: false
        type: boolean
        default: false
      assert_invariants:
        description: 'After converge, assert the platform invariants hold: the assert-suite lanes, Loki S3-backed, volume encryption, and the Managed Postgres admin credential. Default false. WAS `assert_loki`, which named one of the four things it gates — promoting into an environment skipped the volume-encryption check with nothing saying so.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  call:
    # LOCAL reusable (copier-delivered into this repo), so `secrets: inherit` is
    # same-repo and resolves this instance's repo + environment secrets (#201).
    uses: ./.github/workflows/llz-terraform.yml
    with:
      instance_repo: <@ instance_repo @>
      # Forward the workflow_dispatch selectors so the reusable can read them via
      # `inputs` (github.event.inputs does not cross the workflow_call boundary).
      # Empty on push/PR, which leaves the action-gated jobs skipped.
      action: ${{ inputs.action }}
      module: ${{ inputs.module }}
      region: ${{ inputs.region }}
      confirm_destroy: ${{ inputs.confirm_destroy }}
      drain_data_buckets: ${{ inputs.drain_data_buckets || false }}
      # Default false via the reusable's input; release-e2e's provision dispatch
      # passes assert_invariants=true so the assertions run inside the converge job.
      assert_invariants: ${{ inputs.assert_invariants || false }}
      # Forwarded so a stub stranded on the old key still reaches the new input.
      assert_loki: ${{ inputs.assert_loki || false }}
      assert_mutating: ${{ inputs.assert_mutating || false }}
    secrets: inherit
