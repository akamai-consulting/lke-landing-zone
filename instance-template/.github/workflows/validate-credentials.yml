name: Validate Credentials

# Thin caller for the reusable LLZ workflow — the body (deployment discovery
# and the per-deployment `llz ci validate-tokens` probe) lives in the template
# and is sourced there (see docs/adr/0003-vendor-actions-and-bodies-into-instances.md).
# This stub owns only the trigger surface: the daily cron and the dispatch.
#
# Two uses, one surface:
#   • Scheduled: a daily audit, so an expiring or re-scoped credential is on the
#     board before it fails somebody's build.
#   • On demand: the answer to "will prod's pushed secrets actually work?" —
#     dispatch it and read the conclusion. `llz doctor` can only probe the copy
#     in your own .llz/secrets.env; GitHub never reads a secret back, so this
#     dispatch is the only thing that tests what CI will really be handed.
#
# ADOPTERS: no fork needed for secrets — the reusable ./.github/workflows/llz-*.yml is
# copier-delivered into this repo, so `secrets: inherit` is same-repo (#201).

on:
  schedule:
    # Daily 05:00 UTC — deliberately an hour AHEAD of scheduled-checks' 06:00
    # credential single pane. This probe needs no cluster, so it still renders a
    # verdict on a wedged or half-built instance where the 06:00 job cannot get
    # a kubeconfig; running it first means that job's failure can be read
    # against a known-good (or known-bad) credential set instead of guessed at.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  call:
    # Local reusable — the body ships in this repo and is re-rendered by
    # `llz upgrade`, so updates arrive as reviewable template-version PRs.
    # ADOPTERS: no fork needed — local reusable, `secrets: inherit` is same-repo (#201).
    uses: ./.github/workflows/llz-validate-credentials.yml
    secrets: inherit
