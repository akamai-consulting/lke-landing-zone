name: llz-secret-rotation (reusable)

# Reusable (`workflow_call`) body of the monthly out-of-band rotation for lke-admin
# tokens, the Linode PAT (broad + narrow in-cluster), and the TF-state OBJ key pair.
# Vendored verbatim into every instance.
#
# Rationale, incident history and design notes live in the template repo:
# docs/workflows/llz-secret-rotation.md — read it before changing anything here.
on:
  workflow_call:
    inputs:
      scope:
        description: "What to rotate (forwarded from the caller's dispatch; ignored on schedule)."
        required: false
        type: string
        default: lke-admin
      region:
        description: "Region (scope=lke-admin only; ignored otherwise)."
        required: false
        type: string
        default: primary
      confirm:
        description: "Emergency-rotation confirmation token (dispatch only)."
        required: false
        type: string
        default: ""
      reason:
        description: "Why this emergency rotation is being run (audit log; dispatch only)."
        required: false
        type: string
        default: ""
      pat-apply:
        description: "Arm Linode PAT create+propagate? (false = dry-run)."
        required: false
        type: boolean
        default: false
      revoke-apply:
        description: "Arm Linode PAT revoke-old? (false = dry-run)."
        required: false
        type: boolean
        default: false
      tf-state-apply:
        description: "Arm TF-state OBJ key rotate? (false = dry-run)."
        required: false
        type: boolean
        default: false
      tf-state-revoke-apply:
        description: "Arm TF-state OBJ key revoke-old? (false = dry-run)."
        required: false
        type: boolean
        default: false
      db-admin-apply:
        description: "Arm the Managed Postgres admin-password reset? (false = report-only). IRREVERSIBLE and has no overlap window."
        required: false
        type: boolean
        default: false
      state-passphrase-apply:
        description: "Arm the state-encryption key rollover? (false = report which roots would be re-keyed). Re-keys EVERY Terraform root; the old passphrase is retained until every root verifies."
        required: false
        type: boolean
        default: false
      instance_repo:
        description: "This instance's GitHub repo (<owner>/<name>) for `gh secret set` targeting."
        required: true
        type: string
    # All required: false, deliberately — these are infra-<env> ENVIRONMENT secrets
    # resolved per job, and `required: true` would make GitHub reject the whole call.
    secrets:
      TF_STATE_ENCRYPTION_PASSPHRASE:
        required: false
      TF_STATE_ENCRYPTION_PASSPHRASE_OLD:
        description: 'PREVIOUS state-encryption passphrase. Set ONLY during a rotation window (secret-rotation.yml scope=state-passphrase); empty in steady state. Adds an ENCRYPTED fallback so OpenTofu can read state written with the old key and rewrite it with the new one.'
        required: false
      TF_STATE_ACCESS_KEY:
        required: false
      TF_STATE_SECRET_KEY:
        required: false
      LINODE_API_TOKEN:
        required: false
      OPENBAO_SECRETS_WRITE_TOKEN:
        required: false
      OPENBAO_ROOT_TOKEN:
        required: false
      OPENBAO_RECOVERY_KEY_1:
        required: false
      OPENBAO_RECOVERY_KEY_2:
        required: false
      OPENBAO_RECOVERY_KEY_3:
        required: false

permissions:
  contents: read

# REGION cannot live here — the matrix context is unavailable at workflow level.
env:
  TF_STATE_BUCKET:     ${{ vars.TF_STATE_BUCKET }}
  AWS_ENDPOINT_URL_S3: ${{ vars.TF_STATE_ENDPOINT }}

defaults:
  run:
    shell: bash

jobs:

  # ── Discover deployments (the per-deployment matrix source of truth) ─────────
  # Source of truth for every matrix below; the scheduled health checks call the
  # same reusable workflow, so the rotated and checked sets cannot drift.
  discover:
    uses: ./.github/workflows/llz-discover-deployments.yml

  # ── Resolve scope + regions + validate emergency confirmation ───────────────
  # Routes on event_name + (schedule cron OR dispatch scope) into the run-*/regions/
  # *-apply outputs each downstream job gates on. Per-output reference: sidecar doc.
  setup:
    name: Setup
    needs: discover
    runs-on: ubuntu-latest
    container:
      # llz is baked into TF_IMAGE — the routing step is `llz ci rotation-plan`.
      image: ${{ vars.TF_IMAGE }}
    timeout-minutes: 5
    outputs:
      run-lke-admin:           ${{ steps.route.outputs.run-lke-admin }}
      run-pat-create:          ${{ steps.route.outputs.run-pat-create }}
      run-pat-propagate-only:  ${{ steps.route.outputs.run-pat-propagate-only }}
      run-pat-revoke:          ${{ steps.route.outputs.run-pat-revoke }}
      run-tf-state-create:     ${{ steps.route.outputs.run-tf-state-create }}
      run-tf-state-revoke:     ${{ steps.route.outputs.run-tf-state-revoke }}
      regions:                 ${{ steps.route.outputs.regions }}
      pat-apply:               ${{ steps.route.outputs.pat-apply }}
      revoke-apply:            ${{ steps.route.outputs.revoke-apply }}
      tf-state-apply:          ${{ steps.route.outputs.tf-state-apply }}
      tf-state-revoke-apply:   ${{ steps.route.outputs.tf-state-revoke-apply }}
      run-db-admin:            ${{ steps.route.outputs.run-db-admin }}
      run-state-passphrase:    ${{ steps.route.outputs.run-state-passphrase }}
      state-passphrase-apply:  ${{ steps.route.outputs.state-passphrase-apply }}
      db-admin-apply:          ${{ steps.route.outputs.db-admin-apply }}
    steps:
      - name: Route scope + validate emergency confirmation
        id: route
        env:
          EVENT:                 ${{ github.event_name }}
          CRON:                  ${{ github.event.schedule }}
          SCOPE:                 ${{ inputs.scope }}
          STATE_PASSPHRASE_APPLY: ${{ inputs.state-passphrase-apply }}
          REGION:                ${{ inputs.region }}
          CONFIRM:               ${{ inputs.confirm }}
          REASON:                ${{ inputs.reason }}
          PAT_APPLY:             ${{ inputs.pat-apply }}
          REVOKE_APPLY:          ${{ inputs.revoke-apply }}
          TF_STATE_APPLY:        ${{ inputs.tf-state-apply }}
          TF_STATE_REVOKE_APPLY: ${{ inputs.tf-state-revoke-apply }}
          DB_ADMIN_APPLY:        ${{ inputs.db-admin-apply }}
          ACTOR:                 ${{ github.actor }}
          # Deployments discovered from the instance tfvars (llz env list).
          DEPLOYMENTS:           ${{ needs.discover.outputs.deployments }}
        run: llz ci rotation-plan

  # ── Rotate lke-admin → TF state refresh → health gate ────────────────────────
  rotate:
    name: Rotate lke-admin (${{ matrix.region }})
    needs: setup
    if: needs.setup.outputs.run-lke-admin == 'true'
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.TF_IMAGE }}
    environment: infra-${{ matrix.region }}
    permissions:
      contents: read
    timeout-minutes: 30
    # Shared with terraform.yml / release.yml: the rotate→refresh window must not
    # race another apply against stale state.
    concurrency:
      group: terraform-infra-${{ matrix.region }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        region: ${{ fromJSON(needs.setup.outputs.regions) }}
    env:
      REGION:                          ${{ matrix.region }}
      AWS_ACCESS_KEY_ID:               ${{ secrets.TF_STATE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY:           ${{ secrets.TF_STATE_SECRET_KEY }}
      LINODE_TOKEN:                    ${{ secrets.LINODE_API_TOKEN }}
      TF_VAR_github_token:             ${{ secrets.GITHUB_TOKEN }}
      TF_VAR_github_api_url:           ${{ github.api_url }}
      TF_VAR_eaa_firewall_template_id: ${{ vars.EAA_FIREWALL_TEMPLATE_ID }}
      KUBECONFIG:                      ${{ github.workspace }}/.kube/config
    steps:
      # At the workspace root: TF module working-dirs + vendored .github/actions/.
      - name: Checkout the instance (TF roots)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Terraform init — cluster
        uses: ./.github/actions/terraform-init
        # Bounded: `tofu init` is a provider/module/state fetch with no internal
        # budget, so a stalled registry or backend would otherwise eat the job.
        timeout-minutes: 10
        with:
          aws-access-key-id:     ${{ secrets.TF_STATE_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.TF_STATE_SECRET_KEY }}
          state-encryption-passphrase: ${{ secrets.TF_STATE_ENCRYPTION_PASSPHRASE }}
          state-encryption-key-name:      ${{ vars.TF_STATE_ENCRYPTION_KEY_NAME || 'llz' }}
          state-encryption-passphrase-old: ${{ secrets.TF_STATE_ENCRYPTION_PASSPHRASE_OLD }}
          state-encryption-key-name-old:  ${{ vars.TF_STATE_ENCRYPTION_KEY_NAME_OLD }}
          github-token:          ${{ github.token }}

      # Fetch kubeconfig from TF state + open this runner's dynamic egress IP in the
      # LKE-E control-plane ACL before any kubectl; revoked at job end (if: always()).
      - name: Cluster access (kubeconfig + runner ACL)
        id: kubeconfig
        uses: ./.github/actions/cluster-access
        # Fails fast instead of hanging — see the action's own note. Normal is <1min.
        timeout-minutes: 6
        with:
          state-encryption-passphrase: ${{ secrets.TF_STATE_ENCRYPTION_PASSPHRASE }}
          aws-access-key-id:     ${{ secrets.TF_STATE_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.TF_STATE_SECRET_KEY }}
          linode-token:          ${{ secrets.LINODE_API_TOKEN }}
          region:                ${{ matrix.region }}
          github-token:          ${{ github.token }}
          kubeconfig-path:       ${{ github.workspace }}/.kube/config
          # A deployment with no cluster yet is a no-op, not a failure.
          allow-missing:         'true'

      # available=false — make the no-op explicit; every step below is gated on it.
      - name: No cluster yet — nothing to rotate
        if: always() && steps.kubeconfig.outputs.available != 'true'
        run: |
          echo "::notice title=No-op (no cluster yet)::lke-admin rotation for ${REGION} is a no-op until your first cluster is built — run 'llz build ${REGION} --yes' (or 'llz up ${REGION} --yes'). Nothing to rotate."
          echo "### lke-admin rotation — no-op: no cluster for ${REGION} yet. Build it ('llz build ${REGION} --yes') and rotation runs on the next schedule." >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve LKE cluster ID
        id: cid
        if: steps.kubeconfig.outputs.available == 'true'
        working-directory: terraform-iac-bootstrap/cluster
        run: llz ci tf-output cluster_id --out-key id

      # llz prints the JSON audit record and appends it to the step summary itself.
      - name: Rotate lke-admin
        if: steps.kubeconfig.outputs.available == 'true'
        env:
          LKE_CLUSTER_ID: ${{ steps.cid.outputs.id }}
        run: |
          echo "Rotating lke-admin on cluster ${LKE_CLUSTER_ID} (${REGION})"
          llz credentials lke-admin rotate --apply

      # delete-kubeconfig invalidates the copy in TF state; refresh-only re-reads the
      # new one so downstream fetch-kubeconfig consumers get the live one.
      - name: Refresh Terraform state (repopulate kubeconfig_raw)
        if: steps.kubeconfig.outputs.available == 'true'
        working-directory: terraform-iac-bootstrap/cluster
        run: |
          set -euo pipefail
          TFVARS="${REGION}.tfvars"
          test -f "$TFVARS" || TFVARS="${REGION}.tfvars.example"
          llz ci tf-destroy --refresh-only --var-file="$TFVARS"

      - name: Post-rotation health gate
        if: steps.kubeconfig.outputs.available == 'true'
        working-directory: terraform-iac-bootstrap/cluster
        run: |
          set -euo pipefail
          # Re-fetch the now-refreshed kubeconfig and wait (bounded) for the
          # control plane to accept it — regeneration takes time to sync.
          mkdir -p "$(dirname "$KUBECONFIG")"
          llz ci tf-output kubeconfig_raw --out-file "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
          llz ci wait-cluster-ready --timeout 360 --interval 15
          echo "> Post-rotation health gate passed for \`${REGION}\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup kubeconfig
        if: always()
        run: rm -f "$KUBECONFIG"

      - name: Revoke control-plane ACL for this runner
        if: always()
        uses: ./.github/actions/lke-runner-acl
        # Backstop for the action that actually burned 15m: its internals are now
        # bounded (runnerACLKubectlTimeout), this catches whatever is next.
        timeout-minutes: 5
        with:
          mode:         revoke
          linode-token: ${{ secrets.LINODE_API_TOKEN }}
          region:       ${{ matrix.region }}

  # ── Linode PAT (broad, CI/Terraform-only): create new + update GHA secrets ───
  # The rotated token reaches downstream jobs via the rewritten GHA env secrets, NOT
  # as a job output — it is ::add-mask::'d and would be redacted out of one.
  create-linode-pat:
    name: Create LINODE_API_TOKEN
    needs: [setup, discover]
    # Fresh instance: discover emits [] and the environment: below would be invalid.
    if: needs.setup.outputs.run-pat-create == 'true' && needs.discover.outputs.deployments != '[]'
    runs-on: ubuntu-latest
    # GitHub scopes `environment:` per job and a job can pin only one deployment, so
    # this job pins the first purely to READ its env-scoped secrets; llz then writes
    # to every deployment (gha-secret-deployments). Not collapsible with `rotate`.
    environment: infra-${{ fromJSON(needs.discover.outputs.deployments)[0] }}
    container:
      # llz is baked into TF_IMAGE, so the action needs no Go toolchain.
      image: ${{ vars.TF_IMAGE }}
    permissions:
      contents: read
    timeout-minutes: 30
    concurrency:
      group: linode-pat-rotation
      cancel-in-progress: false
    env:
      # gh secret set targets the instance repo on github.com (default host).
      GH_REPO: ${{ inputs.instance_repo }}
    steps:
      # At the workspace root: TF module working-dirs + vendored .github/actions/.
      - name: Checkout the instance (TF roots)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Rotate PAT + write the new token to each deployment's env secret
        id: rotate
        uses: ./.github/actions/linode-credentials
        with:
          credential-type: pat
          operation:       create
          linode-token:    ${{ secrets.LINODE_API_TOKEN }}
          # label: omitted on purpose — llz derives the instance-scoped
          # `llz-<objLabelPrefix>-linode-api-token` from the spec. The old shared
          # literal made revoke-old drain every LLZ instance on the account.
          # Rewrites LINODE_API_TOKEN in every deployment's infra-<name> environment.
          gha-secret-deployments: ${{ join(fromJSON(needs.discover.outputs.deployments), ' ') }}
          # Must cover a full apply AND a full destroy incl. orphan sweeps (events,
          # volumes, nodebalancers) — dropping one silently breaks teardown.
          scopes:          "linodes:read_write object_storage:read_write lke:read_write firewall:read_write vpc:read_write volumes:read_write nodebalancers:read_write events:read_only account:read_write"
          validity-days:   "90"
          gha-secret-name: "LINODE_API_TOKEN"
          gha-token:       ${{ secrets.OPENBAO_SECRETS_WRITE_TOKEN }}
          apply:           ${{ needs.setup.outputs.pat-apply }}

  # ── In-cluster narrow PAT: mint + write to each region's OpenBao ─────────────
  # Each region mints its OWN narrow PAT (label llz-incluster-<region>) with the broad
  # token and writes it to that region's OpenBao; the narrow token never leaves the job.
  propagate-linode-pat:
    name: Rotate the in-cluster PAT on ${{ matrix.region }}
    needs: [setup, create-linode-pat, discover]
    # Two entry paths: normal (create-linode-pat succeeded) and recovery
    # (`linode-pat-propagate-only`, where create is skipped). `always()` is required
    # so the skipped create dependency does not auto-skip this job on the latter.
    if: |
      always() && (
        (needs.create-linode-pat.result == 'success' && needs.setup.outputs.run-pat-create == 'true' && needs.setup.outputs.pat-apply == 'true')
        || needs.setup.outputs.run-pat-propagate-only == 'true'
      )
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.TF_IMAGE }}
    permissions:
      contents: read
      # OIDC token for OpenBao jwt auth (role secret-propagator) — required by llz.
      id-token: write
    environment: infra-${{ matrix.region }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # A deployment with no OpenBao/cluster yet is skipped internally.
        region: ${{ fromJSON(needs.discover.outputs.deployments) }}
    env:
      REGION:              ${{ matrix.region }}
    steps:
      # At the workspace root: TF module working-dirs + vendored .github/actions/.
      - name: Checkout the instance (TF roots)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Same preamble as `rotate`; tolerates an unbootstrapped region via
      # allow-missing. Step id must stay `kubeconfig` — the gates below read it.
      - name: Cluster access (kubeconfig + runner ACL)
        id: kubeconfig
        uses: ./.github/actions/cluster-access
        # Fails fast instead of hanging — see the action's own note. Normal is <1min.
        timeout-minutes: 6
        with:
          state-encryption-passphrase: ${{ secrets.TF_STATE_ENCRYPTION_PASSPHRASE }}
          aws-access-key-id:     ${{ secrets.TF_STATE_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.TF_STATE_SECRET_KEY }}
          linode-token:          ${{ secrets.LINODE_API_TOKEN }}
          region:                ${{ matrix.region }}
          github-token:          ${{ github.token }}
          kubeconfig-path:       $HOME/.kube/config
          allow-missing:         'true'

      # Skips cleanly if the region isn't bootstrapped (run bootstrap-openbao.yml).
      # LINODE_API_TOKEN here is the broad MINTING token, not what gets written.
      - name: Mint the in-cluster PAT + write secret/linode/api-token
        if: steps.kubeconfig.outputs.available == 'true'
        env:
          LINODE_API_TOKEN: ${{ secrets.LINODE_API_TOKEN }}
        run: llz ci rotate-incluster-pat

      - name: Cleanup kubeconfig
        if: always()
        run: rm -f "$HOME/.kube/config"

      - name: Revoke control-plane ACL for this runner
        if: always()
        uses: ./.github/actions/lke-runner-acl
        # Backstop for the action that actually burned 15m: its internals are now
        # bounded (runnerACLKubectlTimeout), this catches whatever is next.
        timeout-minutes: 5
        with:
          mode:         revoke
          linode-token: ${{ secrets.LINODE_API_TOKEN }}
          region:       ${{ matrix.region }}

  # ── Linode PAT: drain old PATs (daily reaper) ────────────────────────────────
  # Stateless — the label IS the drain record: keep the newest, revoke older siblings.
  revoke-linode-pat:
    name: Revoke old LINODE_API_TOKEN PATs
    needs: [setup, discover]
    # Fresh instance: discover emits [] and the environment: below would be invalid.
    if: needs.setup.outputs.run-pat-revoke == 'true' && needs.discover.outputs.deployments != '[]'
    runs-on: ubuntu-latest
    # Pinned only to read the env-scoped account token (see create-linode-pat).
    environment: infra-${{ fromJSON(needs.discover.outputs.deployments)[0] }}
    container:
      # llz baked into TF_IMAGE — see create-linode-pat.
      image: ${{ vars.TF_IMAGE }}
    permissions:
      contents: read
    timeout-minutes: 15
    concurrency:
      group: linode-pat-revoke
      cancel-in-progress: false
    steps:
      # At the workspace root: TF module working-dirs + vendored .github/actions/.
      - name: Checkout the instance (TF roots)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Revoke old PATs
        uses: ./.github/actions/linode-credentials
        with:
          credential-type: pat
          operation:       revoke-old
          linode-token:    ${{ secrets.LINODE_API_TOKEN }}
          # label: omitted on purpose — llz derives the instance-scoped
          # `llz-<objLabelPrefix>-linode-api-token` from the spec. The old shared
          # literal made revoke-old drain every LLZ instance on the account.
          grace-days:      "7"
          apply:           ${{ needs.setup.outputs.revoke-apply }}

  # ── State-encryption passphrase: re-key every root onto a new passphrase ────
  # DISPATCH-ONLY. This re-encrypts every state file in the instance, so it is
  # deliberately absent from both the monthly schedule and `all` — see the
  # `state-passphrase` case in ci_rotation_plan.go.
  #
  # ORDERING IS THE WHOLE SAFETY PROPERTY. The old passphrase is the ONLY thing
  # that can read a root which has not rolled over, so it is retained until every
  # root verifies with the new key ALONE. `llz ci rotate-state-passphrase` exits
  # non-zero unless all of them do, which is what the (separate, manual) deletion
  # of TF_STATE_ENCRYPTION_PASSPHRASE_OLD must be gated on.
  #
  # Re-running is safe and is the recovery path: with both keys configured a root
  # already on the new key decrypts via the primary and a straggler via the
  # fallback, so a resumed rollover converges.
  #
  # EXCLUSIVE against every other Terraform job — a concurrent apply would write
  # state with one key while this rewrites it with another.
  rotate-state-passphrase:
    name: Rotate state-encryption passphrase
    needs: [setup, discover]
    if: needs.setup.outputs.run-state-passphrase == 'true' && needs.discover.outputs.deployments != '[]'
    runs-on: ubuntu-latest
    strategy:
      # Serial, not parallel: two deployments re-keying at once would contend on
      # the shared VPC root's state lock.
      max-parallel: 1
      fail-fast: false
      matrix:
        region: ${{ fromJSON(needs.setup.outputs.regions) }}
    environment: infra-${{ matrix.region }}
    container:
      image: ${{ vars.TF_IMAGE }}
    permissions:
      contents: read
    timeout-minutes: 45
    concurrency:
      group: terraform-state-${{ matrix.region }}
      cancel-in-progress: false
    env:
      REGION:  ${{ matrix.region }}
      GH_REPO: ${{ inputs.instance_repo }}
    steps:
      - name: Checkout the instance (TF roots)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Emits TF_ENCRYPTION carrying BOTH key providers plus the ENCRYPTED
      # fallback, because TF_STATE_ENCRYPTION_PASSPHRASE_OLD is set for the
      # window. An encrypted fallback is legal alongside `enforced` (which bans
      # only method.unencrypted), so the posture is never relaxed to do this.
      - name: Terraform init (rotation window — both keys)
        uses: ./.github/actions/terraform-init
        with:
          module:                aws-init-only
          aws-access-key-id:     ${{ secrets.TF_STATE_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.TF_STATE_SECRET_KEY }}
          github-token:          ${{ github.token }}
          state-encryption-passphrase:    ${{ secrets.TF_STATE_ENCRYPTION_PASSPHRASE }}
          state-encryption-key-name:      ${{ vars.TF_STATE_ENCRYPTION_KEY_NAME || 'llz' }}
          state-encryption-passphrase-old: ${{ secrets.TF_STATE_ENCRYPTION_PASSPHRASE_OLD }}
          state-encryption-key-name-old:  ${{ vars.TF_STATE_ENCRYPTION_KEY_NAME_OLD }}

      # The verify pass needs the NEW key ALONE — verifying with the window
      # config would decrypt via the FALLBACK and report success for a root still
      # on the old key, which is exactly the state that must not license deleting
      # the old passphrase. llz builds that config itself from the passphrase +
      # key name, so the HCL-emission logic lives in ONE unit-tested place.
      - name: Re-key every root and verify with the new passphrase alone
        env:
          TF_STATE_ENCRYPTION_PASSPHRASE: ${{ secrets.TF_STATE_ENCRYPTION_PASSPHRASE }}
          TF_STATE_ENCRYPTION_KEY_NAME:   ${{ vars.TF_STATE_ENCRYPTION_KEY_NAME || 'llz' }}
        run: llz ci rotate-state-passphrase --roots-dir terraform ${{ needs.setup.outputs.state-passphrase-apply == 'true' && '--apply' || '' }}

  # ── TF-state OBJ key: create new pair + update repo-level GHA secrets ───────
  # Consumers are GHA-only (Terraform backend) — no in-cluster propagation.
  create-tf-state-key:
    name: Create TF_STATE_ACCESS_KEY pair
    needs: [setup, discover]
    # Fresh instance: discover emits [] and the environment: below would be invalid.
    if: needs.setup.outputs.run-tf-state-create == 'true' && needs.discover.outputs.deployments != '[]'
    runs-on: ubuntu-latest
    # Pinned only to read env-scoped secrets; llz writes to all (create-linode-pat).
    environment: infra-${{ fromJSON(needs.discover.outputs.deployments)[0] }}
    container:
      # llz baked into TF_IMAGE — see create-linode-pat.
      image: ${{ vars.TF_IMAGE }}
    permissions:
      contents: read
    timeout-minutes: 30
    concurrency:
      group: linode-tf-state-key-rotation
      cancel-in-progress: false
    env:
      # gh secret set targets the instance repo on github.com (default host).
      GH_REPO: ${{ inputs.instance_repo }}
    steps:
      # At the workspace root: TF module working-dirs + vendored .github/actions/.
      - name: Checkout the instance (TF roots)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Rotate OBJ key + write TF_STATE_* to each deployment's env secrets
        uses: ./.github/actions/linode-credentials
        with:
          credential-type:            obj-key
          operation:                  create
          linode-token:               ${{ secrets.LINODE_API_TOKEN }}
          # label + bucket-cluster: both derived by llz (rotation_identity.go).
          # The cluster comes from TF_STATE_ENDPOINT below — it was hardcoded to
          # `us-ord-10`, so every instance whose state bucket lives elsewhere
          # rotated in a key that cannot read its own state.
          state-endpoint:             ${{ vars.TF_STATE_ENDPOINT }}
          bucket-name:                ${{ vars.TF_STATE_BUCKET }}
          bucket-permissions:         "read_write"
          gha-access-key-secret-name: "TF_STATE_ACCESS_KEY"
          gha-secret-key-secret-name: "TF_STATE_SECRET_KEY"
          # Write the rotated pair into TF_STATE_* for every deployment's env.
          gha-secret-deployments:     ${{ join(fromJSON(needs.discover.outputs.deployments), ' ') }}
          gha-token:                  ${{ secrets.OPENBAO_SECRETS_WRITE_TOKEN }}
          apply:                      ${{ needs.setup.outputs.tf-state-apply }}

  # ── TF-state OBJ key: drain old keys (daily reaper) ─────────────────────────
  # Keeps the 2 newest same-labeled OBJ keys by id (ids are monotonic) — the OBJ keys
  # API exposes no `created` timestamp to age against, unlike the PAT reaper.
  revoke-tf-state-key:
    name: Revoke old TF_STATE_ACCESS_KEY pairs
    needs: [setup, discover]
    # Fresh instance: discover emits [] and the environment: below would be invalid.
    if: needs.setup.outputs.run-tf-state-revoke == 'true' && needs.discover.outputs.deployments != '[]'
    runs-on: ubuntu-latest
    # Read-only drain, but its LINODE_API_TOKEN is env-scoped (see create-linode-pat).
    environment: infra-${{ fromJSON(needs.discover.outputs.deployments)[0] }}
    container:
      # llz baked into TF_IMAGE — see create-linode-pat.
      image: ${{ vars.TF_IMAGE }}
    permissions:
      contents: read
    timeout-minutes: 15
    concurrency:
      group: linode-tf-state-key-revoke
      cancel-in-progress: false
    steps:
      # At the workspace root: TF module working-dirs + vendored .github/actions/.
      - name: Checkout the instance (TF roots)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Revoke old OBJ keys
        uses: ./.github/actions/linode-credentials
        with:
          credential-type: obj-key
          operation:       revoke-old
          linode-token:    ${{ secrets.LINODE_API_TOKEN }}
          # label: derived, as above.
          keep-newest:     "2"
          apply:           ${{ needs.setup.outputs.tf-state-revoke-apply }}

  # ── Managed Postgres admin credential: in-place reset ───────────────────────
  # DISPATCH-ONLY (scope=db-admin), never scheduled and never part of scope=all —
  # see the `db-admin` case in ci_rotation_plan.go. Linode exposes no way to mint
  # a SECOND admin credential on a Managed Postgres: the fixed `akmadmin` user is
  # reset in place, so there is no overlap window and every consumer holding the
  # old password is broken from the reset until ESO re-syncs. That is an
  # operator-chosen maintenance action, not a cron's decision.
  #
  # The job needs three things at once, which is why it is not folded into an
  # existing one: the databases root's Terraform state (for `database_ids` and the
  # post-rotation refresh), a kubeconfig (the OpenBao writes go through `kubectl
  # exec` into the OpenBao pod), and the OpenBao root token.
  rotate-db-admin:
    name: Rotate Managed Postgres admin (${{ matrix.region }})
    needs: setup
    if: needs.setup.outputs.run-db-admin == 'true'
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.TF_IMAGE }}
    environment: infra-${{ matrix.region }}
    permissions:
      contents: read
    timeout-minutes: 30
    # Shares the terraform-infra group: the rotation ends in a state refresh of
    # the databases root, which must not race another apply.
    concurrency:
      group: terraform-infra-${{ matrix.region }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        region: ${{ fromJSON(needs.setup.outputs.regions) }}
    env:
      REGION:                ${{ matrix.region }}
      AWS_ACCESS_KEY_ID:     ${{ secrets.TF_STATE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
      LINODE_TOKEN:          ${{ secrets.LINODE_API_TOKEN }}
      KUBECONFIG:            ${{ github.workspace }}/.kube/config
    steps:
      # At the workspace root: TF module working-dirs + vendored .github/actions/.
      - name: Checkout the instance (TF roots)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Exact gate: DatabasesTFVars omits the `databases` assignment entirely when
      # the map is empty, so this is true if and only if a cluster was declared.
      # Without it, a deployment with no databases would initialize the root (and
      # fail) for nothing.
      - name: Detect declared database clusters
        id: db
        run: llz ci db-declared --region "$REGION"

      - name: Terraform init — databases
        if: steps.db.outputs.declared == 'true'
        uses: ./.github/actions/terraform-init
        # Bounded: `tofu init` is a provider/module/state fetch with no internal
        # budget, so a stalled registry or backend would otherwise eat the job.
        timeout-minutes: 10
        with:
          module: databases
          aws-access-key-id:     ${{ secrets.TF_STATE_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.TF_STATE_SECRET_KEY }}
          state-encryption-passphrase: ${{ secrets.TF_STATE_ENCRYPTION_PASSPHRASE }}
          state-encryption-key-name:      ${{ vars.TF_STATE_ENCRYPTION_KEY_NAME || 'llz' }}
          state-encryption-passphrase-old: ${{ secrets.TF_STATE_ENCRYPTION_PASSPHRASE_OLD }}
          state-encryption-key-name-old:  ${{ vars.TF_STATE_ENCRYPTION_KEY_NAME_OLD }}
          github-token:          ${{ github.token }}

      # The OpenBao writes go through `kubectl exec` into the OpenBao pod, so this
      # job needs cluster access for the same reason the seed does.
      - name: Cluster access (kubeconfig + runner ACL)
        id: kubeconfig
        if: steps.db.outputs.declared == 'true'
        uses: ./.github/actions/cluster-access
        # Fails fast instead of hanging — see the action's own note. Normal is <1min.
        timeout-minutes: 6
        with:
          state-encryption-passphrase: ${{ secrets.TF_STATE_ENCRYPTION_PASSPHRASE }}
          aws-access-key-id:     ${{ secrets.TF_STATE_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.TF_STATE_SECRET_KEY }}
          linode-token:          ${{ secrets.LINODE_API_TOKEN }}
          region:                ${{ matrix.region }}
          github-token:          ${{ github.token }}
          kubeconfig-path:       ${{ github.workspace }}/.kube/config
          # A deployment with no cluster yet is a no-op, not a failure.
          allow-missing:         'true'

      - name: Ensure OpenBao initialized + unsealed + root token
        id: ensure
        if: steps.db.outputs.declared == 'true' && steps.kubeconfig.outputs.available == 'true'
        env:
          OPENBAO_ROOT_TOKEN: ${{ secrets.OPENBAO_ROOT_TOKEN }}
          RECOVERY_K1: ${{ secrets.OPENBAO_RECOVERY_KEY_1 }}
          RECOVERY_K2: ${{ secrets.OPENBAO_RECOVERY_KEY_2 }}
          RECOVERY_K3: ${{ secrets.OPENBAO_RECOVERY_KEY_3 }}
        run: llz ci bao-ensure-ready --region "$REGION"

      # Report-only unless db-admin-apply armed it. On success the command
      # refreshes the databases root's state itself — without that, the next
      # `llz ci seed-db-admin` would reconcile OpenBao back toward the
      # pre-rotation password in state and strand every consumer.
      # OPENBAO_ROOT_TOKEN comes from $GITHUB_ENV (the ensure step).
      - name: Rotate database admin credentials
        if: steps.db.outputs.declared == 'true' && steps.ensure.outputs.available == 'true'
        working-directory: terraform-iac-bootstrap/databases
        run: llz ci rotate-db-admin --region "$REGION" ${{ needs.setup.outputs.db-admin-apply == 'true' && '--apply' || '' }}

      # ── Revoke root token ────────────────────────────────────────────────────
      # bao-ensure-ready regenerates a root token via the recovery quorum when the
      # instance has none — which is the normal steady state, because bootstrap
      # tells the operator to DELETE OPENBAO_ROOT_TOKEN afterwards and `llz status`
      # nags until they do. runCIBaoRegenRoot writes the regenerated token back to
      # the infra-<region> secret, so without this step a monthly rotation would
      # PARK a live full-admin credential there: the hygiene end-state stops being
      # stable, `llz status` starts nagging again every month, and
      # LLZCredentialRootTokenParked fires on a schedule. Mirrors the same step in
      # llz-bootstrap-openbao.yml; always(), because a failed rotation must not
      # leave the token live either.
      - name: Revoke root token
        if: always() && steps.ensure.outputs.available == 'true'
        run: |
          if [ -z "${OPENBAO_ROOT_TOKEN:-}" ]; then
            exit 0
          fi
          llz openbao exec -- token revoke -self \
          && echo "Root token revoked." \
          || echo "::warning::Root token revocation failed — delete OPENBAO_ROOT_TOKEN from the infra-${REGION} environment secrets manually to prevent credential reuse"

      - name: No databases declared — nothing to rotate
        if: steps.db.outputs.declared != 'true'
        run: |
          echo "::notice title=No-op (no databases)::${REGION} declares no Managed Postgres clusters — nothing to rotate."
          echo "### Database admin rotation — no-op: ${REGION} declares no database clusters." >> "$GITHUB_STEP_SUMMARY"
