name: Scheduled Checks

# Thin caller for the reusable LLZ workflow — the full body (OpenBao/ESO health,
# rotation-SLA checks, PAT-expiry audits, PrometheusRule + cert-manager health,
# Go CVE audit, template-drift report) lives in the template and is sourced there,
# along with the fetch-kubeconfig action, the `llz openbao exec` passthrough, and
# the Go tools/ module the audit jobs build (see docs/adr/0003-vendor-actions-and-bodies-into-instances.md). This stub owns only the trigger surface: the
# weekly + daily + monthly crons.
# ADOPTERS: no fork needed for secrets — the reusable ./.github/workflows/llz-*.yml is
# copier-delivered into this repo, so `secrets: inherit` is same-repo (#201).

on:
  schedule:
    # Weekly Sunday 02:00 UTC — Go CVE audit + the belt-and-suspenders cluster
    # health probes (OpenBao/ESO, cert-manager) that the in-cluster llz-reconciler
    # now covers continuously via Prometheus alerts, so their hosted-runner probe
    # was demoted here from daily. Credential rotation ages are NOT among them:
    # they are gated daily by the 06:00 run (#483).
    - cron: "0 2 * * 0"
    # Daily 06:00 UTC — external credential-SLA checks the reconciler cannot see
    # in-cluster (lke-admin token age, Linode + GitHub PAT expiry).
    - cron: "0 6 * * *"
    # Monthly 1st @ 07:00 UTC — template drift report
    - cron: "0 7 1 * *"
  workflow_dispatch:
    inputs:
      drift_branch:
        description: "Template branch the drift report compares against"
        required: false
        default: main
      drift_strict:
        description: "Fail the drift report if the instance is behind the template"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  call:
    # Local reusable — the body ships in this repo and is re-rendered by
    # `llz upgrade`, so updates arrive as reviewable template-version PRs.
    # ADOPTERS: no fork needed — local reusable, `secrets: inherit` is same-repo (#201).
    uses: ./.github/workflows/llz-scheduled-checks.yml
    with:
      drift_branch: ${{ inputs.drift_branch || 'main' }}
      drift_strict: ${{ inputs.drift_strict || false }}
    secrets: inherit
