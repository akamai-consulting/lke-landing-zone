name: Cluster health (diagnostic + E2E validate)

# Thin caller for the reusable LLZ workflow — the body (fetch kubeconfig, cluster
# health, optional Loki S3-backed assertion), the fetch-kubeconfig action, and
# `llz ci health` all live in the template and are sourced there (see
# docs/adr/0003-vendor-actions-and-bodies-into-instances.md). The reusable
# workflow checks THIS instance back out (its terraform-iac-bootstrap TF state),
# so the instance copies only this stub.
#
# Two uses, one surface — selected by the gate flags below:
#   • Recovery / diagnostic (the all-defaults dispatch): report-only, the job
#     summary is the deliverable. Set verbose: true to dump describe/logs even
#     when nothing is failing.
#   • Gate mode: set fail-on-unhealthy: true. The run then fails on an unhealthy
#     cluster AND asserts the platform invariants (Loki S3-backed, the
#     observability/reconciler/wave-health suite lanes, alert-eval --strict).
#     There used to be a second `assert-loki` checkbox for that battery, which
#     named one of the things it turned on and left gate mode able to pass while
#     asserting nothing. Gate mode now means one thing.
#     NOTE: release-e2e no longer dispatches this — its former `validate` job was
#     folded into bootstrap-openbao's converge, so gate mode is an
#     OPERATOR-dispatched path only.
#
# ADOPTERS: no fork needed for secrets — the reusable ./.github/workflows/llz-*.yml is
# copier-delivered into this repo, so `secrets: inherit` is same-repo (#201).

on:
  workflow_dispatch:
    inputs:
      region:
        # Free-form string, not a fixed `choice`: deployments are dynamic
        # (`llz env add`), so a hardcoded list would reject adopter envs.
        # e.g. primary | secondary | staging | lab | e2e
        description: 'Deployment name to check — NOT a Linode region. e.g. primary | secondary | staging | lab | e2e'
        required: true
        type: string
        default: primary
      verbose:
        description: 'VERBOSE=1 — dump describe/logs even when nothing is failing'
        required: false
        type: boolean
        default: false
      fail-on-unhealthy:
        description: 'Fail the run on an unhealthy cluster (gate mode; default report-only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  call:
    # Local reusable — the body ships in this repo and is re-rendered by
    # `llz upgrade`, so updates arrive as reviewable template-version PRs — see
    # terraform-modules/RELEASING.md §"Template-repo releases".
    # ADOPTERS: no fork needed — local reusable, `secrets: inherit` is same-repo (#201).
    uses: ./.github/workflows/llz-cluster-health.yml
    with:
      region: ${{ inputs.region }}
      verbose: ${{ inputs.verbose }}
      fail-on-unhealthy: ${{ inputs.fail-on-unhealthy }}
    secrets: inherit
