name: llz-validate-credentials (reusable)

# Reusable (`workflow_call`) credential probe: runs `llz ci validate-tokens`
# against the secrets CI actually receives, for every deployment, provisioning
# NOTHING. No kubeconfig, no control-plane ACL, no Terraform state — one
# checkout and a handful of HTTP round-trips per deployment.
#
# The same probe already runs as a pre-flight inside llz-terraform.yml and
# llz-bootstrap-openbao.yml. This workflow exists because a pre-flight can only
# report once a provisioning run has already started: a dead or under-scoped
# credential surfaces ~35s into a promote an operator has just dispatched, not
# before they dispatch it. Nothing else probes SCOPE out of band —
# llz-scheduled-checks' credential single pane measures expiry only, so an
# under-scoped PAT is invisible to it right up until it 403s a build.
#
# GOTCHA — the probes are only as good as the context they can build, and they
# SKIP rather than fail when it is missing. GH_REPO is what the GitHub
# authorization probes derive their paths from; REGION is what names the
# environment for the infra-<region> secret probe. Drop either and this quietly
# demotes to a validity-only check that still reports all-green: with GH_REPO
# alone the repo-level Actions-secret probe runs but the environment-secret one
# reports `repo/region unknown`. Both, always.
# Maintainer rationale (incidents, PR archaeology, why-not-X) lives in the
# TEMPLATE repo: docs/workflows/llz-validate-credentials.md

on:
  workflow_call:

    secrets:
      # All `required: false` on purpose: these are environment-scoped secrets,
      # which cannot satisfy a workflow_call `secrets` contract at call time.
      # Absence is not this workflow's error to raise either — `validate-tokens`
      # reports an unset OPTIONAL credential as `– not set — skipped` and fails
      # on a REQUIRED one, which is a better message than a call-time contract
      # violation naming no deployment.
      LINODE_API_TOKEN:
        required: false
      LINODE_DNS_TOKEN:
        required: false
      APL_VALUES_REPO_TOKEN:
        required: false
      OPENBAO_SECRETS_WRITE_TOKEN:
        required: false
      GHCR_READ_TOKEN:
        required: false
      E2E_DISPATCH_TOKEN:
        required: false
      TF_STATE_ACCESS_KEY:
        required: false
      TF_STATE_SECRET_KEY:
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:

  # ── Discover deployments (the per-env matrix source of truth) ────────────────
  # The SAME reusable the scheduled checks and the credential rotation fan out
  # over, so the set probed here cannot drift from the set that gets rotated.
  discover:
    uses: ./.github/workflows/llz-discover-deployments.yml

  # ── Probe one deployment's credentials ──────────────────────────────────────
  probe:
    name: Probe credentials (${{ matrix.deployment }})
    needs: discover
    strategy:
      # One deployment's dead credential must not cancel its siblings' probes.
      # The deliverable of this run is the state of EVERY deployment; a
      # fail-fast cancellation would answer for one and leave the rest unknown,
      # which is the ambiguity the workflow exists to remove.
      fail-fast: false
      matrix:
        # `deployment`, not `region`: these are deployment names, and the older
        # matrices' `region` is a known misnomer this does not propagate.
        deployment: ${{ fromJSON(needs.discover.outputs.deployments) }}
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.TF_IMAGE }}
    # Resolves the infra-<deployment> secrets. WITHOUT THIS every `secrets.*`
    # below is the EMPTY STRING — not an error — and this workflow would report
    # a perfectly healthy instance as entirely unset. Enforced by
    # `llz ci workflow-secret-scope`.
    environment: infra-${{ matrix.deployment }}
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout the instance (spec + tfvars)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Probes two independent things per credential: validity (does it
      # authenticate?) and capability (is it scoped for the job it exists for?).
      # An under-scoped PAT authenticates perfectly and still 403s the operation
      # — which is the whole reason this is not just an expiry check.
      - name: Probe credential validity + scope
        env:
          # BOTH are load-bearing — see the GOTCHA at the top of this file.
          GH_REPO:                     ${{ github.repository }}
          REGION:                      ${{ matrix.deployment }}
          LINODE_API_TOKEN:            ${{ secrets.LINODE_API_TOKEN }}
          LINODE_DNS_TOKEN:            ${{ secrets.LINODE_DNS_TOKEN }}
          APL_VALUES_REPO_TOKEN:       ${{ secrets.APL_VALUES_REPO_TOKEN }}
          OPENBAO_SECRETS_WRITE_TOKEN: ${{ secrets.OPENBAO_SECRETS_WRITE_TOKEN }}
          GHCR_READ_TOKEN:             ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_USERNAME:               ${{ vars.GHCR_USERNAME }}
          E2E_DISPATCH_TOKEN:          ${{ secrets.E2E_DISPATCH_TOKEN }}
          TF_STATE_ACCESS_KEY:         ${{ secrets.TF_STATE_ACCESS_KEY }}
          TF_STATE_SECRET_KEY:         ${{ secrets.TF_STATE_SECRET_KEY }}
          # The state keys are probed with a signed SigV4 request, so they need
          # a bucket + endpoint to sign against; without these two they report
          # `can't sign a probe` rather than passing unchecked.
          TF_STATE_ENDPOINT:           ${{ vars.TF_STATE_ENDPOINT }}
          TF_STATE_BUCKET:             ${{ vars.TF_STATE_BUCKET }}
        run: llz ci validate-tokens
