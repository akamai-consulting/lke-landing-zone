name: Terraform init (S3 backend)
description: >
  Initialize Terraform with the project S3 backend.
  Inherits REGION and TF_STATE_BUCKET from the caller's environment.

inputs:
  module:
    description: Module directory under terraform-iac-bootstrap/ (cluster, object-storage, databases, vpc)
    required: false
    default: cluster
  aws-access-key-id:
    description: AWS access key for the S3 state backend
    required: true
  aws-secret-access-key:
    description: AWS secret key for the S3 state backend
    required: true
  github-token:
    description: >
      Token used to fetch first-party git:: Terraform module sources hosted on
      this same GitHub (Enterprise) server. Defaults to the workflow token,
      which has contents:read on this repo. Override only if the modules live in
      a different repo needing a broader-scoped token.
    required: false
    default: ${{ github.token }}
  state-encryption-passphrase:
    description: >
      Passphrase for OpenTofu native state+plan encryption (GitHub secret
      TF_STATE_ENCRYPTION_PASSPHRASE). Exported as TF_ENCRYPTION for every
      subsequent step in the calling job. REQUIRED: the roots carry an
      `encryption` block, so a run without this fails rather than writing
      plaintext state — see roots' encryption.tf.
    required: true
  state-encryption-key-name:
    description: >
      HCL name of the CURRENT pbkdf2 key provider (repo variable
      TF_STATE_ENCRYPTION_KEY_NAME; default `llz`). LOAD-BEARING: OpenTofu stores
      each key provider's pbkdf2 SALT in the state metadata keyed by this name
      (`meta["key_provider.pbkdf2.<name>"]`), so a passphrase can only decrypt
      state that was written under the SAME name. Renaming it in place makes the
      old salt be fed to the new passphrase and every decrypt fails. Rotation
      therefore introduces a NEW name and keeps the old one; see
      state-encryption-passphrase-old.
    required: false
    default: "llz"
  state-encryption-passphrase-old:
    description: >
      PREVIOUS passphrase, set ONLY during a rotation window (secret
      TF_STATE_ENCRYPTION_PASSPHRASE_OLD). When present the action adds a second
      key provider and an ENCRYPTED `fallback`, so OpenTofu reads state written
      with the old key and rewrites it with the new one. Empty in steady state.
    required: false
    default: ""
  state-encryption-key-name-old:
    description: >
      HCL name the PREVIOUS passphrase was written under (repo variable
      TF_STATE_ENCRYPTION_KEY_NAME_OLD). Required whenever
      state-encryption-passphrase-old is set — the fallback cannot find its salt
      without the original name.
    required: false
    default: ""
  state-key:
    description: >
      Override the S3 state key. Default is <module>/<REGION>/terraform.tfstate
      (per-deployment). The shared-VPC root sets vpc/<network>/terraform.tfstate so
      one VPC's state is shared across the deployments that attach to it.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Spec-driven instances render the per-env tfvars on the fly: they are
    # gitignored build artifacts (environments/<env>.yaml is the source of truth),
    # so every terraform op must regenerate them first. This is the universal
    # guarantee — every TF job inits through this action, so none can read a stale
    # or missing <env>.tfvars. No-op for instances without a spec (the `test -f`
    # gate). REGION is inherited from the caller; render every env when it is unset
    # (e.g. a job that targets a peer env sets its own REGION). A working `llz` is
    # therefore a hard prerequisite for any terraform op — by design.
    - name: Render tfvars from the LandingZone spec (spec-driven instances)
      shell: bash
      run: |
        if [ -f landingzone.yaml ]; then
          if [ -n "${REGION:-}" ]; then
            llz render "$REGION" --tfvars-only
          else
            llz render --tfvars-only
          fi
        fi

    # First-party modules are consumed as
    #   git::ssh://git@<host>/<org>/<repo>.git//terraform-modules/<name>?ref=<tag>
    # (the published, SemVer-tagged reuse units — see terraform-modules/RELEASING.md).
    # The CI container has no SSH key for <host> and the bind-mounted workspace
    # trips git's dubious-ownership guard, so `tofu init`'s module clones
    # would fail. The shared git-auth script (trust paths + rewrite SSH→HTTPS)
    # fixes both; it lives once and is shared with fetch-kubeconfig.
    # State/plan encryption. The roots' encryption.tf carries only the posture;
    # the KEY MATERIAL arrives here, so the passphrase never lands in the repo,
    # in a tfvars file, or in state. Written to $GITHUB_ENV rather than exported
    # in this step's shell: every LATER step in the calling job runs tofu too
    # (plan, apply, output, refresh) and each one needs to decrypt.
    #
    # Preflighted with an explicit message because OpenTofu's own failure for a
    # missing TF_ENCRYPTION is "Invalid expression — A single static variable
    # reference is required", pointing at the encryption block rather than at the
    # missing secret, which sends people to edit the wrong file.
    - name: Export TF_ENCRYPTION (state + plan encryption at rest)
      shell: bash
      env:
        PASSPHRASE:     ${{ inputs.state-encryption-passphrase }}
        KEY_NAME:       ${{ inputs.state-encryption-key-name }}
        PASSPHRASE_OLD: ${{ inputs.state-encryption-passphrase-old }}
        KEY_NAME_OLD:   ${{ inputs.state-encryption-key-name-old }}
      run: |
        if [ -z "${PASSPHRASE}" ]; then
          echo "::error title=Missing TF_STATE_ENCRYPTION_PASSPHRASE::The Terraform roots encrypt state at rest, so this secret is required. Generate one (openssl rand -base64 32), store it as the TF_STATE_ENCRYPTION_PASSPHRASE repository secret, and ESCROW IT OFFLINE — losing it makes every state file unrecoverable. See docs/adr/0007-terraform-state-encryption.md."
          exit 1
        fi
        # Mask before anything can echo it.
        echo "::add-mask::${PASSPHRASE}"
        # The passphrase is interpolated into an HCL string below, so a value
        # containing a quote, a backslash or a newline would not merely break
        # parsing — it could CLOSE the string and append arbitrary encryption
        # configuration (e.g. swap in method.unencrypted). Restrict it to the
        # base64 alphabet, which is what the documented `openssl rand -base64 32`
        # produces, and reject anything else rather than escaping it.
        case "${PASSPHRASE}" in
          *[!A-Za-z0-9+/=_-]*)
            echo "::error title=Invalid TF_STATE_ENCRYPTION_PASSPHRASE::The passphrase must contain only [A-Za-z0-9+/=_-] — it is interpolated into an HCL string, where a quote or backslash could inject encryption configuration. Regenerate it with 'openssl rand -base64 32'."
            exit 1
            ;;
        esac
        # pbkdf2 requires at least 16 characters; OpenTofu rejects shorter ones
        # at init with a message about the key provider rather than the secret.
        if [ "${#PASSPHRASE}" -lt 16 ]; then
          echo "::error title=TF_STATE_ENCRYPTION_PASSPHRASE too short::pbkdf2 requires >= 16 characters (got ${#PASSPHRASE}). Regenerate it with 'openssl rand -base64 32'."
          exit 1
        fi
        # The key-provider NAME is decryption metadata, not cosmetics: OpenTofu
        # stores pbkdf2's salt at meta["key_provider.pbkdf2.<name>"], so state can
        # only be decrypted by presenting its passphrase under the name it was
        # WRITTEN with. Names must therefore be HCL-identifier safe, and a rotation
        # must introduce a new name rather than redefine the existing one.
        # (Verified against OpenTofu 1.12.3: reusing the name for a new passphrase
        # fails with "decryption failed for all attempted".)
        for n in "${KEY_NAME}" ${KEY_NAME_OLD:+"${KEY_NAME_OLD}"}; do
          case "${n}" in
            ''|*[!A-Za-z0-9_]*)
              echo "::error title=Invalid state-encryption key name::Key-provider names are HCL identifiers interpolated into the encryption config; got '${n}'. Use [A-Za-z0-9_] only."
              exit 1
              ;;
          esac
        done
        if [ -n "${PASSPHRASE_OLD}" ]; then
          echo "::add-mask::${PASSPHRASE_OLD}"
          # Same injection guard as the current passphrase — this one is
          # interpolated into the very same HCL string context.
          case "${PASSPHRASE_OLD}" in
            *[!A-Za-z0-9+/=_-]*)
              echo "::error title=Invalid TF_STATE_ENCRYPTION_PASSPHRASE_OLD::The previous passphrase must contain only [A-Za-z0-9+/=_-]."
              exit 1
              ;;
          esac
          if [ -z "${KEY_NAME_OLD}" ]; then
            echo "::error title=Missing TF_STATE_ENCRYPTION_KEY_NAME_OLD::A rotation window sets the previous passphrase, so it must also declare the key-provider NAME that passphrase wrote state under — the fallback cannot locate its pbkdf2 salt without it."
            exit 1
          fi
          if [ "${KEY_NAME_OLD}" = "${KEY_NAME}" ]; then
            echo "::error title=Key names collide::TF_STATE_ENCRYPTION_KEY_NAME and _KEY_NAME_OLD are both '${KEY_NAME}'. The new passphrase MUST use a different name: reusing it feeds the old salt to the new key and every decrypt fails."
            exit 1
          fi
        fi
        # method.unencrypted.migrate is referenced by the roots' phase-1 fallback
        # (read plaintext, write encrypted). It is declared here so that deleting
        # the fallback in phase 2 needs no change to this action.
        {
          echo 'TF_ENCRYPTION<<TF_ENCRYPTION_EOF'
          echo "key_provider \"pbkdf2\" \"${KEY_NAME}\" {"
          echo "  passphrase = \"${PASSPHRASE}\""
          echo '}'
          echo "method \"aes_gcm\" \"${KEY_NAME}\" {"
          echo "  keys = key_provider.pbkdf2.${KEY_NAME}"
          echo '}'
          echo 'method "unencrypted" "migrate" {}'
          if [ -n "${PASSPHRASE_OLD}" ]; then
            echo "key_provider \"pbkdf2\" \"${KEY_NAME_OLD}\" {"
            echo "  passphrase = \"${PASSPHRASE_OLD}\""
            echo '}'
            echo "method \"aes_gcm\" \"${KEY_NAME_OLD}\" {"
            echo "  keys = key_provider.pbkdf2.${KEY_NAME_OLD}"
            echo '}'
            # ENCRYPTED fallback — legal alongside `enforced` (which bans only
            # method.unencrypted), so a rollover never relaxes the posture.
            echo 'state {'
            echo "  method = method.aes_gcm.${KEY_NAME}"
            echo '  fallback {'
            echo "    method = method.aes_gcm.${KEY_NAME_OLD}"
            echo '  }'
            echo '}'
          else
            echo 'state {'
            echo "  method = method.aes_gcm.${KEY_NAME}"
            echo '}'
          fi
          # Plans are ephemeral and always written with the CURRENT key, so they
          # never need the fallback.
          echo 'plan {'
          echo "  method = method.aes_gcm.${KEY_NAME}"
          echo '}'
          echo 'TF_ENCRYPTION_EOF'
        } >> "$GITHUB_ENV"

    - name: Authenticate git for published module sources
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        # shellcheck source=../_lib/git-auth.sh
        . "$GITHUB_ACTION_PATH/../_lib/git-auth.sh"

    - name: Terraform init
      shell: bash
      working-directory: terraform-iac-bootstrap/${{ inputs.module }}
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.aws-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.aws-secret-access-key }}
      run: |
        KEY="${{ inputs.state-key }}"
        [ -n "$KEY" ] || KEY="${{ inputs.module }}/$REGION/terraform.tfstate"
        tofu init \
          -backend-config="bucket=$TF_STATE_BUCKET" \
          -backend-config="key=$KEY" \
          -backend-config="region=us-east-1"
