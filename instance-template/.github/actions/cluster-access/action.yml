name: Cluster access (kubeconfig + runner ACL)
description: >
  The shared job preamble for any job that talks to a deployment's LKE cluster:
  fetch the kubeconfig from Terraform state and open this hosted runner's
  dynamic egress IP in the LKE-E control-plane ACL. Wraps the fetch-kubeconfig
  and lke-runner-acl actions in the order every cluster-facing job repeats.
  `llz` itself is baked into the TF_IMAGE these jobs run in
  (dockerfiles/Dockerfile (ci-tofu target)) — already on PATH, no install step.

  Sibling actions (fetch-kubeconfig, lke-runner-acl) live alongside this action
  under the instance's own .github/actions/ — the whole tree is vendored into every
  instance. A composite action's `uses: ./<path>` resolves against $GITHUB_WORKSPACE
  (the caller's checkout), which for a cluster-facing job IS the instance repo, so
  `./.github/actions/<name>` is present and resolves with no checkout of any other
  repo. The instance is self-contained — no cross-repo fetch — which is what lets it
  run on an air-gapped GitHub Enterprise.

  CALLERS MUST SET `timeout-minutes` ON THIS STEP (6 is the convention). A
  composite action cannot set `timeout-minutes` on its own steps — GitHub only
  honours it on a caller's step — so without one this action inherits the JOB
  budget and a hang burns the whole thing silently. It has happened: an e2e run
  spent 15m34s here against a normal 40-48s, and nothing failed or warned; the
  time was simply gone, and only showed up by diffing step timestamps against an
  earlier run. Every step in this action is a bounded API/state read, so minutes
  of wall-clock is always a fault, never load.

  A composite action has no post-job hook, so the caller MUST pair this with a
  trailing lke-runner-acl step (mode: revoke, if: always()) passing the same
  linode-token (the caller's secrets.LINODE_API_TOKEN) and region this action
  received — see any llz-* workflow's revoke step, e.g. llz-cluster-health.yml.
  (Don't write the brace-wrapped secrets expression here: an action manifest is
  template-validated and a composite action has no secrets context, so it fails
  to load.)

inputs:
  aws-access-key-id:
    description: AWS access key for the S3 state backend (kubeconfig is read from Terraform state).
    required: true
  aws-secret-access-key:
    description: AWS secret key for the S3 state backend.
    required: true
  state-encryption-passphrase:
    description: >
      Passphrase for OpenTofu state+plan encryption (GitHub secret
      TF_STATE_ENCRYPTION_PASSPHRASE). REQUIRED: the kubeconfig is read from
      Terraform state, and `llz ci fetch-kubeconfig-state` runs its own `tofu
      init` against a root whose encryption.tf REFERENCES the encryption methods.
      Without this the init fails on "Reference to undeclared encryption method",
      which names the roots rather than the missing secret (ADR 0007).
    required: true
  linode-token:
    description: Linode API token used to open this runner's egress IP in the control-plane ACL.
    required: true
  region:
    description: Deployment key (e.g. primary, secondary, e2e). Names the state key and resolves the cluster for the ACL.
    required: true
  github-token:
    description: >
      Token for first-party git:: Terraform module sources (the kubeconfig
      fetch runs `tofu init`). Defaults to the workflow token; the
      first-party modules are public, so the default suffices.
    required: false
    default: ${{ github.token }}
  kubeconfig-path:
    description: Path to write the kubeconfig file ($HOME/$RUNNER_TEMP expand at run time).
    required: false
    default: $HOME/.kube/config
  allow-missing:
    description: >
      Passed through to fetch-kubeconfig. When 'true' and the cluster has no
      kubeconfig_raw output yet, this action sets available=false and skips the
      ACL open instead of failing; gate downstream cluster steps on the
      `available` output.
    required: false
    default: 'false'
  register-runner-lease:
    description: >
      When 'true', also lease this runner's IP in the firewall-runner-acl
      ConfigMap so the EAA firewall-controller preserves it across reconciles —
      set it for jobs whose kubectl phase outlasts one reconcile interval (~10m),
      notably the convergence gate. The paired revoke step must pass the same
      kubeconfig to release the lease. Default 'false': short jobs use the
      Linode-API-only ACL open and need no ConfigMap access.
    required: false
    default: 'false'

outputs:
  available:
    description: "'true' if the kubeconfig was fetched; 'false' if allow-missing=true and the output was absent."
    value: ${{ steps.kubeconfig.outputs.available }}

runs:
  using: composite
  steps:
    # Siblings resolve locally: the instance vendors the whole .github/actions/ tree,
    # and a composite `uses: ./<path>` resolves against $GITHUB_WORKSPACE (the caller's
    # instance checkout), so ./.github/actions/<name> is present with no cross-repo
    # checkout. (Pre-vendoring this action self-checked-out the template into
    # _llz-template — removed: it broke on air-gapped GHE and is now unnecessary.)
    # MUST precede the fetch: that step runs `llz ci fetch-kubeconfig-state`,
    # which does its own `tofu init` and therefore needs TF_ENCRYPTION exactly as
    # a terraform-init-driven job does. This path does not go through
    # terraform-init, which is why it silently lacked the env var until ADR 0007's
    # encryption.tf made the omission fatal.
    - name: Export TF_ENCRYPTION (state + plan encryption at rest)
      uses: ./.github/actions/tf-encryption-env
      with:
        state-encryption-passphrase: ${{ inputs.state-encryption-passphrase }}

    - name: Fetch kubeconfig from Terraform state
      id: kubeconfig
      uses: ./.github/actions/fetch-kubeconfig
      with:
        aws-access-key-id:     ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        github-token:          ${{ inputs.github-token }}
        kubeconfig-path:       ${{ inputs.kubeconfig-path }}
        region:                ${{ inputs.region }}
        allow-missing:         ${{ inputs.allow-missing }}

    # Open this hosted-runner's dynamic egress IP in the LKE-E control-plane
    # ACL so kubectl is permitted; the caller's paired revoke step (if: always())
    # closes it at job end. Skipped when allow-missing tolerated a torn-down
    # cluster — there is nothing to ACL.
    - name: Open control-plane ACL for this runner
      if: steps.kubeconfig.outputs.available == 'true'
      uses: ./.github/actions/lke-runner-acl
      with:
        mode:         open
        linode-token: ${{ inputs.linode-token }}
        region:       ${{ inputs.region }}
        # Only lease in the ConfigMap when the caller opted in (long-running
        # kubectl jobs); empty kubeconfig keeps the Linode-API-only behaviour.
        kubeconfig:   ${{ inputs.register-runner-lease == 'true' && inputs.kubeconfig-path || '' }}
