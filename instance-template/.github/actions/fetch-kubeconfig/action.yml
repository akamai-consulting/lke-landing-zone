name: Fetch kubeconfig (Terraform state)
description: >
  Initialize Terraform (cluster module) and write the cluster kubeconfig to the
  specified path. Inherits TF_STATE_BUCKET from the caller's environment.
  REGION is read from the caller's environment; override with the region input
  when the job does not set a REGION env var.

inputs:
  aws-access-key-id:
    description: AWS access key for the S3 state backend
    required: true
  aws-secret-access-key:
    description: AWS secret key for the S3 state backend
    required: true
  kubeconfig-path:
    description: >
      Path to write the kubeconfig file. $HOME / $RUNNER_TEMP / $GITHUB_WORKSPACE are
      expanded by llz, not by this action; any other variable, or an unset one,
      is an error rather than a literal path.
    required: true
  region:
    description: Region (primary or secondary). Defaults to REGION env var when blank.
    required: false
    default: ''
  allow-missing:
    description: >
      If 'true', set output available=false instead of failing when the
      cluster has no kubeconfig_raw Terraform output yet.
    required: false
    default: 'false'
  github-token:
    description: >
      Token used to fetch first-party git:: Terraform module sources that the
      cluster root references (the kubeconfig fetch runs `tofu init`, which
      clones those modules). Defaults to the workflow token; the first-party
      modules are public, so the default suffices.
    required: false
    default: ${{ github.token }}

outputs:
  available:
    description: "'true' if the kubeconfig was fetched; 'false' if allow-missing=true and output was absent"
    value: ${{ steps.fetch.outputs.available }}

runs:
  using: composite
  steps:
    # The cluster root pulls its modules from
    #   git::ssh://git@<host>/<org>/<repo>.git//terraform-modules/<name>?ref=<tag>
    # and the CI container has no SSH key, so `tofu init` below would fail
    # with "Failed to download module". The shared git-auth script (trust paths +
    # rewrite SSH→HTTPS via github-token) fixes that; it is the same logic
    # terraform-init uses, sourced from one place.
    - name: Authenticate git for published module sources
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        # shellcheck source=../_lib/git-auth.sh
        . "$GITHUB_ACTION_PATH/../_lib/git-auth.sh"

    # fetch-kubeconfig-state owns the init + output extraction + the
    # empty-output diagnostics (a failed/odd init reading a different state
    # than cluster-bootstrap is the classic suspect). It also RENDERS the
    # gitignored cluster root's *.tf first (the instance commits zero Terraform),
    # so no inline render step is needed here — the logic is unit-tested Go.
    - name: Fetch kubeconfig
      id: fetch
      shell: bash
      working-directory: terraform-iac-bootstrap/cluster
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.aws-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.aws-secret-access-key }}
        # ALL THREE VIA env:. This action's `region` is reachable from a
        # workflow_call input — llz-breakglass-openbao.yml takes one and passes it
        # through cluster-access to here — so interpolating it put attacker-shaped
        # text into a script in a job holding cloud credentials.
        KUBE_REGION_IN:  ${{ inputs.region }}
        KUBECONFIG_PATH: ${{ inputs.kubeconfig-path }}
        # A literal --allow-missing or empty, so it was never dangerous; it moves
        # anyway, because a rule with exceptions is one a reader stops trusting.
        ALLOW_MISSING:   ${{ inputs.allow-missing == 'true' && '--allow-missing' || '' }}
      run: |
        KUBE_REGION="$KUBE_REGION_IN"
        # $HOME/$RUNNER_TEMP in --output are expanded by llz (clusteraccess/
        # pathvars.go), not here: GitHub expands nothing in a `with:` value, the
        # old interpolated form expanded it only by accident, and `eval` — the
        # obvious shell repair — is the one that would run a caller-supplied path.
        # shellcheck disable=SC2086 # ALLOW_MISSING is a flag or empty and must word-split away
        llz ci fetch-kubeconfig-state \
          --region "${KUBE_REGION:-$REGION}" \
          --output "$KUBECONFIG_PATH" \
          $ALLOW_MISSING
