name: Dependabot auto-merge

on:
  pull_request:

# No workflow-level `permissions:` block: the only job declares its own (below),
# which overrides it entirely. The previous workflow-level `contents: write` was
# therefore granted to nothing, while reading as though the workflow could push.

jobs:
  auto-merge:
    name: Auto-merge Dependabot patch/minor PRs
    runs-on: ubuntu-latest
    # Bounded from measured history (gh api only); GitHub's default is 6h.
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Auto-merge patch and minor updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # There is no checkout step here (nothing needs the tree), so gh has no
          # git remote to infer the repo from — name it explicitly.
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # `gh` is preinstalled on the runner and does natively what this step used
        # to hand-roll with two curls and three `python3 -c` JSON parsers.
        #
        # The rewrite also fixes a silent failure. The old final call was
        # `curl -sSf -X POST` against $GITHUB_GRAPHQL_URL — but `-f` only fails on
        # HTTP >= 400, and GraphQL reports errors as HTTP 200 with an `errors`
        # array. So when enablePullRequestAutoMerge was rejected (auto-merge
        # disabled on the repo, branch protection missing, PR not mergeable) the
        # step exited 0 and reported green having enabled nothing, and nobody read
        # the response body. `gh pr merge --auto` performs the same mutation and
        # exits non-zero when it fails.
        run: |
          set -euo pipefail
          # THE METADATA IS IN THE COMMIT MESSAGE, NEVER THE PR BODY. This step
          # used to read `gh pr view --json body` and grep it for
          # `update-type: version-update:semver-*`. Dependabot does not put that
          # string there — the body carries release notes and an
          # "Updates `x` from a to b" line, while the `updated-dependencies:`
          # block (dependency-name, dependency-version, update-type,
          # dependency-group) is a commit-message trailer. So the second grep
          # fell through to "No recognised semver update-type found — skipping"
          # on EVERY Dependabot PR since this workflow was written: nothing ever
          # auto-merged, and the major-version guard below never rejected
          # anything either, because it was shadowed by a check that could not
          # match. Measured on PR #498: `update-type` appears 0 times in the
          # body and once in the commit message.
          #
          # A grouped PR trailer lists every dependency in the group, so a
          # single major anywhere in the group still trips the first grep.
          meta="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER/commits" --jq '.[].commit.message')"

          if grep -qF 'update-type: version-update:semver-major' <<<"$meta"; then
            echo "Contains major update — skipping auto-merge"
            exit 0
          fi
          if ! grep -qF 'update-type: version-update:semver-' <<<"$meta"; then
            echo "No recognised semver update-type found — skipping"
            exit 0
          fi

          echo "Patch/minor update — enabling auto-merge"
          gh pr merge "$PR_NUMBER" --auto --squash
