name: Build Container Images

on:
  push:
    # Rebuild on EVERY push to main — no path filter. The ci images bake the
    # `llz` binary stamped with `dev-<github.sha>` (--build-arg LLZ_VERSION), and
    # `llz ci assert-image-fresh` (run by release-e2e.yml + the instance dispatch
    # preflight) hard-fails when the `:latest` image's baked sha doesn't match the
    # checked-out template ref. A path filter on dockerfiles/ and tools/ meant any main
    # merge that DIDN'T touch those paths (a chart-only or docs-only change) left
    # `:latest` stamped at an older sha, so the next e2e tripped the freshness
    # guard ("image/template skew"). Building on every main push keeps `:latest`'s
    # baked sha == HEAD; the LLZ_VERSION build-arg cache-busts the `go build` layer
    # so the sha is genuinely re-stamped, while unchanged source layers stay cached
    # (a no-op rebuild is mostly cache hits + a re-tag/push).
    branches: [main, master]
  schedule:
    - cron: '0 3 * * 1'  # Weekly Monday rebuild
  workflow_dispatch:
    inputs:
      image:
        description: 'Which image to build'
        required: true
        default: all
        type: choice
        options: [terraform, kubernetes, devcontainer, llz, all]
      sha:
        description: 'Full commit SHA to build (default: the dispatched ref HEAD). release-e2e passes the exact commit under test so the sha-<> tag it waits on matches even if the branch HEAD has since moved — `gh workflow run --ref` can only name a branch, so without this a build races HEAD.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

# Serialize builds per ref. Because this runs on EVERY main push (see above), two
# merges in quick succession otherwise race the same mutable `:latest` tag and the
# same `--cache-to type=gha,scope=<image>` entry — and the later-FINISHING run wins
# `:latest`, which may be the OLDER commit. That reintroduces exactly the
# `:latest`-vs-HEAD skew the no-path-filter design above exists to prevent, just
# through a different door.
#
# cancel-in-progress MUST stay false: cancelling a mid-flight build would leave
# that commit's `sha-<>` tag unpublished, which `llz ci pin-instance-images
# --build-if-missing` then has to re-trigger from scratch (and may be actively
# waiting on). Serialize; never cancel.
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # The commit to build: a caller-supplied sha (release-e2e) pins the exact commit
  # so its sha-<> tag matches even when the branch HEAD moved after dispatch; else
  # the dispatched ref HEAD / pushed commit. (For a push event `inputs` is empty →
  # falls back to github.sha.)
  SHA: ${{ inputs.sha || github.sha }}

jobs:
  # ── Which images to build ────────────────────────────────────────────────────
  # The four images are built by ONE matrix job below; this computes which rows it
  # runs. It exists because `matrix` is NOT an available context in a job-level
  # `if:` (actionlint: "available contexts are github, inputs, needs, vars"), so
  # the per-image dispatch filter cannot live on the build job itself.
  plan:
    name: Plan image matrix
    runs-on: ubuntu-latest
    # Bounded from measured history (p50 0.1 / max 0.1); GitHub's default is 6h.
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Pick the images to build
        id: pick
        env:
          # Non-dispatch triggers (push, schedule) always build everything.
          WANT: ${{ github.event_name == 'workflow_dispatch' && inputs.image || 'all' }}
        run: |
          set -euo pipefail
          ALL='[
            {"key":"terraform","image":"ci-tofu","target":"ci-tofu","version":"1.12.5","alias":"ci-terraform"},
            {"key":"kubernetes","image":"ci-kubernetes","target":"ci-kubernetes","version":"1.34.10","alias":""},
            {"key":"devcontainer","image":"devcontainer","target":"devcontainer","version":"","alias":""},
            {"key":"llz","image":"llz","target":"llz","version":"","alias":""}
          ]'
          if [ "${WANT}" = "all" ]; then
            SEL="${ALL}"
          else
            SEL="$(printf '%s' "${ALL}" | jq -c --arg k "${WANT}" '[.[] | select(.key == $k)]')"
          fi
          if [ "$(printf '%s' "${SEL}" | jq 'length')" -eq 0 ]; then
            echo "::error::no image matches '${WANT}' — expected one of terraform|kubernetes|devcontainer|llz|all"
            exit 1
          fi
          printf 'matrix=%s\n' "$(printf '%s' "${SEL}" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"

  # ── Build + sign, one row per image ──────────────────────────────────────────
  # Was four jobs (build-terraform/-kubernetes/-devcontainer/-llz) that a
  # normalized diff showed to be identical except for THREE things: the dispatch
  # key, the image name, and an optional version tag. Everything else — platforms,
  # --provenance/--sbom, the tools-src build context, the gha cache scopes, and the
  # keyless cosign signature — was duplicated four times, so every change to the
  # build or signing recipe was four edits with three chances to miss one.
  build:
    name: Build ${{ matrix.image }}
    needs: plan
    runs-on: ubuntu-latest
    # Bounded from measured history (max 7.5 (devcontainer, multi-arch+QEMU)); GitHub's default is 6h.
    # 45, RECOMPUTED FOR THE RETRY. The push step now makes up to three attempts
    # with 90s + 180s of backoff between them, so a cold-cache multi-arch row that
    # needs its retries can spend ~4.5 minutes waiting on top of the build. At 30
    # it would be killed by the runner MID-RETRY — emitting neither the retry
    # warnings nor the "this is GHCR's secondary rate limit, not a permissions
    # problem" error — and the image would stay unpublished, which is exactly the
    # state pin-instance-images' requiredShaImages wait then blocks an e2e on. A
    # retry budget is only real if the job can outlive it.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      # One image failing must not cancel the others — they are independent
      # publishes, and a partial set is more useful than none.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }} # build the requested commit, not just the ref HEAD

      - name: Resolve GHCR namespace
        id: ns
        run: echo "repo=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          # All rows run in parallel and each pull the same binfmt image, which
          # setup-qemu-action otherwise caches under one fixed GHA key — so they
          # race to reserve it and log "another job may be creating this cache".
          # The image is tiny; skip caching it.
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # --provenance/--sbom attach SLSA provenance + an SBOM as OCI attestations in
      # the pushed index; --metadata-file captures the digest so the signature below
      # binds to the exact manifest that was pushed, not to a tag that could move.
      # The tools module is supplied via --build-context tools-src=tools so the
      # Dockerfile's llz stage can build without broadening the primary context.
      - name: Build and push ${{ matrix.image }}
        id: build
        env:
          REPO:    ${{ steps.ns.outputs.repo }}
          IMAGE:   ${{ matrix.image }}
          TARGET:  ${{ matrix.target }}
          VERSION: ${{ matrix.version }}
          ALIAS:   ${{ matrix.alias }}
        run: |
          set -euo pipefail
          # The version tag is per-image and optional (ci-tofu pins the OpenTofu
          # version, ci-kubernetes the kubectl one; devcontainer and llz carry
          # none), so it is appended rather than templated inline.
          TAGS=(--tag "${REPO}/${IMAGE}:latest" --tag "${REPO}/${IMAGE}:sha-${SHA}")
          [ -n "${VERSION}" ] && TAGS+=(--tag "${REPO}/${IMAGE}:${VERSION}")
          # DEPRECATION WINDOW: ci-tofu is also published as ci-terraform. The
          # image was renamed when it stopped containing HashiCorp Terraform, but
          # instances pin it through vars.TF_IMAGE — an explicit pin nobody's
          # migration is obliged to update on our schedule. Publishing both names
          # from one build means an un-updated pin keeps resolving to the CURRENT
          # image rather than silently rotting on the last ci-terraform push.
          # Remove the alias (and this block) once no instance pins the old name.
          if [ -n "${ALIAS}" ]; then
            TAGS+=(--tag "${REPO}/${ALIAS}:latest" --tag "${REPO}/${ALIAS}:sha-${SHA}")
            [ -n "${VERSION}" ] && TAGS+=(--tag "${REPO}/${ALIAS}:${VERSION}")
          fi
          # RETRIED, because the failure this absorbs is not ours and not rare.
          # GHCR answers a burst of pushes with `403 Forbidden` / 429 — a
          # SECONDARY rate limit that `gh api rate_limit` does not show, so it
          # reads as a permissions error and sends people to package settings.
          # Measured: three build-images runs inside two hours (twelve pushes)
          # and the `llz` row 403'd on `:latest` while the other three images in
          # the SAME run pushed fine. That left the commit's llz image
          # unpublished, Kyverno then refused every workload referencing it, and a
          # release-e2e spent its whole convergence budget on the consequence.
          # The build itself is cached, so a retry re-pushes rather than rebuilds.
          for attempt in 1 2 3; do
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --push \
              --provenance=true \
              --sbom=true \
              --metadata-file /tmp/build-meta.json \
              --build-context tools-src=tools \
              --build-arg "LLZ_VERSION=dev-${SHA}" \
              "${TAGS[@]}" \
              --cache-from "type=gha,scope=${IMAGE}" \
              --cache-to   "type=gha,scope=${IMAGE},mode=max" \
              --file dockerfiles/Dockerfile --target "${TARGET}" \
              dockerfiles && break
            [ "${attempt}" -eq 3 ] && { echo "::error::${IMAGE} failed to push after 3 attempts — if the log says 403/429 this is GHCR's secondary rate limit, not a permissions problem; space the builds out and re-run."; exit 1; }
            echo "::warning::${IMAGE} push attempt ${attempt} failed — retrying (GHCR's secondary rate limit answers a burst with 403/429)." && sleep $((attempt * 90))
          done
          echo "digest=$(jq -r '."containerimage.digest"' /tmp/build-meta.json)" >> "$GITHUB_OUTPUT"

      # Signed per REPOSITORY, not per digest: cosign stores the signature as a
      # `sha256-<digest>.sig` tag inside the repo it was pushed to, so a signature
      # on ci-tofu does NOT appear under the ci-terraform alias even though both
      # names resolve to the same manifest. Sign the alias too, or the deprecation
      # window would quietly publish an unsigned image to anyone still pinning the
      # old name — the exact population least likely to notice.
      - name: Sign ${{ matrix.image }} (keyless)
        env:
          REPO:   ${{ steps.ns.outputs.repo }}
          IMAGE:  ${{ matrix.image }}
          ALIAS:  ${{ matrix.alias }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes --use-signing-config=false --new-bundle-format=false "${REPO}/${IMAGE}@${DIGEST}"
          if [ -n "${ALIAS}" ]; then
            cosign sign --yes --use-signing-config=false --new-bundle-format=false "${REPO}/${ALIAS}@${DIGEST}"
          fi
