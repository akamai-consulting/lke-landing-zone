name: Release llz binaries

# Builds the `llz` adopter CLI (tools/cmd/llz) as static, multi-platform binaries
# and attaches them to a GitHub Release, so adopters can `curl` one for their
# platform without a Go toolchain (see docs/quickstart.md install snippet).
#
# Trigger: `released` — a full release `vX.Y.Z` is published, OR a pre-release is
# promoted to one (see terraform-modules/RELEASING.md). This fires only AFTER the
# e2e gate: the candidate is published as a pre-release (release-e2e.yml runs on
# `prereleased`), and a human promotes it once e2e is green — that promotion is the
# `released` event. We key off the release event (not a tag push) because a release
# created with the built-in GITHUB_TOKEN would suppress downstream runs; the human
# promoting it is what arms the fan-out. The release's tag semver is stamped into
# the binary via -ldflags (main.version); this job attaches the binaries to the
# now-full release.
#
# Assets: llz-<os>-<arch> for {darwin,linux} x {amd64,arm64}, plus SHA256SUMS.

on:
  release:
    types: [released]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # THE RELEASE'S OWN PRECONDITION, and it has to be a job of its own because the
  # thing it protects is an ORDERING. `image-tag` already refused to retag a
  # missing image and said so loudly — but it declares no `needs:`, so on v0.0.44
  # it failed at 00:30:04Z while "Attach binaries to the release" had already
  # succeeded. The release went out installable, advertising a `:vX.Y.Z` image
  # that did not exist. A gate that runs after the irreversible step is a report.
  #
  # Measured root cause: build-images for that commit started 00:28:49Z and was
  # still in_progress when the release fired 66s later. Not a missing build — a
  # race with one. So this WAITS (default ~15 min, against 6-9 min observed
  # build-images runs) rather than failing fast, which would turn every promptly
  # cut release into a manual re-run.
  preflight:
    name: The commit's image is published
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Through the composite, not a hand-rolled setup-go: setup-go-sole-site
      # gates that, and llz-release.yml's ONE sanctioned exception is the `go
      # build` that stamps the release version via -ldflags. This is not that.
      - name: Set up Go + build llz from source
        uses: ./.github/actions/setup-llz
        with:
          install-path: /usr/local/bin/llz
      # From source on purpose: a released binary would answer for code that is
      # not what this release ships.
      - name: Wait for ghcr.io/<owner>/llz:sha-<commit>
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: llz ci assert-release-image --owner "$OWNER" --sha "$SHA"

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        goos: [darwin, linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-llz

      - name: Build
        working-directory: tools
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          # $GITHUB_REF is a trusted built-in (refs/tags/vX.Y.Z); derive the
          # semver and stamp it into the CLI's Version.
          #
          # THE SYMBOL PATH IS NOT main.version ANY MORE. The command tree moved to
          # internal/cli so it could be imported and tested; cmd/llz is now a
          # four-line stub with no version var to stamp. A stale `-X main.version`
          # here would NOT fail the build — the linker ignores an -X for a symbol it
          # cannot find — it would ship every release reporting "dev", which makes
          # selfupgrade see every release as newer than the running binary forever.
          # tools/internal/cli/version_stamp_test.go pins this exact string against
          # the variable it names, so the two cannot drift apart silently.
          VER="${GITHUB_REF##*/}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || VER="dev"
          out="llz-${GOOS}-${GOARCH}"
          go build -trimpath -ldflags "-s -w -X github.com/akamai-consulting/lke-landing-zone/tools/internal/cli.Version=${VER}" -o "../${out}" ./cmd/llz
          echo "asset=${out}" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.asset }}
          path: ${{ env.asset }}
          if-no-files-found: error

  release:
    name: Attach binaries to the release
    # preflight as well as build: attaching the binaries is what makes a release
    # installable, so it must not happen while the image tag it advertises is
    # still missing. `build` alone was the ordering that let v0.0.44 out.
    needs: [build, preflight]
    # Only the real release event has a release to attach to; a manual dispatch
    # just exercises the matrix build (artifacts only).
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # contents: write lets the built-in GITHUB_TOKEN upload assets to the release.
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum llz-* > SHA256SUMS
          cat SHA256SUMS

      - name: Attach binaries to the published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The release already exists (this job runs on its publication); --clobber
        # makes re-runs idempotent.
        run: gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/llz-* dist/SHA256SUMS

  # ── Publish the release-version container tag ────────────────────────────────
  # build-images.yml only ever pushes :latest and :sha-<SHA> (the llz image has no
  # static `version` in its matrix). Nothing published :vX.Y.Z — so an instance
  # pinned to a release rendered ghcr.io/…/llz:v0.0.28 into its carved apps and
  # got a 404 / ImagePullBackOff (see llzImageTagFor in tools/internal/extensions/lifecycle/render/render.go).
  #
  # RETAG rather than rebuild: the sha- image for this commit is the artifact
  # release-e2e already validated, so pointing the version tag at the same
  # manifest keeps the release byte-identical to what was tested. `imagetools
  # create` copies the multi-arch index, preserving both platforms + provenance.
  image-tag:
    name: Retag the llz image as ${{ github.event.release.tag_name }}
    # Only a real release has a version to publish; a dispatch run has no tag.
    if: github.event_name == 'release'
    # preflight has already waited for the source image, so this no longer races
    # build-images — it either finds what preflight saw, or something removed it
    # in between, which is worth failing on.
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point the version tag at this commit's image
        env:
          OWNER: ${{ github.repository_owner }}
          SHA:   ${{ github.sha }}
          VER:   ${{ github.event.release.tag_name }}
        # Fails loudly if the sha- image is missing (a release cut from a commit
        # whose build-images run never completed) — better than a silent 404 that
        # only surfaces as an ImagePullBackOff in an adopter's cluster.
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "ghcr.io/${OWNER}/llz:${VER}" "ghcr.io/${OWNER}/llz:sha-${SHA}"
          docker buildx imagetools inspect "ghcr.io/${OWNER}/llz:${VER}" >/dev/null

  functional:
    name: Documented install flow (against the published release)
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go and build llz
        uses: ./.github/actions/setup-llz
        with:
          install-path: ${{ github.workspace }}/bin/llz

      - name: Functional + install/self-update flow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLZ_FUNCTIONAL_REPO: ${{ github.repository }}
          # Validate the documented install path (gh release download + checksum +
          # `llz self-update`) against the now-published full release. Runs here, not
          # in release-e2e.yml, because `needs: release` guarantees the binaries are
          # attached first — no cross-workflow race, and the full release exists by
          # definition (this fires on `released`).
          LLZ_FUNCTIONAL_NET: "1"
        run: template-scripts/ci/llz-functional.sh
