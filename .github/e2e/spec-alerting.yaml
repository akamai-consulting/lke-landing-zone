# spec.alerting fixture for the e2e lane (e2e-instantiate.yml → `llz spec set
# alerting=@.github/e2e/spec-alerting.yaml`). Exercises both receiver types, so
# the alert-routing lane (assertobs/alertrouting.go) checks the PagerDuty route,
# its must-NOT-page exclusion, and both Slack channels against the Alertmanager
# the e2e cluster actually runs.
#
# NOTHING HERE CAN REACH A REAL PROVIDER. llz-bootstrap-openbao.yml's (e2e) seed
# steps write placeholder keys, the PagerDuty endpoint is overridden to a
# reserved `.invalid` name (RFC 2606), and the Slack placeholder webhook is one
# too — so a real alert firing on the throwaway cluster fails DNS rather than
# landing in anyone's pager or channel. The lane's own probes are silenced and
# never notify regardless.
receivers: [pagerduty, slack]
pagerduty:
  url: https://events.pagerduty.invalid/v2/enqueue
slack:
  channel: llz-e2e
  channelCrit: llz-e2e-crit
