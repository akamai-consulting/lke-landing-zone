    # decision is made on the returned bytes, so it went to 96.5%. selfupgrade FELL
    # to 44.3% without one line of it getting worse: the version helpers were among
    # its best-covered code and they left. Lowering that floor would have been the
    # wrong read of the number -- it described a package that no longer exists -- so
    # verifyChecksum and walkUpgradeFiles, both long at 0% and both pure filesystem
    # work, were covered instead, and the floor went UP to 56 against an actual 57.4.
    #
    # 1857 -> 1869. TWELVE LINES, AND THEY ARE THE POINT OF THE CHANGE. Five
    # installers in cmd/llz now build their extension's cluster Writer from a NAMED
    # binding — `capability.For(assertnetwork.MutatingBinding()).Writer` — instead
    # of handing over a general exec seam. Three lines of that is the comment
    # saying so, which belongs at the wiring site: this is the file where a
    # reviewer can see what each extension was granted, and a bare
    # `Writer: capability.For(x)` would say nothing about why THAT binding.
    #
    # This is package main doing the one job the model always gave it — deciding
    # what each extension receives — and it is the first time that decision has had
    # any consequence. Shrinking it would mean moving the grant resolution into the
    # extensions, which is exactly backwards: an extension that chooses its own
    # capabilities has not been granted anything.
    #
    # 1856 -> 1857. One import line. The two firewall names moved from
    # internal/extensions/reconciler to internal/shared/platform, and the two
    # cmd/llz files that use them still import `reconciler` for other things, so
    # each gained a `platform` import without losing the old one. Five insertions
    # against four deletions.
    #
    # It is recorded rather than absorbed because `exact: true` means every number
    # here was checked, and a budget that quietly rounds off single lines stops
    # being able to say anything about ten.
    #
    # IN-DEGREE SWEEP, ROUND TWO (no core-surface change). 90 -> 66 extension ->
    # extension edges, by splitting the four biggest hubs. The COVERAGE FLOORS MOVED
    # WITH THE CODE and three of them went DOWN, which needs saying plainly rather
    # than being left to look like a regression:
    #
    #   internal/extensions/instanceresolve   87 -> 95   (0 lib lines left; 100% now)
    #   internal/extensions/envtopology       31 ->  8
    #   internal/extensions/openbao           58 -> 32
    #   internal/shared/instanceresolve             87   (measured 89.6)
    #   internal/shared/envtopology                 67   (measured 69.9)
    #   internal/shared/openbao                     76   (measured 79.0)
    #   internal/shared/portfwd                     90   (40 -> 93.3, timeout path)
    #
    # THE COVERAGE DID NOT DROP, IT RELOCATED. Each of those three extensions was
    # mostly library, the library was mostly what was tested, and both went to
    # internal/shared together -- so the shared floors above are where the same
    # tests now count. What is left behind in envtopology and openbao is cobra verb
    # plumbing, which is genuinely less covered and always was; it had been hidden
    # inside a package average carried by the library sitting next to it. Lowering
    # those two is the number stopping being flattering, not the tests getting worse.
    #
    # This is the OPPOSITE case to the selfupgrade entry below, where a floor also
    # fell after a move and the right answer was to write tests rather than lower
    # it. The difference is where the uncovered code came from: there, well-covered
    # code left and the REMAINDER had cheap untested functions worth covering
    # (verifyChecksum, walkUpgradeFiles, both at 0%). Here the remainder is 2,600
    # lines of command wiring. instanceresolve is the case that proves the rule
    # rather than breaking it -- its floor went UP, because what remained was a bare
    # declaration with no test at all, and a declaration is cheap to check.
    #
    # 1853 -> 1856, AND THE FIRST DELIBERATE GROWTH IN A LONG WHILE. Binding gained
    # a Requires field (the precondition axis) and `llz extension list` renders it:
    # three lines in bindingSummary. The code belongs in package main because that
    # is the CLI rendering layer and the summary string is a presentation choice —
    # it uses `<operating` rather than Binding.String()'s spelled-out form because
    # the column holds several bindings side by side.
    #
    # Not rendering it was the alternative and it was wrong. `database-provisioner`
    # holds two bindings at `transition:seeded`, one of which requires `operating`;
    # without the field they collapsed to a single entry and the list silently
    # showed one binding where there are two. A list command whose help says it
    # shows bindings, quietly dropping the part that distinguishes two of them, is
    # the banning-by-omission shape this whole model was built to prevent — in the
    # one surface an operator actually reads.
    #
    # `exact: true` is what made this commit possible to get wrong and therefore
    # possible to get right: extracting the code and forgetting this line fails the
    # gate with "SHRANK — LOWER IT" and the new number, so the paydown is banked
    # rather than left as slack the next change grows into unremarked.
    #   1,898 / 113 files  THE MOVE OUT OF package main. tools/cmd/llz became a
    #                       six-line stub and the tree became tools/internal/cli,
    #                       with the Deps assemblers in tools/internal/cli/deps so
    #                       the registry could reach them (which is what took
    #                       `template-sustain` out of undrivenGates). +9 against the
    #                       1,889 this line held as package main: a package clause,
    #                       an import block and an exported Sustain wrapper, which is
    #                       the whole cost of the split. NOT a paydown and not
    #                       claimed as one — the same code, in a package that can be
    #                       imported.
    #   1,900 / 113 files  +2 for `guard-source-refs`: one import and one
    #                       AddCommand in ci.go. A new gate's whole cost in this
    #                       layer is its two wiring lines, which is the shape ADR
    #                       0014 wants — the 300 lines of decision logic landed in
    #                       tools/internal/extensions/guards/sourceref, not here.
    #   1,920 / 113 files  `llz extension list --verbose` became a BLOCK renderer
    #                       instead of continuation rows in the summary table. +20,
    #                       spent deliberately and not a good sign about where this
    #                       code lives: it is presentation, and the budget's whole
    #                       argument is that this layer holds WIRING. It is here
    #                       because the old rendering was unreadable — `Incomplete`
    #                       is prose, one long note sized a tabwriter column for the
    #                       entire table, and every summary row rendered past 1,600
    #                       characters. A listing whose job is to make the model
    #                       legible cannot be the thing that hides it.
    #
    #                       `llz extension list` is on the unclaimed-command ratchet
    #                       (commands_claimed_test.go) and its real home is an
    #                       extension. When it moves, this comes back down.
    budget: 1920
    exact: true
    include:
      - "tools/internal/cli/*.go"
      - "tools/internal/cli/deps/*.go"

  # ── THE FLOOR THAT MAKES THE MOVE IRREVERSIBLE ───────────────────────────────
  #
  # tools/cmd/llz holds the two things that genuinely cannot live anywhere else:
  # the `main` symbol, and the os.Exit that must not run inside a testable
  # function. Six lines.
  #
  # WITHOUT THIS, THE MOVE DECAYS. Nothing in Go stops the next command from being
  # added here, and the argument for putting it here is always the same small one
  # ("it's just the entry point"). An exact budget of six means the first line that
  # arrives fails the gate and has to argue for itself in a commit message.
  #
  # It is `exact` in both directions like its sibling, which also means a genuine
  # shrink has to be banked. There is not much left to shrink.
  cmd-llz-entrypoint:
    kind: go-logic
    budget: 6
    exact: true
    include:
      - "tools/cmd/llz/*.go"

exclude:
  # A `*_test.go` pattern under the cmd/llz entry point was here and MATCHED
  # NOTHING -- that package has held only main.go since the move, so the pattern
  # named no file. Removed rather
  # than kept as insurance: with `cmd-llz-entrypoint` at an exact 6, a test file
  # appearing in that package SHOULD fail the gate and be argued for, which is the
  # ratchet working. source-ref-guard found it; a glob that matches nothing and a
  # glob that is doing its job produce byte-identical output, which is the hazard
  # count.go's header names.
  - "tools/internal/cli/*_test.go"
  - "tools/internal/cli/deps/*_test.go"
