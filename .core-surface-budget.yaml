#        reconcilelanes -> openbao, over ONE dry-run line, fixed with a local
#        12-line quote(); and a self-import left by a bulk `openbao.` strip.
#        COVERAGE DEBT, recorded not hidden: internal/openbao 88 -> 63 and
#        internal/teardown 80 -> 47. Both absorbed exec/API-bound code that was
#        equally untested in package main; the arithmetic moved, not the
#        standard. THE EXPLANATION LIVES HERE AND NOT IN THE MAKEFILE: the
#        untestable-loc gate counts Makefile COMMENT lines, and two lines of
#        justification put makefile-recipe at 30/28. Lower a floor here, not
#        there.
#   59th: mtls-wiring -> internal/mtlsguard   13,183 -> 12,970 (-213 / 111 files)
#        CLOSURE 1 -- `main`, and nothing else. 282 lines that needed nothing from
#        package main and were never measured until the campaign ran out of hard
#        candidates and started sweeping. Third time a sweep beat a hunch.
#   60th: tfvars layer + seed-special   12,970 -> 12,721 (-249 / 110 files)
#        The tfvars READER (ci_seed_special.go), WRITER (scaffold.go) and
#        EXISTENCE CHECK (render.go) were in three different files. Putting them
#        in one package surfaced a disagreement none could show alone: Value
#        TrimSpace()s the left side and so accepts an INDENTED assignment, while
#        SetField and HasKey anchor at column 0. llz can read a value it would
#        never rewrite. Not yet a bug -- this tree generates these files
#        unindented -- and now pinned by a test written to FAIL if one side is
#        "fixed" without the other.
#        Also took scaffold from 21 outbound to 19. Still blocked; still not a
#        boundary problem.
#   61st: loadSpec -> clusterspec, bootstrap-cluster -> internal/bootstrapcluster
#         12,721 -> 11,756 (-965 / 107 files)
#        THE LAST BIG CLEAN SET, and it looked entangled for the whole campaign.
#        Measured ALONE ci_bootstrap_cluster.go is 15 outbound -- and EIGHT of the
#        fifteen are its own manifests sibling. With the sibling and
#        ci_prepare_apl_upgrade.go it is 6; after loadSpec moved, 5.
#        THE MIRROR OF THE FIRST TRAP: a per-file closure UNDERSTATES a set by
#        hiding shared helpers and OVERSTATES it by counting a sibling as a
#        foreign dependency. Check where the edges POINT.
#        loadSpec was 8 lines of adapter with ELEVEN callers, all of which had to
#        agree about the "spec present?" rule. It is clusterspec.Detected now.
#        The manifests/ dir travelled with its embedder, which moved a constraint
#        internal/kyverno had DOCUMENTED rather than solving it -- and kyverno's
#        own TestManifestsStayWithTheEmbeddingPackage is what caught the move.
#   62nd: the copier-answers hub -> internal/answers   11,756 -> 11,730 (-26 / 106 files)
#        A CORRECTION TO THE PREVIOUS ENTRY. This ledger had just written the
#        scaffold mass off as "a design task, no enabler to extract first". That
#        was wrong about instance.go: 65 lines, CLOSURE 1, and the hub FOURTEEN
#        cmd/llz files reached through.
#        It was also only partly wrong. Moving it took template_commit 10 -> 8,
#        selfupdate 8 -> 7, render 11 -> 10 -- real, and nothing like the
#        collapses ghsecret and ghgitdata produced. The rest of the coupling is
#        not one shared helper; it is main.go's globals and the
#        answers/spec/tfvars read path genuinely interleaving. THAT part is still
#        a design task.
#        Cost: a blanket type rename (Answers -> File) rewrote the STRING LITERAL
#        ".copier-answers.yml" into ".copier-File.yml". Four tests caught it.
#        Rename by exact symbol -- and check string literals, not just code.
#   63rd: FIVE guards, all CLOSURE 1   11,730 -> 11,108 (-622 / 101 files)
#        mesh-egress (245), coverage (208), cosign-subject (203), workflow-shells
#        (125), monitoring-label (118). ~900 lines of real logic that needed
#        NOTHING from package main except `main` itself, and had been sitting
#        there for the entire campaign.
#        THE THIRD TIME "mechanical extraction is complete" WAS WRONG. Found by
#        running the per-file sweep instead of trusting the previous conclusion.
#        All five built and vetted clean on the FIRST pass -- no stranded
#        helpers, no path-keyed registry, no seam. That is what a genuinely
#        separable file looks like, and it is why the sweep is now step one of
#        every iteration rather than a thing done when hunches run out.
#        Note guard-coverage: extracting it puts the thing that JUDGES coverage
#        under a coverage floor of its own -- the same loop assert-suite closed.
#   64th: instance-resolve -> internal/instanceresolve   11,108 -> 10,775 (-333 / 97 files)
#        546 lines, closure 2, both edges noise. Second sweep find in one
#        iteration.
#        THE MODEL CORRECTED ME. I declared it gate:scaffolded[read-repo,
#        cloud-read] on the belief that the gate rule bars only MUTATING grants.
#        It does not: a gate permits read-repo AND NOTHING ELSE, because "it runs
#        in the fast pre-commit path over files alone". checkRegion and
#        resolveOBJCluster call the Linode API. A gate is not defined by being
#        harmless -- it is defined by being CHEAP AND OFFLINE. Now an assertion.
#        Also: the naive test-helper puller tried to drag runEnvAdd, a PRODUCTION
#        function from scaffold.go, across the boundary. The guard against
#        ciCmd/gopts/globalOpts/main must cover production symbols too.
#   65th: ci_shared split + cloud-firewall-bootstrap   10,775 -> 10,562 (-213 / 96 files)
#        A "SHARED HELPERS" FILE IS USUALLY TWO THINGS THAT WERE NEVER NAMED.
#        cmd/llz/ci_shared.go was 66 lines used by six files, holding a Linode
#        client constructor and a tfvars reader with nothing in common. NEITHER
#        needed a new package: the client went to internal/linode beside
#        NewClient, the reader to internal/tfvars beside the read/write pair
#        extracted two moves earlier. That took ci_firewall.go from closure 3 to
#        closure 1. Fourth enabler of this shape.
#        cloud-firewall-bootstrap declares NO cloud-mutate on purpose: it seeds
#        in-cluster state and the firewall-controller does the reconciling. That
#        split is why a one-shot bootstrap and a continuous reconciler cannot
#        fight over the same Linode resource.
#   66th: openbao-login -> internal/openbao   10,562 -> 10,291 (-271 / 95 files)
#        The interactive `llz openbao login --team` and the in-cluster CI login,
#        6 outbound together, all noise.
#        THEY CARRIED A NAME COLLISION: runOpenbaoLogin and runOpenBaoLogin,
#        differing by ONE CAPITAL, in two files that had never shared a package.
#        Now RunTeamLogin and RunCILogin. Second such collision in this package.
#        A TEST-BUILD IMPORT CYCLE, and Go names it misleadingly: teamlogin.go
#        imported internal/identityconfig for the issuer lookup, giving
#        identityconfig(test) -> reconcilelanes -> openbao -> identityconfig.
#        The message says "import cycle not allowed in test", which reads like a
#        test problem; it is the build saying two packages both want to own
#        "which Keycloak issues our tokens". Settled as a seam defaulting to "".
#        The seam PROVED ITSELF: TestKeycloakIssuerForLogin failed the moment it
#        was introduced, which is the path confirming it really did depend on
#        that lookup rather than on anything local.
#   67th: reachability -> internal/reachability   10,291 -> 10,001 (-290 / 92 files)
#        verify + status-preflight + sshcheck, ~420 lines, 6 outbound together.
#        THE ENABLER WAS A THREE-LINE FUNCTION IN THE WRONG FILE: kubectlOut,
#        four callers across three packages, lived in verify.go -- a file about
#        the `llz verify` COMMAND, which is not what a kubectl exec helper is
#        about. Now kubectlprobe.Out, with lookable as kubectlprobe.Lookable.
#        THAT MOVE BRIEFLY CREATED A SECOND SEAM. lookable reads
#        kubectlprobe.LookPathFn while package main kept its own swappable
#        execLookPath; a test stubbing one left the other reading the REAL PATH,
#        which passes or fails on what the developer happens to have installed --
#        the exact failure a preflight exists to catch. main s now delegates.
#        Fifth time a copied with*() helper dragged its old package s wiring
#        (installConfigReadinessDeps). A minimal local version, every time.
#   68th: proc.Run + branch-policy   10,001 -> 9,830 (-171 / 91 files)
#        UNDER 10,000, from 47,182.
#        SIXTH ENABLER, SAME SHAPE AS THE LAST TWO: execArgv was TEN LINES with
#        EIGHT callers, living in commands.go -- a 1,100-line file about the llz
#        subcommands. A process runner is not a subcommand. Now internal/proc.Run.
#        It is deliberately NOT in kubectlprobe: that package captures output so a
#        check can classify it, this one hands stdout/stderr/stdin straight
#        through because its callers run copier, gh, tofu and git for a human who
#        needs to see -- and sometimes answer -- them.
#        branch-policy is the second shipping case behind cloud-mutate@configured:
#        GitHub is configured before Linode is provisioned, and resolving an input
#        can mean CREATING one.
#   69th: env-definition -> internal/envdef   9,830 -> 9,597 (-233 / 90 files)
#        THE RISKIEST RENAME IN THE CAMPAIGN: envAddOpts, 18 fields, read by five
#        files, moved with the writer that consumes it. A blanket o.<field> pass
#        was NOT safe -- envAddOpts has a `region` field and so do openbaoLoginOpts
#        and ReapOpts, and that collision had already bitten twice.
#        METHOD THAT WORKED: move the type FIRST, then let the COMPILER drive the
#        repair -- each round applies only what `go build` reports, by exact file
#        and line. Six rounds. The two ha* fields needed a separate pass because
#        haRole -> HARole is too far apart for Go to offer a "but does have" hint,
#        and one `dryRun :=` short declaration was caught by the `field:` pattern.
#        IT STILL WENT WRONG ONCE: the `<field>:` rewrite matched YAML KEYS INSIDE
#        STRING LITERALS, so the emitted spec said `Region:` where the schema says
#        `region:`. go build was CLEAN; one test caught it. Repaired against the
#        pre-move file and verified by diffing every quoted literal -- empty.
#        VERIFY A LITERAL-TOUCHING RENAME WITH:
#          diff <(git show HEAD:./<old> | grep -oE '"[^"]*"' | sort) \
#               <(grep -oE '"[^"]*"' <new> | sort)
# THE FILE COUNTS ABOVE ARE UNRELIABLE FROM ROUGHLY THE 30th ENTRY ON, and the
    # line counts are not. `exact: true` checks the NUMBER every commit, so every
    # budget figure here has been verified by the gate; nothing checks the "/ N
    # files" annotation, and it was being decremented by hand rather than measured.
    # By the database entry it read 115 against an actual 144. Corrected there;
    # earlier entries in that stretch are approximate and were left rather than
    # invented. Read `llz ci core-surface --verbose | wc -l` for the real count.

    # `exact: true` is what made this commit possible to get wrong and therefore
    # possible to get right: extracting the code and forgetting this line fails the
    # gate with "SHRANK — LOWER IT" and the new number, so the paydown is banked
    # rather than left as slack the next change grows into unremarked.
    budget: 9597
    exact: true
    include:
      - "tools/cmd/llz/*.go"

exclude:
  - "tools/cmd/llz/*_test.go"
