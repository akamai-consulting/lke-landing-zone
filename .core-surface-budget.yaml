# Core-surface budget — Go logic lines in package main (tools/cmd/llz).
#
# WHY THIS EXISTS, and why it has no slack:  docs/adr/0014-core-surface-budget.md
# WHERE THE NUMBER IS GOING (~3,000):        docs/designs/internal-extensions.md
# WHAT A BREACH TELLS YOU:                   budget.CoreSurfaceRemedy, in
#                                            tools/internal/extensions/guards/budget/remedy.go
#
# This file is the operational half of that: the number, and the rule for
# changing it. The argument lives in the ADR and is not repeated here.
#
# THE RULE. `budget` equals the measurement exactly — it is a high-water mark, not
# a ceiling with headroom (`exact: true` enforces both directions). So:
#
#   grew package main?    the gate fails until you raise this line in the SAME
#                         commit, and say in the message why the code belongs in
#                         package main rather than tools/internal/<pkg>.
#   shrank it?            the gate fails until you LOWER this line. Bank the
#                         paydown; slack left behind silently pre-approves the
#                         next change's growth.
#
# Raising it is expected, not forbidden. The signal is the trend of this line, not
# any single value.
#
# COUNTING (`llz ci core-surface --verbose` prints the per-file breakdown).
# `go-logic` counts non-blank lines of Go that do not START with `//` — the
# `script` counter's rule with Go's comment marker. Block comments are
# deliberately not tracked: this repo documents with `//`, and `/*` appears almost
# only inside glob and regex string literals, where a naive scanner would swallow
# the rest of the file.
#
# SCOPE. Non-test Go in the two packages that make up the CLI's own footprint:
# tools/internal/cli (the command tree) with tools/internal/cli/deps (the assembly
# layer), and tools/cmd/llz (the entry point). The rest of tools/internal/** is NOT
# counted: code that moved there has already done the thing this gate asks for.
# Tests are excluded outright, because they are what this repo wants more of.
#
# THE SCOPE USED TO BE "package main" AND THAT WAS DOING TWO JOBS. It named a
# language property (this cannot be imported or tested) and a location (the CLI
# lives here). The tree moved to internal/cli so the first job could stop being
# true; the second is what these globs now track. Read cli-wiring-layer's header
# for what the budget means once the untestability argument is gone.
#
# NO `remedy:` KEY, deliberately. The breach guidance lives only in
# budget.CoreSurfaceRemedy: when it lived in both places the YAML copy silently
# won, and an edit to the Go constant never reached an operator. The key stays supported
# for a gate that needs to override the default; this one does not.

categories:
  # ── THE SUBJECT MOVED, AND THE ARGUMENT CHANGED WITH IT ──────────────────────
  #
  # This category was `cmd-llz-package-main` and measured tools/cmd/llz. The whole
  # command tree now lives in tools/internal/cli, so the glob follows it — but the
  # JUSTIFICATION is not the same one, and pretending otherwise would be the
  # dishonest half of this move.
  #
  # ADR 0014 capped package main because package main CANNOT BE IMPORTED. That is a
  # language rule, not a convention, and it is why this ratchet has driven sixty
  # extractions: code in there was untestable from outside, full stop. internal/cli
  # is an ordinary package. It can be imported and tested, so the property the
  # budget defended is now satisfied by construction and the budget cannot claim it.
  #
  # WHAT THE BUDGET MEANS NOW: internal/cli is the WIRING layer, and wiring is all
  # it may hold. That is weaker than "untestable" and it is stated plainly rather
  # than dressed up — a ratchet whose reason has quietly changed is a ratchet people
  # stop believing. The number is what keeps the pressure on the ~920 lines that are
  # commands rather than wiring (ci_teardown, import, promote, apl_app, ext,
  # ci_guards, ci_gen_toc, build_watch, ci_build_failure_summary) and belong in
  # extensions.
  #
  # cli/deps IS INCLUDED, and that is not tidiness. If the assembly layer were
  # unbudgeted, moving code one directory down would be a free escape hatch from
  # this line — the exact shape of paydown-by-relabelling that `exact: true` exists
  # to refuse. One number covers the CLI's whole footprint.
  #
  # See also cmd-llz-entrypoint below, which is what makes the move irreversible.
  # ─────────────────────────────────────────────────────────────────────────────
  cli-wiring-layer:
    kind: go-logic
