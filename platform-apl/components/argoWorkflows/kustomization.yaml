# spec.components.argoWorkflows → this kustomize Component. An env's overlay lists it under
# components: when the component is enabled. Template-managed — edit upstream.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - namespace.yaml
  # Not this component's namespace, but this component's requirement: argo-helm
  # creates workflow RBAC in every controller.workflowNamespaces entry, and on
  # managed clusters llz-cert-automation is not created by anything else. See the
  # file's header.
  - cert-automation-namespace.yaml
  - network-policies.yaml
  - argo-workflows.yaml
