# STRICT mTLS for the harbor namespace.
#
# THIS IS THE ENFORCEMENT. Putting harbor-robot-provisioner into the mesh
# (cronjob.yaml) makes its traffic mTLS; this makes plaintext to harbor-core
# IMPOSSIBLE, which is the difference between "our client happens to use mTLS"
# and "harbor cannot be spoken to in cleartext". Without it the mesh stays
# PERMISSIVE (llz-cluster-foundation values.yaml: "Mesh is PERMISSIVE, so no
# PeerAuthentication needed") and any pod in the namespace can still open a
# plaintext connection to harbor-core.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHY THIS IS THREE DOCUMENTS AND NOT ONE
# ─────────────────────────────────────────────────────────────────────────────
#
# The first revision was a SINGLE namespace-wide policy (no selector) that also
# carried portLevelMtls. Istio rejects that combination outright:
#
#     PeerAuthentication.security.istio.io "harbor-strict-mtls" is invalid:
#     spec: Invalid value: "object": portLevelMtls requires selector
#
# portLevelMtls is meaningful only against a known set of workload ports, so it
# is legal only on a workload-scoped (selector-bearing) policy. The apiserver
# refused every apply, Argo retried to its limit, and the resource NEVER EXISTED
# on any cluster — verified on e2e cluster 637888, where `kubectl get
# peerauthentication -A` returned nothing while the llz-harbor Application sat
# OutOfSync on this exact message. So the namespace ran PERMISSIVE the whole
# time, and every claim resting on "harbor is STRICT" was aspirational:
# ci_mesh_egress_guard.go's meshStrictNamespaces assertion, and the two harbor
# http:// residuals in ci_plaintext_guard.go that are accepted BECAUSE the
# sidecar upgrades them.
#
# The split below is therefore not a refactor, it is the fix:
#   1. namespace-wide STRICT, no port exemptions      — legal without a selector
#   2. the CNPG database workload, with its exemptions — legal with one
#   3. the Harbor app workloads, with theirs           — legal with one
#
# Istio resolves the most specific policy per workload: a workload-scoped policy
# REPLACES the namespace-wide one for the pods it matches, rather than merging
# with it. That is why documents 2 and 3 each restate `mtls.mode: STRICT` — drop
# it and every unlisted port on those pods falls back to the mesh default, which
# is PERMISSIVE, silently unmaking the enforcement for exactly the workloads that
# hold the database and the registry.
#
# The selectors are disjoint BY CONSTRUCTION, which matters because Istio does
# not define precedence between two workload-scoped policies matching one pod:
# the CNPG pods carry app.kubernetes.io/name=postgresql and NO `app` label, the
# Harbor app pods carry app=harbor. Confirmed on 637888. harbor-robot-provisioner
# matches neither (app.kubernetes.io/name=harbor-robot-provisioner), so it falls
# under document 1 at full STRICT — correct, since nothing dials INTO it and its
# outbound hop to harbor-core is governed by document 3.
#
# ─────────────────────────────────────────────────────────────────────────────
# ⚠️  STILL THE HIGHEST-RISK RESOURCE IN THE mTLS CHANGE. READ BEFORE ENABLING.
# ─────────────────────────────────────────────────────────────────────────────
#
# STRICT rejects EVERY plaintext connection into every pod in the harbor
# namespace, including from clients LLZ does not own. Known clients that must be
# meshed or exempted — each verified on cluster 637888 unless marked otherwise:
#
#   - apl-core's own Harbor components (core, registry, jobservice, portal,
#     redis, trivy). Meshed by apl-core — confirmed, every pod runs 2/2 with a
#     sidecar and the namespace carries istio.io/rev.
#   - the CNPG operator's status poll of harbor-otomi-db :8000 (cnpg-system is
#     NOT meshed). Exempted in document 2.
#   - Prometheus scraping harbor-otomi-db :9187 (CNPG metrics). NEWLY EXEMPTED —
#     the first revision missed it. PodMonitor harbor/harbor-otomi-db selects
#     these pods and scrapes port `metrics` with NO `scheme:`, which Prometheus
#     defaults to HTTP; the `monitoring` namespace has no istio.io/rev label, so
#     that scrape is unmeshed plaintext. Under the old exemption set STRICT would
#     have blackholed CNPG metrics for BOTH databases' worth of dashboards the
#     moment it applied.
#   - Prometheus scraping :8001 Harbor metrics. Exempted in document 3.
#     NOT VERIFIED LIVE: no pod on 637888 listens on 8001 and no Harbor
#     ServiceMonitor exists there, because that cluster's apl-core does not
#     deploy the exporter. Kept because configurations that DO enable it need it,
#     and an exemption for an absent port is inert.
#   - the Istio ingress gateway (meshed, fine).
#
# If a live check turns up another plaintext client, add its port to the document
# that owns that workload — never drop a whole policy back to PERMISSIVE.
#
# ROLLOUT: apply with mode PERMISSIVE first, watch
# `istio_requests_total{connection_security_policy="none"}` for the harbor
# namespace until it is zero, THEN flip to STRICT. Full sequence in
# docs/adr/0010-in-cluster-mtls.md.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: harbor-strict-mtls
  namespace: harbor
  annotations:
    # Wave 5, alongside the provisioner's own NetworkPolicy: this must land
    # AFTER apl-core's Harbor pods are up and meshed, never before — a STRICT
    # policy applied to a half-built namespace fails closed on everything.
    argocd.argoproj.io/sync-wave: "5"
spec:
  # Namespace-wide (no selector): every pod in `harbor` that no workload-scoped
  # policy below matches. Carries NO portLevelMtls — that is what made the
  # single-document version unappliable.
  mtls:
    mode: STRICT
---
# The CNPG database workload. Its two unmeshed clients live on ports that must
# stay reachable in cleartext; everything else on these pods is STRICT.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: harbor-otomi-db-mtls
  namespace: harbor
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  selector:
    matchLabels:
      # Set by cloudnative-pg on both instances; the Harbor app pods do not
      # carry it, so this cannot overlap document 3.
      cnpg.io/cluster: harbor-otomi-db
  mtls:
    mode: STRICT
  # Port keys MUST be QUOTED. Istio's schema takes them as a map keyed by string;
  # bare integers make the key a Go int, which kustomize cannot serialize
  # ("json: unsupported type: map[interface {}]interface {}") and the build fails.
  #
  # These are WORKLOAD ports (what the container listens on), not Service ports.
  # The postgres container declares postgresql:5432, metrics:9187, status:8000.
  portLevelMtls:
    # CNPG operator → instance status. cnpg-system is unmeshed, so without this
    # the Harbor DB reports "Instance Status Extraction Error", sits
    # ClusterIsNotReady, and convergence stalls (the exact failure
    # llz-cluster-foundation's networkPolicies.cnpg block exists to prevent).
    "8000":
      mode: PERMISSIVE
    # Prometheus → CNPG metrics, from the unmeshed `monitoring` namespace.
    "9187":
      mode: PERMISSIVE
  # NOTE 5432 is deliberately NOT exempted. Replica → primary replication is
  # pod-to-pod INSIDE this namespace and both ends are meshed, so it upgrades to
  # mTLS cleanly. If a future unmeshed client needs 5432, exempting it means
  # accepting cleartext Postgres wire traffic — a much sharper trade than a
  # status endpoint, and one that belongs in ADR 0010 rather than in a quiet
  # addition here.
---
# The Harbor application workloads (core, registry, jobservice, portal, redis,
# trivy — and the exporter where apl-core deploys it). All carry app=harbor.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: harbor-app-mtls
  namespace: harbor
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  selector:
    matchLabels:
      app: harbor
  mtls:
    mode: STRICT
  portLevelMtls:
    # Prometheus (monitoring, unmeshed) → Harbor metrics: the exporter plus
    # core/registry/jobservice. Same rationale as the harborMetrics
    # NetworkPolicy allow in llz-cluster-foundation.
    #
    # Harbor's API port (80) is intentionally absent, so it stays STRICT — that
    # is the hop harbor-robot-provisioner makes carrying the admin password, and
    # the whole reason ci_plaintext_guard.go accepts its http:// URL.
    "8001":
      mode: PERMISSIVE
