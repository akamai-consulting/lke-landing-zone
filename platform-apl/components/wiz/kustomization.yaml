# spec.components.wiz → this kustomize Component (default-disabled).
#
# Enrolls the cluster in Wiz CSPM: the upstream wiz-kubernetes-integration chart's
# connector (an Argo Application), the ExternalSecret that feeds it the Wiz
# service-account credential from an OpenBao TEAM subtree, and a default-deny
# namespace scoped to DNS + apiserver + outbound HTTPS.
#
# ENABLING IT NEEDS TWO THINGS OUTSIDE THIS KUSTOMIZATION:
#   1. `components.wiz.secretPath` in the env spec — a path under a declared
#      spec.teams[].openbaoSubtree (Validate refuses anything else).
#   2. The credential seeded at that path (clientId + clientToken).
# Until (2) lands the ExternalSecret sits SecretSyncedError and the connector
# cannot register; `llz ci assert-wiz-enrollment` fails and names the path.
#
# Instances that hand-carried their own Wiz Application + ExternalSecret +
# NetworkPolicy under kubernetes-custom/ must delete those when enabling this:
# two Applications releasing into one namespace fight over the same objects.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - wiz
