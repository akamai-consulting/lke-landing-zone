# The llz-wiz AppProject — scoped to exactly what the Wiz connector Application
# pulls and writes, instead of widening the shared platform-support project for
# every instance (most never enable Wiz).
#
# Without it the llz-wiz-connector Application fails InvalidSpecError (repo or
# destination not permitted) — and because that Application is content of the
# health-inert carved llz-wiz App, nothing else goes red. `assert-wiz-enrollment`
# is what notices.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: llz-wiz
  namespace: argocd
  annotations:
    # Before the Application that references it (Argo evaluates the project on
    # the referencing app's first reconcile).
    argocd.argoproj.io/sync-wave: "-20"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # ≤255 bytes (AppProject validation) — an overflow fails the whole project.
  description: Wiz CSPM cluster enrollment (upstream wiz-kubernetes-integration connector only).
  sourceRepos:
    - 'https://wiz-sec.github.io/charts'
  destinations:
    - { namespace: wiz, server: https://kubernetes.default.svc }
  # The connector's cluster-reader identity: the chart creates a ClusterRole and
  # ClusterRoleBinding granting get/list/watch on every resource (including
  # Secrets — see docs/infosec/control-mapping.md, SOG #5). Nothing else
  # cluster-scoped is permitted.
  clusterResourceWhitelist:
    - { group: rbac.authorization.k8s.io, kind: ClusterRole }
    - { group: rbac.authorization.k8s.io, kind: ClusterRoleBinding }
  orphanedResources:
    warn: true
