# The Wiz service-account credential, delivered from OpenBao.
#
# WHERE IT LIVES: under one of the instance's declared TEAM subtrees
# (spec.teams[].openbaoSubtree), at the path the env names in
# `components.wiz.secretPath` — e.g. secret/<team>/wiz/connector. Not a platform
# path, deliberately: the ESO identity already reads every declared team subtree
# (`<team>-reader`, attached by `llz ci bao-configure`), and the team's own writers
# can seed and rotate it without root. A new platform path would need a
# platform-ci policy change, and bao-configure runs once at bootstrap — every
# existing cluster would deny the read until someone re-ran it by hand.
#
# `llz render` replaces the placeholder key below per env (llz-wiz-env-patch.yaml),
# and Validate refuses a secretPath outside every declared team subtree — a path
# the ESO identity cannot read leaves this ExternalSecret SecretSyncedError and the
# connector unregistered, which from Wiz's side looks like a cluster that never
# existed.
#
# SEED (property names are the contract):
#   llz openbao set secret/<team>/wiz/connector clientId=<id> clientToken=<secret> --yes
# `--yes` matters: without it `llz openbao set` dry-runs and exits 0.
#
# Target key names `clientId` / `clientToken` are the upstream chart's contract for
# `global.wizApiToken.secret` — a `clientSecret` key (the name the Wiz console
# uses) is silently ignored and the registration Job fails to authenticate.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wiz-api-token
  namespace: wiz
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  # ≤5m: the secrets-before-apps Phase 1 propagation bound, enforced by
  # `llz ci externalsecret-paths`. It also bounds how long a freshly seeded
  # credential waits before the connector can register.
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: wiz-api-token
    creationPolicy: Owner
  data:
    - secretKey: clientId
      remoteRef:
        key: TEAM_SUBTREE/wiz/connector
        property: clientId
    - secretKey: clientToken
      remoteRef:
        key: TEAM_SUBTREE/wiz/connector
        property: clientToken
