# The Wiz cluster-integration namespace. Restricted PSS holds: the upstream chart's
# pods run non-root with every capability dropped and a read-only root filesystem,
# and the Application below adds the RuntimeDefault seccomp profile the chart does
# not set on its own (without it `restricted` rejects every pod the chart creates,
# and the connector Job's failure looks like a Wiz-side registration problem).
apiVersion: v1
kind: Namespace
metadata:
  name: wiz
  annotations:
    # Before the NetworkPolicies (-10) and the ExternalSecret that land in it.
    argocd.argoproj.io/sync-wave: "-12"
  labels:
    pod-security.kubernetes.io/enforce: restricted
