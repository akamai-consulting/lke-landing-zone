# ServiceMonitor for OUR OpenTelemetry Collector's own telemetry (otelcol_*),
# exposed by the operator-created `otel-collector-monitoring` Service on :8888.
# Without it the collector's internal metrics never reach Prometheus, and the
# OTelCollectorMetricsTargetDown alert (support-plane-alerts.yaml) has no `up`
# series to evaluate — a silent never-fire. (The otel-operator only creates this
# monitoring Service, not a ServiceMonitor for it.)
#
# REQUIRED label `prometheus: system`: apl-core's Prometheus serviceMonitorSelector
# matches it (same reason as the reconciler/openbao ServiceMonitors — the empty
# serviceMonitorSelector LLZ used to request is ineffective on
# apl-core v6). Selector targets the monitoring Service specifically (the collector
# also has an OTLP-data Service on :4318 that serves no metrics).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: otel-collector-monitoring
  namespace: llz-observability
  labels:
    prometheus: system
    app.kubernetes.io/part-of: platform
spec:
  namespaceSelector:
    matchNames:
      - llz-observability
  selector:
    matchLabels:
      operator.opentelemetry.io/collector-service-type: monitoring
      app.kubernetes.io/instance: llz-observability.otel
  endpoints:
    - port: monitoring
      # PLAINTEXT, and deliberately left so — an accepted residual of ADR 0010,
      # which put mTLS on this collector's OTLP DATA port (:4318) but not here.
      #
      # This :8888 Service is created by the otel-OPERATOR from the CR, not by us,
      # and its Prometheus pull endpoint takes TLS only through the collector's
      # `service.telemetry` block, whose TLS support is thin and version-dependent.
      # The payload is `otelcol_*` internal counters — no credentials, no cluster
      # data — and the thing that depends on this target is the
      # OTelCollectorMetricsTargetDown alert. Breaking that alert to encrypt a
      # queue-depth gauge is a bad trade.
      #
      # Revisit if the collector's telemetry server gains first-class TLS.
      scheme: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
