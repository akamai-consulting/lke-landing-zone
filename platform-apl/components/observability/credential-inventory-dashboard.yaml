# Credential single-pane-of-glass — one Grafana view of every CI token + platform
# certificate and how long until each expires. Fed by the reconciler's llz_token_*
# gauges (token-inventory funnel) and cert-manager's expiry metric
# (cert-manager-servicemonitor.yaml). The grafana_dashboard: "1" label is what the
# apl-core Grafana sidecar watches to auto-load it. Template-managed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: llz-credential-inventory-dashboard
  namespace: llz-observability
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  labels:
    # Both sidecar conventions — kube-prometheus-stack (self-install) watches
    # `grafana_dashboard: "1"`; managed App Platform Grafana watches
    # `release: grafana-dashboards` (NAMESPACE=ALL). Carry both so it merges on either.
    grafana_dashboard: "1"
    release: grafana-dashboards
    app.kubernetes.io/part-of: platform
data:
  llz-credential-inventory.json: |
    {
      "title": "LLZ Credentials — single pane (tokens + certs)",
      "uid": "llz-credentials",
      "tags": ["llz", "platform", "credentials", "security"],
      "schemaVersion": 39,
      "editable": true,
      "time": { "from": "now-6h", "to": "now" },
      "refresh": "5m",
      "templating": {
        "list": [
          { "name": "DS_PROMETHEUS", "type": "datasource", "query": "prometheus", "current": {}, "hide": 0 }
        ]
      },
      "panels": [
        {
          "id": 1, "title": "Token audit breaches", "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background" },
          "targets": [ { "expr": "count(llz_token_audit_ok == 0) or vector(0)", "legendFormat": "breaches" } ],
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [ { "value": null, "color": "green" }, { "value": 1, "color": "red" } ] } } }
        },
        {
          "id": 2, "title": "Tokens expiring < 14d", "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background" },
          "targets": [ { "expr": "count((llz_token_expiry_timestamp_seconds - time()) > 0 and (llz_token_expiry_timestamp_seconds - time()) < (14*86400)) or vector(0)", "legendFormat": "soon" } ],
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [ { "value": null, "color": "green" }, { "value": 1, "color": "orange" } ] } } }
        },
        {
          "id": 3, "title": "Certs expiring < 7d", "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background" },
          "targets": [ { "expr": "count((certmanager_certificate_expiration_timestamp_seconds - time()) > 0 and (certmanager_certificate_expiration_timestamp_seconds - time()) < (7*86400)) or vector(0)", "legendFormat": "soon" } ],
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [ { "value": null, "color": "green" }, { "value": 1, "color": "orange" } ] } } }
        },
        {
          "id": 4, "title": "Inventory freshness (age)", "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value" },
          "targets": [ { "expr": "time() - max(llz_token_inventory_updated_timestamp_seconds)", "legendFormat": "age" } ],
          "fieldConfig": { "defaults": { "unit": "s", "thresholds": { "mode": "absolute", "steps": [ { "value": null, "color": "green" }, { "value": 93600, "color": "red" } ] } } }
        },
        {
          "id": 5, "title": "CI tokens — days until expiry", "type": "table",
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [ { "expr": "(llz_token_expiry_timestamp_seconds - time()) / 86400", "legendFormat": "{{ provider }} / {{ token }}", "instant": true, "format": "table" } ],
          "fieldConfig": { "defaults": { "unit": "d", "custom": { "displayMode": "color-background" }, "thresholds": { "mode": "absolute", "steps": [ { "value": null, "color": "red" }, { "value": 3, "color": "orange" }, { "value": 14, "color": "green" } ] } } }
        },
        {
          "id": 6, "title": "Certificates — days until expiry", "type": "table",
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [ { "expr": "(certmanager_certificate_expiration_timestamp_seconds - time()) / 86400", "legendFormat": "{{ namespace }} / {{ name }}", "instant": true, "format": "table" } ],
          "fieldConfig": { "defaults": { "unit": "d", "custom": { "displayMode": "color-background" }, "thresholds": { "mode": "absolute", "steps": [ { "value": null, "color": "red" }, { "value": 2, "color": "orange" }, { "value": 7, "color": "green" } ] } } }
        },
        {
          "id": 7, "title": "OpenBao credential age — rotatable (days)", "type": "timeseries",
          "description": "Credentials whose age something can bring back down: class=automated (a rotator resets them on a cadence) and class=on-demand (a rotation path exists, but an operator dispatches it — the Managed Postgres admin credential). These are the classes LLZCredentialRotationOverdue warns on. Red at the 90d SLA.",
          "gridPos": { "h": 8, "w": 14, "x": 0, "y": 13 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [ { "expr": "llz_credential_age_days{namespace=\"llz-reconciler\", class=~\"automated|on-demand\"}", "legendFormat": "{{ cred }} ({{ class }})" } ],
          "fieldConfig": { "defaults": { "unit": "d", "thresholds": { "mode": "absolute", "steps": [ { "value": null, "color": "green" }, { "value": 90, "color": "red" } ] } } }
        },
        {
          "id": 8, "title": "Credentials with NO rotation automation", "type": "table",
          "description": "generate-once (ESO PushSecret + Password generator, updatePolicy IfNotExists — written at bootstrap, never again), tracks-source (mirrors a source of truth outside OpenBao), and static (bootstrap/operator seed — the Harbor robots, both GitHub-PAT copies, the Slack webhook, and the per-cluster Managed Postgres admin credentials). Their age is real and only ever climbs; nothing in the platform will lower it. Shown so the gap is visible rather than silently absent — see docs/secrets.md.",
          "gridPos": { "h": 8, "w": 10, "x": 14, "y": 13 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [ { "expr": "llz_credential_age_days{namespace=\"llz-reconciler\", class=~\"generate-once|tracks-source|static\"}", "legendFormat": "{{ cred }} ({{ class }})", "instant": true, "format": "table" } ],
          "fieldConfig": { "defaults": { "unit": "d", "custom": { "displayMode": "color-background" }, "thresholds": { "mode": "absolute", "steps": [ { "value": null, "color": "blue" }, { "value": 365, "color": "orange" } ] } } }
        },
        {
          "id": 9, "title": "Credential PRESENCE — configured as expected?", "type": "table",
          "description": "The half of the pane that age cannot show. Every panel above plots an AGE, and a credential that was never configured has no age — so before llz_credential_configured existed it appeared nowhere at all, which read as healthy. 1 = this credential's presence matches what is expected of it. The expectation is applied by the reconciler, not carried as a metric label: the registry has no delete, so a classification label would strand a stale series firing forever when a credential is reclassified. OPENBAO_ROOT_TOKEN is expected ABSENT — a root token is ephemeral by design (bootstrap revokes it; the recovery quorum is what survives), so a 1 there is a live full-admin credential left by a break-glass whose revoke never ran. Rules: LLZCredentialUnconfigured, LLZCredentialRootTokenParked.",
          "gridPos": { "h": 8, "w": 14, "x": 0, "y": 21 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [ { "expr": "llz_credential_presence_ok{namespace=\"llz-reconciler\"}", "legendFormat": "{{ cred }}", "instant": true, "format": "table" } ],
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "displayMode": "color-background" }, "thresholds": { "mode": "absolute", "steps": [ { "value": null, "color": "text" } ] } } }
        },
        {
          "id": 10, "title": "Write-time probe reachable?", "type": "stat",
          "description": "1 when `llz ci token-inventory` could build its GitHub secrets-metadata client. When this is 0 every write-time credential age above is stale or missing, and the symptom is SILENCE — no entries, no series, nothing for any rule to fire on. It was 0 on every run from the day ADR 0009 shipped until the credential-single-pane job was given a GH_REPO. Rule: LLZCredentialSecretProbeUnavailable.",
          "gridPos": { "h": 8, "w": 10, "x": 14, "y": 21 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [ { "expr": "max(llz_credential_secret_probe_ok{namespace=\"llz-reconciler\"})", "instant": true } ],
          "fieldConfig": { "defaults": { "unit": "short", "thresholds": { "mode": "absolute", "steps": [ { "value": null, "color": "red" }, { "value": 1, "color": "green" } ] } } }
        }
      ]
    }
