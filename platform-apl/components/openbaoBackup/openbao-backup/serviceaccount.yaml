# The identity the `openbao-backup` Kubernetes-auth role binds (bao-configure:
# bound_service_account_names=openbao-backup, namespaces=llz-openbao-backup).
# Renaming either side breaks the login; TestOpenBaoBackupManifestMatchesTheRole
# holds them together.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-backup
  namespace: llz-openbao-backup
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
