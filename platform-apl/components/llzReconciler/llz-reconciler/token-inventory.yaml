# In-cluster token-inventory WRITER — the per-region CronJob that replaces the
# hosted-runner `llz ci token-inventory | kubectl apply` step in
# llz-scheduled-checks.yml's credential-single-pane job. It measures the expiry of
# the external CI tokens it can reach and writes the llz-token-inventory ConfigMap
# the co-located reconciler re-exposes as llz_token_expiry_* metrics (READER side:
# reconcile_tokens.go + the resourceName-scoped GET Role in rbac.yaml).
#
# Locus: the reconciler reads this ConfigMap from its OWN namespace on EVERY region
# (a 404 no-ops, absence trips LLZTokenInventoryStale), so the writer is co-located
# per-region here rather than on the single broadPatRotator cluster — see
# docs/adr/0001-pat-rotation-locus.md. The tokens it measures are all present in
# every region already, so it NEVER holds the broad account:read_write PAT:
#   * GitHub service PATs — OPENBAO_SECRETS_WRITE_TOKEN + APL_VALUES_REPO_TOKEN,
#     ESO-synced from OpenBao (instance-wide tokens; the expiry-header probe).
#   * the region's NARROW Linode PAT (secret/linode/api-token, the existing
#     linode-api-token ExternalSecret) — enumerates the account's PATs if the API
#     permits it; a refusal is skipped, the GitHub entries still write (the writer
#     is best-effort per provider).
#
# The ConfigMap carries METADATA ONLY (provider, name, expiry, coarse state) — never
# a token value. The writer holds token material only to probe expiry.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llz-token-inventory
  namespace: llz-reconciler
---
# Least-privilege: write EXACTLY the one llz-token-inventory ConfigMap in this ns.
# create can't be resourceName-scoped in RBAC (it stands alone); get/patch — the
# create-then-merge-patch upsert `llz ci token-inventory --apply` performs — are
# pinned to the single object. No other verb, no other resource.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llz-token-inventory
  namespace: llz-reconciler
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["llz-token-inventory"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llz-token-inventory
  namespace: llz-reconciler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: llz-token-inventory
subjects:
  - kind: ServiceAccount
    name: llz-token-inventory
    namespace: llz-reconciler
---
# OPENBAO_SECRETS_WRITE_TOKEN — the fine-grained github.com PAT seeded at
# secret/infra/github-dispatch-token (the same token harbor + broadPatRotator use).
# Always present, so the CronJob's keyRef is required.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llz-token-inventory-openbao-write-token
  namespace: llz-reconciler
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: llz-token-inventory-openbao-write-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: infra/github-dispatch-token
        property: token
---
# APL_VALUES_REPO_TOKEN — the Contents:write PAT apl-core's otomi.git + the argocd
# repo Secrets use. Seeded best-effort at secret/infra/apl-values-repo-token
# (`llz ci bao-seed-all`, on-missing skip): an instance that never set it simply
# leaves this ExternalSecret unresolved, and the CronJob's optional keyRef then
# leaves the env unset (the token shows state=unknown in the inventory).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llz-token-inventory-apl-values-token
  namespace: llz-reconciler
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: llz-token-inventory-apl-values-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: infra/apl-values-repo-token
        property: token
---
# Egress-only NetworkPolicy for the writer pod (the ns inherits default-deny). It
# talks to DNS, the GitHub + Linode APIs (:443), and the LKE-E apiserver (:443 +
# :6443 DNAT) to write the ConfigMap. No ingress (nothing scrapes it); no OpenBao
# (tokens arrive via ESO Secrets, not a direct :8200 read).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llz-token-inventory
  namespace: llz-reconciler
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: llz-token-inventory
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # api.github.com + api.linode.com (:443) and the LKE-E apiserver (:443 + :6443
    # DNAT — bare ports rule, no in-cluster apiserver pod to select on managed LKE-E).
    - ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 6443 }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: llz-token-inventory
  namespace: llz-reconciler
  annotations:
    argocd.argoproj.io/sync-wave: "6"
    ignore-check.kube-linter.io/env-value-from: "the token Secrets are created at runtime by ESO (the ExternalSecrets above); not static manifests the linter can resolve"
    ignore-check.kube-linter.io/read-secret-from-env-var: "the writer holds the GitHub/Linode tokens only to probe their expiry headers — reading them via env is its purpose"
spec:
  # Daily 06:00 UTC — the cadence the retired credential-single-pane writer ran at.
  schedule: "0 6 * * *"
  startingDeadlineSeconds: 300
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: llz-token-inventory
        spec:
          restartPolicy: Never
          serviceAccountName: llz-token-inventory
          containers:
            - name: token-inventory
              # Carved-component llz image; the images: transformer retags :latest
              # per instance/e2e (see carvedLLZImageComponents).
              image: ghcr.io/akamai-consulting/llz:latest
              args: ["ci", "token-inventory", "--apply"]
              env:
                - name: OPENBAO_SECRETS_WRITE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: llz-token-inventory-openbao-write-token
                      key: token
                # optional: an instance that never seeded the token leaves the
                # ExternalSecret unresolved; the writer treats an unset token as
                # state=unknown rather than failing to start.
                - name: APL_VALUES_REPO_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: llz-token-inventory-apl-values-token
                      key: token
                      optional: true
                # The region's narrow in-cluster Linode PAT (existing ESO Secret) —
                # used to enumerate the account's PATs where the API permits it.
                - name: LINODE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: linode-api-token
                      key: token
              resources:
                limits: { cpu: 200m, memory: 128Mi }
                requests: { cpu: 50m, memory: 64Mi }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65532
                seccompProfile: { type: RuntimeDefault }
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: tmp
              emptyDir: { medium: Memory, sizeLimit: 16Mi }
