# llz-reconciler Deployment — the long-lived `llz reconcile` process.
#
# Runs the observe-only gauges + the enabled reconcilers (see the args below). It
# samples/serves over the in-cluster ServiceAccount (KUBERNETES_SERVICE_HOST + the
# auto-mounted SA token/CA that kube.NewInCluster reads), publishes :8080/metrics,
# and — for the enabled driving reconcilers — holds a coordination.k8s.io Lease so
# only one replica writes. Single replica + never-two-pods rollout (below).
#
# Image is the slim distroless llz (dockerfiles/llz), the same artifact the
# CronJobs run; rendered by copier and pinned to the signed sha image for the
# commit under test by release-e2e. No new deps over that image (the reconciler is
# stdlib net/http + internal/kube + internal/metrics — no client-go).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llz-reconciler
  namespace: llz-reconciler
  annotations:
    # Wave 0 (was 6): the linode-api-token Secret is now an OPTIONAL volume with
    # a lazy per-pass file read (secrets-before-apps Phase 2), so the pod goes
    # Ready with or without it and the old wave-6 inversion workaround (a hard
    # env secretKeyRef that held the pod in CreateContainerConfigError until the
    # OpenBao store served — starving the whole wave when ordered wrong) is
    # retired. Starting BEFORE the store is the point: the argo-nudge and
    # es-store-recovery lanes must be live during bootstrap, exactly when the
    # store recovers. The linode-dependent lanes no-op cleanly until the token
    # file appears (kubelet syncs the mounted Secret, which ALSO picks up
    # rotations — the env ref never did without a pod restart).
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  # Never run two pods at once: the old pod terminates before the new starts.
  # Phase 0 is observe-only so overlap would be harmless, but this keeps the
  # single-writer invariant the Phase 1 reconcilers need without depending on
  # leader election during a rollout — at the cost of a few seconds' metrics gap
  # on redeploy, immaterial for a 30s sampler.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: llz-reconciler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llz-reconciler
    spec:
      serviceAccountName: llz-reconciler
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: reconcile
          image: ghcr.io/akamai-consulting/llz:latest
          # ENABLED: observe-only gauges + the leader-gated driving reconcilers that
          # need no per-env secrets — argo-nudge, sc-demote (batch 1) — plus the
          # read-only openbao-gauges (batch 2: seal-status + credential-age; its
          # OpenBao :8200 egress is in the NetworkPolicy and its ingress is opened
          # by the chart's allowedClientPods entry; the `reconciler` k8s-auth role
          # ships from bao-configure). Idempotent/read-only alongside the CronJobs,
          # which stay until each proves out.
          # volume-labels: renames bound Linode-CSI Volumes to
          # <REGION_SHORT>-<ns>-<pvc>. Needs LINODE_TOKEN (ESO Secret) + REGION_SHORT
          # (per-env, filled by the render-patch). Leader-gated + idempotent
          # alongside the linode-volume-labeler CronJob.
          # cidr-firewall (this batch): the discover-firewall-config logic — reads
          # NODE_NAME (downward API) → the node's Linode instance → its firewall/VPC,
          # plus LINODE_TOKEN. Leader-gated + idempotent alongside the cidrFirewall
          # CronJob. NOTE: the private firewall controller is absent on e2e, so this
          # is exercised but not end-to-end proven there (harmless no-op).
          # linode-creds: the rotate-linode-creds logic — rotates the in-cluster
          # object-storage keys and writes them to OpenBao (Kubernetes-auth `reconciler`
          # role, granted the linode-rotator policy in bao-configure). Needs REGION +
          # OBJ_CLUSTER (per-env, render-patch) + OPENBAO_* + LINODE_TOKEN. Due-based: a
          # no-op until a key is within its rotation window. Leader-gated; the sole owner
          # now that the linodeCredRotator CronJob is retired.
          # NOT a reconciler: --reconcile-harbor. Harbor provisioning talks to the
          # mesh-protected harbor-core Service, which a pod in llz-reconciler (outside
          # the harbor Istio mesh) cannot reach — so it stays the in-namespace
          # harbor-robot-provisioner CronJob (components/harbor/).
          args:
            - reconcile
            - --metrics-addr=:8080
            # /healthz on its own PLAINTEXT port. The kubelet runs the liveness
            # and readiness probes and cannot present a client certificate, so it
            # cannot be moved behind the mTLS listener below; splitting the ports
            # is what lets /metrics require a client cert without CrashLooping the
            # pod on every probe. /healthz exposes a leader-election verdict only.
            - --health-addr=:8081
            # mTLS for /metrics. All three or none — serveMetrics rejects a
            # partial set rather than silently serving unauthenticated.
            - --metrics-tls-cert-file=/etc/metrics-tls/tls.crt
            - --metrics-tls-key-file=/etc/metrics-tls/tls.key
            - --metrics-tls-client-ca-file=/etc/metrics-client-ca/ca.crt
            - --sample-interval=30
            - --reconcile-argo-nudge
            - --reconcile-sc-demote
            - --reconcile-openbao-gauges
            - --reconcile-token-inventory
            - --reconcile-volume-labels
            - --reconcile-cidr-firewall
            - --reconcile-linode-creds
            # es-store-recovery: force-sync every ExternalSecret/PushSecret when
            # the openbao ClusterSecretStore transitions to Ready — the
            # in-cluster, event-driven owner of what `llz ci nudge-argo`'s
            # force-sync half does from CI (secrets-before-apps Phase 2; the CI
            # half stays until Phase 3 validates this lane end-to-end).
            - --reconcile-es-store-recovery
            # apl-overlay: git-sync the apl-core-native obj storage + app toggles
            # onto apl-<env> with ff-retry (leader-gated; replaces the config
            # force-push). Reads the overlay from the primary repo over the GitHub
            # API, fills the obj cred from OpenBao secret/obj/platform, and overlays
            # only its owned files onto the machine branch. Safe-by-construction: a
            # no-op until apl-operator has bootstrapped apl-<env> and the obj key is
            # seeded. Runtime consumption is lab-gated — see
            # docs/designs/apl-overlay-obj-native.md.
            - --reconcile-apl-overlay
          env:
            # Leader-election identity + Lease namespace (downward API). Only used
            # when a driving reconciler is enabled; harmless otherwise.
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            # OpenBao endpoint for the openbao-gauges sampler. The hop is mTLS:
            # this pod verifies OpenBao's serving cert against the openbao-ca root
            # (/etc/openbao-tls/ca.crt) AND presents its own llz-reconciler client
            # identity (/etc/openbao-client-tls), which the listener requires.
            # Both mounts are below; the file paths are the code defaults in
            # openbao_k8s_login.go, restated here only where they differ.
            # OPENBAO_ADDR has a code default but is set explicitly for legibility.
            - name: OPENBAO_ADDR
              value: "https://platform-openbao.llz-openbao.svc.cluster.local:8200"
            # (LINODE_TOKEN is no longer an env secretKeyRef: the linode lanes
            # lazily read the optional linode-api-token volume below — env would
            # hold the pod hostage pre-store AND never see a rotation.)
            # volume-labels reconciler: the per-env label prefix. REGION_SHORT is
            # a placeholder overwritten per-env by llz-reconciler-env-patch.yaml
            # (llz render).
            - name: REGION_SHORT
              value: "REPLACE_ME"
            # cidr-firewall reconciler: the node this pod lands on identifies the
            # Linode instance (→ providerID → firewall/VPC) to discover. Downward
            # API, so no per-env render needed.
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            # linode-creds reconciler: REGION (= env name) + OBJ_CLUSTER (= spec
            # object-storage cluster) are per-env placeholders overwritten by
            # llz-reconciler-env-patch.yaml (llz render), same as REGION_SHORT.
            - name: REGION
              value: "REPLACE_ME"
            - name: OBJ_CLUSTER
              value: "REPLACE_ME"
            # apl-overlay reconciler: the instance repo slug (owner/name) it reads
            # the overlay from + git-syncs onto apl-<env>. Per-env, filled by
            # llz-reconciler-env-patch.yaml (llz render), same as REGION.
            - name: GH_REPO
              value: "REPLACE_ME"
            # apl-overlay reconciler: the Contents:write PAT that authorizes the
            # git-data pushes onto apl-<env> (ESO-synced apl-values-repo-token from
            # OpenBao secret/infra/apl-values-repo-token — the same token apl-core's
            # otomi.git uses) is NOT an env secretKeyRef: the pod starts at wave 0,
            # before the store serves. It is mounted as an optional volume below and
            # read lazily per pass (apl_values_token.go), same as linode-api-token —
            # so no wave inversion and rotations are picked up without a restart.
            # OpenBao's serving cert is signed by its private `openbao-ca` CA, so
            # verifying it needs that CA in this namespace: openbao-ca-bundle.yaml
            # issues a throwaway leaf from the same ClusterIssuer purely to obtain
            # `ca.crt`. OPENBAO_CA_FILE takes precedence in inClusterBaoHTTPClient();
            # OPENBAO_SKIP_VERIFY stays as the fallback for the window before the
            # Secret exists, because that helper requires one of the two to be set
            # and would otherwise hard-fail the openbao lanes on a cold start.
            # OPENBAO_SKIP_VERIFY is GONE (ADR 0010). #358 added OPENBAO_CA_FILE
            # with skip-verify as a cold-start fallback; the fallback is now
            # unreachable, because the listener requires a CLIENT certificate too
            # — unverified TLS cannot complete the handshake at all. Removing the
            # flag keeps the manifest honest: there is no longer any env var that
            # can downgrade this hop.
            - name: OPENBAO_CA_FILE
              value: /etc/openbao-ca/ca.crt
            # linode-creds logs into OpenBao via Kubernetes auth. rotate-linode-creds
            # defaults the role to `linode-rotator` (the CronJob's SA-bound role), but
            # THIS pod runs as the llz-reconciler SA, which is bound to the `reconciler`
            # role (now carrying the linode-rotator policy). Override so the login
            # resolves to a role this SA is actually bound to — otherwise it 403s.
            - name: OPENBAO_KUBERNETES_ROLE
              value: "reconciler"
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            # Separate probe port — see the --health-addr note above.
            - name: health
              containerPort: 8081
              protocol: TCP
          # Probes target `health`, NOT `metrics`. Pointing them at the metrics
          # port would fail every probe: that listener demands a client
          # certificate and kubelet has none, so the pod would CrashLoop.
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            limits: { cpu: 200m, memory: 128Mi }
            requests: { cpu: 25m, memory: 48Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - name: linode-api-token
              mountPath: /var/run/secrets/llz/linode-api-token
              readOnly: true
            - name: apl-values-repo-token
              mountPath: /var/run/secrets/llz/apl-values-repo-token
              readOnly: true
            # SERVER half — verifies OpenBao's serving cert (#358's bundle).
            - name: openbao-ca
              mountPath: /etc/openbao-ca
              readOnly: true
            # CLIENT half — this pod's identity, which the listener requires.
            # Its volume is `optional` (see volumes below): the pod's non-OpenBao
            # lanes must keep running if the identity has not issued yet.
            - name: openbao-client-tls
              mountPath: /etc/openbao-client-tls
              readOnly: true
            # Serving side: this pod's own cert for the mTLS /metrics listener,
            # and the client CA it verifies scrapers against.
            - name: metrics-tls
              mountPath: /etc/metrics-tls
              readOnly: true
            - name: metrics-client-ca
              mountPath: /etc/metrics-client-ca
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        # optional: the ESO-synced token lands only after the OpenBao store is
        # Ready; the pod starts (and the argo-nudge + es-store-recovery lanes
        # run) without it, and kubelet materializes/refreshes the file when the
        # Secret appears or rotates. Consumed via linode_token.go's lazy read.
        - name: linode-api-token
          secret:
            secretName: linode-api-token
            optional: true
        # optional for the same reason: cert-manager issues the bundle at wave 0,
        # and the pod's non-OpenBao lanes must not wait on it.
        - name: openbao-ca
          secret:
            secretName: openbao-ca-bundle
            optional: true
        # Same optional-volume posture for the apl-overlay push token — the pod
        # goes Ready at wave 0 before the store serves; apl_values_token.go reads
        # this file lazily per pass (and picks up rotations without a restart).
        - name: apl-values-repo-token
          secret:
            secretName: apl-values-repo-token
            optional: true
        # mTLS material, both written by cert-manager (client-tls-certificate.yaml
        # in this directory). NOT optional — see the volumeMounts note.
        #
        # 0444, NOT 0400. Secret volume files are owned root:root and this pod
        # runs as uid 65532 with no fsGroup, so 0400 would make the key
        # unreadable to the only process that needs it. World-readable is
        # world-inside-this-pod: the single container is the reconciler itself.
        # The controls that actually protect this key are RBAC on the Secret and
        # etcd encryption at rest, not the in-pod file mode.
        # optional, matching the openbao-ca bundle above: this pod runs many
        # lanes that never touch OpenBao (argo-nudge, sc-demote, volume-labels,
        # cidr-firewall), and wedging all of them in ContainerCreating because an
        # OpenBao identity has not issued yet would be a worse failure than the
        # OpenBao lanes erroring. inClusterBaoHTTPClient retries rather than
        # caching that failure, so the lanes recover on their own once it lands.
        # The CronJobs mount theirs NON-optional — they exist only to do OpenBao
        # work, so for them waiting is exactly right.
        - name: openbao-client-tls
          secret:
            secretName: llz-reconciler-client-tls
            defaultMode: 0444
            optional: true
        # Serving keypair for /metrics (llz-serving-ca leaf).
        - name: metrics-tls
          secret:
            secretName: llz-reconciler-serving-tls
            defaultMode: 0444
        # llz-client-ca root — scrapers must chain to it. ca.crt off the
        # scrape-client Secret: cert-manager writes the ISSUING CA there, and
        # that Secret's issuer IS llz-client-ca, so its ca.crt is exactly the
        # bundle this listener needs. (Reusing it avoids a fourth Certificate
        # whose only job would be to restate the same root.)
        - name: metrics-client-ca
          secret:
            secretName: llz-reconciler-scrape-client-tls
            defaultMode: 0444
            items:
              - key: ca.crt
                path: ca.crt
