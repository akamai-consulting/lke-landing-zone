# The two Secrets the Velero server needs, from OpenBao. Neither is created by the
# chart (credentials.existingSecret / the BSL's customerKeyEncryptionSecret name
# them), so they must exist before the server starts: wave -5, before the Velero
# Application at 0.
#
# 5m refresh is the secrets-before-apps Phase 1 propagation bound: the object-
# storage key ROTATES (the reconciler's linode-creds lane re-mints it), and a
# rotated key must not be served stale for longer than that. Velero's AWS plugin
# reads the credentials file each time it initialises an object store, and the
# Secret is mounted as a volume (not subPath), so a rotation reaches it without a
# restart.
#
# ── 1. The object-storage key, as the AWS credentials FILE the plugin reads ────
# Scoped to the velero bucket alone (credrotate's `velero` entry). No `secret/`
# prefix on remoteRef.key: the ClusterSecretStore is mounted at the KV engine.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-cloud-credentials
  namespace: llz-velero
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: velero-cloud-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # One INI file, under the key the chart's credentials mount expects
        # (AWS_SHARED_CREDENTIALS_FILE=/credentials/cloud).
        cloud: |
          [default]
          aws_access_key_id={{ .accessKeyId }}
          aws_secret_access_key={{ .secretAccessKey }}
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: obj/velero
        property: AWS_ACCESS_KEY_ID
    - secretKey: secretAccessKey
      remoteRef:
        key: obj/velero
        property: AWS_SECRET_ACCESS_KEY
---
# ── 2. The SSE-C key every backup object is encrypted under ──────────────────
#
# KEY LOSS IS BACKUP LOSS. Linode discards SSE-C keys on receipt, so a backup
# written under a key nobody holds is unreadable by us and by Linode. The key is
# generated ONCE by `llz ci seed-ssec-key` into secret/obj/velero-ssec and lives in
# OpenBao — which is restored from its OWN Raft snapshots, never from Velero
# (docs/runbooks/openbao-backup-restore.md). So the recovery order after a lost
# cluster is: OpenBao from its snapshot, then this Secret syncs, then Velero can
# read its backups. Escrow it offline as well, exactly like the objProxy key.
#
# The plugin requires EXACTLY 32 raw bytes (customerKeyEncryptionSecret reads the
# Secret's data and rejects any other length); OpenBao holds it base64-encoded, so
# ESO decodes it on the way in.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-ssec-key
  namespace: llz-velero
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: velero-ssec-key
    creationPolicy: Owner
  data:
    - secretKey: customer-key
      remoteRef:
        key: obj/velero-ssec
        property: key
        decodingStrategy: Base64
