apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - certificate.yaml
  # ca-trust.yaml IS included: on its own it only issues a CA bundle Secret into the
  # harbor namespace, which nothing reads until the Kyverno policy mounts it. Having
  # it present before the policy is what lets the mutation work on the first pod
  # admitted rather than the second.
  - ca-trust.yaml
  # The Kyverno mutation that mounts that bundle into harbor-registry pods. Lives
  # here, not in tools/cmd/llz/manifests/, because nothing applies that directory.
  - kyverno-harbor-ca.yaml
  - externalsecret.yaml
  # The obj key the proxy re-signs with (#397). Listed with the other secrets, ahead
  # of the DaemonSet that mounts it.
  - creds-externalsecret.yaml
  - service.yaml
  - network-policy.yaml
  - daemonset.yaml
  # THE ON SWITCH, and deliberately last in this list: it is the only file here that
  # changes where Loki's and Harbor's traffic goes. Everything above it is inert
  # until this lands. Its sync wave (10) puts it after the CA + policy at wave 5,
  # and `llz ci wait-harbor` rolls any registry pod that predates the policy — see
  # the file header for why order is the whole safety story.
  - coredns-rewrite.yaml
