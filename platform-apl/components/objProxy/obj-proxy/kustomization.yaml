apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - certificate.yaml
  # ca-trust.yaml IS included: on its own it only issues a CA bundle Secret into the
  # harbor namespace, which nothing reads until the Kyverno policy mounts it. Having
  # it present before the policy is what lets the mutation work on the first pod
  # admitted rather than the second.
  - ca-trust.yaml
  # The Kyverno mutation that mounts that bundle into harbor-registry pods. Lives
  # here, not in tools/cmd/llz/manifests/, because nothing applies that directory.
  - kyverno-harbor-ca.yaml
  - externalsecret.yaml
  - service.yaml
  - network-policy.yaml
  - daemonset.yaml
