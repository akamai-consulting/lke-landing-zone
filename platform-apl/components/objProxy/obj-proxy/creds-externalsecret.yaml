# The object-storage key the proxy re-signs with — the #397 repair.
#
# WHY THE PROXY HOLDS A CREDENTIAL AT ALL, since it went to some trouble not to.
# Linode's Ceph RGW rejects the AWS SDK's default PutObject framing (aws-chunked with
# an x-amz-trailer CRC32) with 403 AccessDenied, and Loki 3.7.2 cannot be told to
# stop sending it: its legacy S3 client has no checksum knob and ignores
# AWS_REQUEST_CHECKSUM_CALCULATION — measured, with a Kyverno mutation confirmed
# present on an ingester that still failed every flush. Repairing the request means
# de-chunking the body, and the framing headers are inside SignedHeaders, so the
# request has to be re-signed. That needs a secret key.
#
# WHAT THIS DOES NOT GRANT. It is the SAME key the clients already use
# (secret/obj/platform — the one apl-core resolves for loki and harbor via
# observability/obj-secrets-externalsecret.yaml), so the proxy gains no reach over
# object storage that the workloads on the other side of it did not already have. The
# proxy refuses to re-sign a request whose Authorization names any OTHER access key,
# so it repairs requests, it never launders one identity into another.
#
# It IS a real increase in what a COMPROMISED proxy could do: with only the SSE-C key
# it could relay signed requests, and with this it could mint them. That is the trade
# for Loki being able to write at all, and it is why `llz obj-proxy` treats the
# credential as optional — a deployment that does not need the repair should not mount
# this, and the proxy then never re-signs anything.
#
# 5m refresh is the secrets-before-apps Phase 1 propagation bound, matching the SSE-C
# key beside it: a rotated obj key must not be served stale for longer than that, or
# the proxy re-signs with a credential the upstream has already retired.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obj-proxy-creds
  namespace: obj-proxy
  annotations:
    # Same wave as the SSE-C key: both are startup requirements for the DaemonSet at
    # wave 5, and a Secret that lands after its consumer leaves the pod in
    # ContainerCreating until ESO catches up.
    argocd.argoproj.io/sync-wave: "-11"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: obj-proxy-creds
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # One file, env-shaped, because the process reads a single --creds-file. The
        # alternative (two projected keys) would make the proxy read two paths and
        # give it a half-configured state to handle when only one has synced.
        credentials: |
          AWS_ACCESS_KEY_ID={{ .accessKeyId }}
          AWS_SECRET_ACCESS_KEY={{ .secretAccessKey }}
  data:
    # No `secret/` prefix: the ClusterSecretStore is mounted at the KV engine, so
    # remoteRef.key is relative to it. The absolute form is secret/obj/platform.
    - secretKey: accessKeyId
      remoteRef:
        key: obj/platform
        property: AWS_ACCESS_KEY_ID
    - secretKey: secretAccessKey
      remoteRef:
        key: obj/platform
        property: AWS_SECRET_ACCESS_KEY
