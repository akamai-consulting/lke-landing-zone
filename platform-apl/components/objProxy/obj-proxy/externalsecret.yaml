# The SSE-C key, delivered from OpenBao.
#
# KEY LOSS IS TOTAL DATA LOSS. Linode discards SSE-C keys on receipt, so an object
# written under a key nobody holds is unrecoverable by us AND by Linode. This needs
# the same offline-escrow discipline as OPENBAO_SEAL_KEY and
# TF_STATE_ENCRYPTION_PASSPHRASE — it is a third member of that class, and being
# the newest it is the one most likely to be missed in a DR rehearsal.
#
# ROTATION IS A MIGRATION, NOT A FLAG FLIP. SSE-C keys are per-object: rotating
# means rewriting every object under the new key (a copy carrying both the
# copy-source and the destination trios). There is no server-side rekey. Budget it
# against total bucket size, not against the number of keys.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obj-proxy-ssec-key
  namespace: obj-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "-11"
spec:
  # 5m is the secrets-before-apps Phase 1 propagation bound, not a preference: a
  # rotated credential must not be served stale for longer than that. It matters
  # less here than for most (an SSE-C key rotation is a whole-bucket migration, not
  # a value swap) but the bound is uniform on purpose.
  refreshInterval: 5m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: obj-proxy-ssec-key
    creationPolicy: Owner
  data:
    - secretKey: key
      # No `secret/` prefix: the ClusterSecretStore is already mounted at the KV
      # engine, so remoteRef.key is relative to it. `llz ci seed-ssec-key` writes
      # the same location spelled `secret/obj/ssec` — that is the bao CLI's
      # absolute form, not a different path.
      remoteRef:
        key: obj/ssec
        property: key
