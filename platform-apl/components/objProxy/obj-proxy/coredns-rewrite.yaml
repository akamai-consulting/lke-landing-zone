# THE ON SWITCH — read this before applying it.
#
# Everything else in this component is inert without this file. It points the
# Object Storage endpoint hostname at the obj-proxy Service, which is what routes
# Loki's and Harbor's S3 traffic through the SSE-C gateway instead of straight to
# Linode.
#
# WHY DNS AND NOT CONFIG. apl-core renders the endpoint for both writers as
# `https://{{ $obj.linode.region }}.linodeobjects.com` — derived from `region`, not
# independently settable — so there is no supported way to point them at a proxy.
# And we would not want to change the NAME even if we could: the proxy deliberately
# does not re-sign (SSE-C headers are honoured outside SigV4 SignedHeaders,
# measured), so the Host the client signed must survive to the upstream untouched.
# DNS is the only layer that redirects the traffic without altering what was signed.
#
# THIS IS NOT A COREFILE PATCH — verified against the live e2e cluster (lke638381).
# The Corefile is a Flux-managed Helm resource (helm.toolkit.fluxcd.io/name:
# workload, ConfigMap kube-system/workload-coredns), so editing it directly would be
# reverted on the next reconcile. It ships CoreDNS's standard extension hooks:
#
#     import custom/*.server      # before the .:53 block — whole server blocks
#     .:53 { … import custom/*.include }   # INSIDE the block — directives
#
# and mounts an OPTIONAL ConfigMap `kube-system/coredns-custom` at
# /etc/coredns/custom. So this is a supported extension, not a patch, and Flux has
# no opinion about it. A `rewrite` is a directive, so it belongs in an `.include`.
# THIS OBJECT IS NOW ARGO-OWNED, which changes the advice that used to be here.
# While it was applied by hand the instruction was "merge this key rather than
# replacing the object"; a human could do that, and Argo cannot. It applies the whole
# ConfigMap, so on a cluster that ALREADY has a kube-system/coredns-custom — a
# supported CoreDNS extension point, and someone's other DNS customisation — Argo
# takes ownership and the other keys are lost.
#
# Verified absent on apl-core (it did not exist on the e2e cluster before this
# component created it), so no LLZ-managed cluster has one today. An adopter who does
# must fold their keys into this file rather than expecting a merge, because there is
# nothing left in the pipeline that would perform one.
#
# ORDER OF OPERATIONS — getting this wrong is a cluster-wide object-storage outage,
# not a degradation. It is now enforced rather than documented:
#
#   1. Component enabled, DaemonSet Ready on every node, secret/obj/ssec seeded
#      (`llz ci seed-ssec-key`). Confirm /stats on the health port.
#   2. HARBOR must trust the CA issuing obj-proxy-tls — see ca-trust.yaml. Loki does
#      NOT need this (it runs insecure_skip_verify: true on its S3 client), so Harbor
#      is the whole of the blocker.
#   3. THEN this. Sync wave 10 puts it after the CA and the Kyverno policy at wave 5.
#
# A LATER WAVE IS NOT SUFFICIENT ON ITS OWN, because the policy mutates on ADMISSION:
# registry pods that apl-core started before the policy existed carry no CA, and no
# wave ordering reaches a pod that is already running. `llz ci wait-harbor` closes
# that race — it reads the running pods and rolls the deployment if any of them
# predates the policy (retrofitHarborObjProxyCA). Without that step this file is
# safe only by luck of scheduling, which is not a property you can rely on twice.
#
# ROLLBACK is deleting this ConfigMap: DNS reverts to the real endpoint and traffic
# goes direct again. Objects written while the proxy was live stay ENCRYPTED and
# become unreadable on the direct path — rollback restores availability for new
# writes, not readability of what the proxy already encrypted. That asymmetry is why
# step 2 is verified rather than assumed.
#
# ENABLING THE COMPONENT NOW FLIPS THE SWITCH. This was previously held out of the
# kustomization so that could not happen; it is in, because a proxy that nothing
# routes to is a component that reports Healthy while every byte still goes to
# Linode in the clear — the failure that looks most like success. `llz ci
# assert-obj-encryption` gates on all four properties (CA, DNS, ciphertext, a real
# Harbor push) so the flip is verified rather than assumed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
  annotations:
    # Wave 10, after the CA bundle and the Kyverno policy at wave 5. See the header:
    # this is necessary for ordering but not sufficient, because admission-time
    # mutation cannot reach an already-running pod.
    argocd.argoproj.io/sync-wave: "10"
data:
  # `.include` (not `.server`): the Corefile imports these INSIDE the `.:53` block,
  # which is where a rewrite directive has to sit.
  #
  # `rewrite name` is EXACT-match on purpose — one name, nothing else. A regex or
  # suffix rule would put every lookup in the blast radius of a typo; this puts one
  # hostname there.
  #
  # REPLACE_ME is filled by `llz render` from the same spec …objectStorage.cluster
  # value the DaemonSet's OBJ_ENDPOINT_HOST and the certificate's dnsNames use — all
  # three must name the identical host or the handshake fails.
  #
  # The proxy itself must NOT see this rewrite: its DaemonSet sets
  # `dnsPolicy: Default` so it resolves via the node's resolver and reaches the real
  # Linode endpoint. Without that it would resolve its own upstream to itself and
  # every request would loop; `llz obj-proxy` refuses to start if it detects that.
  objproxy.include: |
    rewrite name REPLACE_ME.linodeobjects.com obj-proxy.obj-proxy.svc.cluster.local
