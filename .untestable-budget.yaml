# Budget for "untestable" code — logic embedded where it cannot be unit-tested:
# inline multi-line workflow bash, standalone shell scripts, Python scripts,
# bash embedded in Terraform provisioner `command` heredocs, and shell embedded
# in YAML block scalars (ConfigMap `data` scripts, Argo `script.source`).
#
# The design principle of this repo (see template-scripts/AGENTS.md and the llz
# CLI under tools/) is that decision-making logic belongs in unit-tested Go, not
# in CI shell. `llz ci untestable-loc` (run from lint.yml) tallies the logic
# lines below and FAILS the build when a category exceeds its budget — so a PR
# that piles new bash/python on instead of converting it is rejected at review
# time.
#
# These budgets are a RATCHET: lower them as logic moves into the CLI; never
# raise one to make a red build pass. If a file is genuine install/glue with no
# logic worth testing, add it to `exclude:` with a one-line justification
# instead of spending budget on it.
#
# Counting (reproducible — `llz ci untestable-loc --verbose` prints the
# per-file breakdown):
#   workflow-run          : LOGICAL lines inside multi-line `run:` blocks —
#                           backslash-continued commands count once, and single-
#                           line `run: <cmd>` tool invocations are glue and not
#                           counted (a converted step looks exactly like that, so
#                           neither penalizes conversion).
#   script                : non-blank, non-comment lines of the whole file.
#   terraform-provisioner : non-blank, non-comment bash inside `command = <<EOT
#                           … EOT` heredocs of local-exec / remote-exec
#                           provisioners. Single-line `command = "./x.sh"` is
#                           glue (the script is already counted under shell) and
#                           not tallied, same as a single-line `run:`.
#   makefile-recipe       : LOGICAL lines of shell in Makefile recipe bodies
#                           (tab-indented rule bodies + `define … endef` macro
#                           bodies, which expand to recipe shell). Backslash
#                           continuations count once, and a recipe whose whole
#                           body is ONE logical line is tool-invocation glue —
#                           the shape `$(call LLZ_CI,<verb>)` takes — so it is
#                           not counted, same rule as a single-line `run:`.
#                           Comments are skipped, and so is a line whose ENTIRE
#                           effect is printing literal text (`@echo "…"` — the
#                           `help:` wall). Printing makes no decision, and
#                           charging for it priced DOCUMENTATION at the rate of
#                           logic: `make help` cost a line per target, so the
#                           cheapest way under the ceiling was to stop
#                           documenting new targets. Narrow by construction —
#                           quoted spans are stripped first, then the remainder
#                           must be the bare command word, so redirection, a
#                           pipe, a chained command, an unquoted argument or a
#                           `$$(…)`/backtick substitution all still count.
#   embedded-shell        : non-blank, non-comment shell inside a YAML block
#                           scalar (`relabel.sh: |`, Argo `script.source: |`).
#                           A block counts as shell when its key ends in
#                           `.sh`/`.bash` or its first body line is a shell
#                           shebang; the shebang itself (a `#` line) is not
#                           tallied. These hide from the *.sh glob (the file is
#                           YAML), so they get a dedicated counter.
#
# Baseline (post check-coverage / chart-lock-drift / argocd-rendered-apps
# conversion to `llz ci`): inline-bash 669, shell 576, python 56,
# tf-provisioner 98. Budgets carry ~3% headroom over baseline.
#
# Ratcheted down (openbao-bootstrap conversion: bao-ensure-ready, bao-seed-all,
# extract-openbao-ca, nudge-argo, provision-peer-ca, and `llz env resolve` moved
# ~82 lines of inline bash into the unit-tested llz CLI), then kept tight after
# moving the retry-helper path assignment out of counted dry-run shell: workflow
# inline-bash is now 604, budget 605.
#
# embedded-shell exists because these blocks hide from the *.sh glob (the file is
# YAML), so shell evicted from a workflow INTO a ConfigMap `data` entry or an Argo
# `script.source` used to score as a reduction — the opposite of what this gate is
# for. The volume-labeler's relabel.sh (103 lines of ConfigMap shell) was the
# original motivating case; it is already gone, converted to the tested `llz ci
# relabel-volumes`. Its tag-heal sibling (`llz ci reconcile-volume-tags`) is tested
# Go with no embedded shell, so it costs nothing against this budget.

categories:
  workflow-inline-bash:
    kind: workflow-run
    # Ratcheted 605 → 550 when release-e2e.yml's and release-e2e-warm.yml's
    # byte-identical `instantiate` jobs were extracted into the shared reusable
    # workflow .github/workflows/e2e-instantiate.yml: the duplicated `run:` blocks
    # were being counted TWICE by the glob below, so deduplicating them dropped the
    # tally 597 → 534 without deleting any logic. Keep ~3% headroom rather than
    # leaving the freed budget as slack a future PR could fill with untested bash.
    #
    # Ratcheted 550 → 526 when the e2e assert battery moved out of YAML into
    # `llz ci assert-suite` (tools/cmd/llz/ci_assert_suite.go).
    #
    # It briefly went the other way. Six new e2e gates (assert-reconciler-effects,
    # assert-log-ingestion, assert-eso-roundtrip, assert-alert-delivery,
    # assert-grafana-dashboards, assert-admission-enforcement) pushed the tally to
    # 551 and the budget was RAISED to 560 to unblock — the one thing the paragraph
    # above and this gate's own error message both say not to do. The debt was then
    # paid in the same change rather than left as a comment, so the net is a ratchet
    # DOWN.
    #
    # What moved: the battery was ~40 lines of inline bash implementing a parallel
    # job runner — background N subprocesses into a temp dir, `wait`, then re-read
    # each lane's rc/log in a `for` loop to print ::group:: blocks and decide the
    # step's exit status. Three things were wrong with it, and the gate was right to
    # object: the code deciding whether the battery FAILS was the only untested part
    # of it; the lane list was written twice (once to run, once to collect) so a lane
    # present in the first and missing from the second ran and could never fail the
    # step; and the list shipped per-instance, so a new gate reached an instance only
    # when someone edited its vendored workflow.
    #
    # Tally after the move: 511 — 39 below the pre-existing 550 ceiling even with the
    # six new gates added. Budgeted at 511 + ~3%, same convention as the others.
    budget: 526
    include:
      - ".github/workflows/*.yml"
      - "instance-template/.github/workflows/*.yml"
      - ".github/actions/**/action.yml"

  makefile-recipe:
    kind: makefile-recipe
    # The Makefile was invisible to every other counter — its recipes are not a
    # workflow `run:`, not a standalone script, not a TF provisioner heredoc — so
    # shell moved from a workflow INTO a Makefile recipe scored as a REDUCTION.
    # That hole is why several multi-line recipes accumulated while the workflow
    # categories were being ratcheted down. Budgeted at today's count + ~3%, same
    # convention as the others: this is a ceiling to ratchet down as recipes move
    # into `llz ci` verbs, never a raise.
    # Baseline at introduction: 100. Ratcheted 103 -> 99 in the same change, once
    # placeholder-lint became `llz ci placeholder-guard` and the three sbom-* steps
    # collapsed onto one SBOM_STEP macro: remaining is 96, keeping ~3% headroom.
    #
    # Ratcheted 99 -> 28 when the counter stopped charging for documentation
    # output. ~70 of the 96 were `@echo` lines in the `help:` wall — printing, not
    # logic — so the old ceiling was mostly measuring how well the Makefile was
    # documented. What remains (27) is the real thing this category is for, and
    # all of it: install-tools, helm-repos, gitleaks, the SBOM_STEP macro,
    # sbom-scan, coverage, clean, helm-lint-real-values.
    #
    # NOTE the headroom is now ~1 line, because ~3% of 27 is 1. That is the
    # convention working as intended at this size, not an oversight: the next
    # multi-line recipe should become an `llz ci` verb rather than take the slack.
    budget: 28
    include:
      - "Makefile"

  shell-scripts:
    kind: script
    # Ratcheted 595 → 545 when .github/scripts/dispatch-and-watch.sh (72 counted
    # lines) moved to `exclude:` (live GitHub-Actions orchestration — see below):
    # the remaining shell is 529, so keep ~3% headroom rather than leaving the
    # freed budget as slack a future PR could fill with untested bash.
    #
    # Ratcheted 545 → 471 when template-scripts/check-template-manifest.sh moved
    # into `llz ci template-manifest`, then 471 → 420 when
    # template-scripts/stamp-template-version.sh moved into
    # `llz ci stamp-template-version`: remaining shell is 408, so keep ~3%
    # headroom and do not let the retired checkers creep back as shell.
    #
    # Ratcheted 420 → 375 when template-scripts/linting-and-validation/
    # cleanup-workflow-runs.sh (54 counted lines) was deleted: a one-shot utility
    # that purged Actions run history for seven workflows (ci/fuzz/scorecard/
    # trivy/build-firewall-controller/sync-firewall-cidrs/firewall.yml) which no
    # longer exist, with no caller in any workflow, Makefile, or script. Remaining
    # shell is 364, so keep ~3% headroom rather than leaving the freed budget as
    # slack a future PR could fill with untested bash.
    budget: 375
    include:
      - "template-scripts/**/*.sh"
      - ".github/scripts/**/*.sh"
      - "terraform-modules/**/*.sh"
      - "instance-template/**/*.sh"

  python-scripts:
    kind: script
    # Ratcheted 60 → 0: there are no Python scripts left. The last one was a
    # table-of-contents generator, and it was over budget on its first commit
    # (74/60) — correctly, because it re-implemented githubAnchor in a second
    # language. The two copies then disagreed with GitHub the SAME way, so
    # docs-guard compared a wrong anchor against a wrong anchor and passed. Its
    # logic now lives in `llz ci gen-toc`, sharing docHeadings with the checker.
    #
    # Two things were still wrong at 0, and the matched-nothing check surfaced
    # both:
    #
    #   allowEmpty: true   A category matching no files used to report `0 / 0 ok`
    #                      and exit 0, indistinguishable from a glob that had gone
    #                      stale. This says out loud that matching nothing is the
    #                      INTENDED end state here (see matchedNothing).
    #   include broadened  It only ever watched template-scripts/**, so Python
    #                      added anywhere else in the repo was never policed.
    #
    # Net: a dead category became a live tripwire that says "no new Python,
    # anywhere" — which is what the design principle actually claims.
    budget: 0
    allowEmpty: true
    include:
      - "**/*.py"

  terraform-provisioner-bash:
    # Ratcheted 101 → 28 → 0: the last destroy-time provisioner heredocs
    # (cleanup_platform_volumes / unwedge_namespace_finalizers /
    # clear_openbao_secrets) were retired — their logic lives in unit-tested llz
    # subcommands (`llz ci reap-volumes`, `destroy-unwedge`, `clear-cluster-secrets`)
    # run as CI destroy steps, and the resources are dropped via `removed` blocks.
    # No Terraform provisioner now carries a bash heredoc; keep the budget at 0 so
    # one can't creep back in.
    kind: terraform-provisioner
    budget: 0
    include:
      - "terraform-modules/**/*.tf"
      - "instance-template/**/*.tf"

  embedded-shell-in-yaml:
    kind: embedded-shell
    budget: 23
    include:
      - "instance-template/**/*.yaml"
      - "instance-template/**/*.yml"
      - "kubernetes-charts/**/*.yaml"
      - "kubernetes-charts/**/*.yml"
      - "terraform-modules/**/*.yaml"
      - "terraform-modules/**/*.yml"

# Files exempted from every category. Keep this list short and justified — each
# entry is logic the gate is choosing NOT to push into Go.
exclude:
  - "template-scripts/install-llz.sh"        # pinned-release installer for the llz CLI. Two decisions it cannot delegate to Go: which release to fetch (there is no llz on the machine yet), and which llz the CALLER'S shell resolves after install (a binary asked "am I the one that wins?" is answering about a PATH it was just handed, not the interactive shell's). Release-tag selection deliberately mirrors latestLLZTag in tools/cmd/llz/selfupdate.go, which IS unit-tested.
  - "template-scripts/ci/install-trivy.sh"   # pinned-release installer, no logic
  - "template-scripts/ci/install-syft.sh"    # pinned-release installer, no logic
  - "template-scripts/ci/install-gitleaks.sh" # pinned-release installer, no logic
  - "template-scripts/ci/llz-functional.sh"  # functional test harness for the built llz binary — its assertions ARE the test (exercised every CI run), not decision logic to push into Go
  - "template-scripts/ci/vap-admission-check.sh" # functional harness for the llz-wave-health-guard VAP — applies the policy to the kind apiserver and asserts admission decisions (deny/allow); the assertions ARE the test, and apiserver CEL enforcement cannot be unit-tested in Go
  - ".github/scripts/dispatch-and-watch.sh" # live GitHub-Actions orchestration: dispatch a workflow_dispatch in the instance repo and block on its conclusion. Entirely `gh` CLI driving + compensation for GitHub-API flakiness (fresh-dispatch 404s, early watch-detach, premature watch-success) — the behavior IS the live interaction, exercised every release-e2e, and cannot be unit-tested in Go. Same class as vap-admission-check.sh.
