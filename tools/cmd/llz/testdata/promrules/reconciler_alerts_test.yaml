# promtool unit tests for the reconciler alert rules.
#
# `promtool check rules` proves an expression PARSES. It says nothing about
# whether the alert fires when the condition it is named for is true — which is
# the failure this suite exists to pin down: the reconciler's registry never
# expires a gauge, so a dead lane keeps serving its last good sample and every
# threshold alert fed by it goes quiet exactly when its input breaks.
#
# rules.yml is written by the Go test (ci_check_prom_rules_test.go) from the
# PrometheusRule CRD's spec.groups, so these run against the rules the cluster
# actually loads, not a copy.
rule_files:
  - rules.yml

evaluation_interval: 30s

tests:
  # A lane freezes. Its gauges keep reading healthy forever; only its freshness
  # series can contradict them.
  - interval: 30s
    name: a wedged lane is stale even while its gauges read healthy
    input_series:
      # observe: healthy — its success timestamp advances with wall clock.
      - series: 'llz_reconcile_interval_seconds{namespace="llz-reconciler",reconciler="observe"}'
        values: "30x80"
      - series: 'llz_reconcile_last_success_timestamp_seconds{namespace="llz-reconciler",reconciler="observe"}'
        values: "0+30x80"
      # openbao-gauges: wedged at t=0. 60s cadence, so 10 intervals = 600s.
      - series: 'llz_reconcile_interval_seconds{namespace="llz-reconciler",reconciler="openbao-gauges"}'
        values: "60x80"
      - series: 'llz_reconcile_last_success_timestamp_seconds{namespace="llz-reconciler",reconciler="openbao-gauges"}'
        values: "0x80"
      # The gauge that lane feeds, stuck at its last-known-good "not sealed".
      - series: 'llz_openbao_sealed{namespace="llz-reconciler"}'
        values: "0x80"
    alert_rule_test:
      # Not yet: 10 intervals (600s) + for:10m means it cannot fire before 20m.
      - eval_time: 15m
        alertname: LLZReconcilerStale
        exp_alerts: []
      - eval_time: 25m
        alertname: LLZReconcilerStale
        exp_alerts:
          - exp_labels:
              severity: warning
              service: llz-reconciler
              reconciler: openbao-gauges
            exp_annotations:
              summary: llz reconciler openbao-gauges loop is stale
              runbook_url: "https://github.com/akamai-consulting/lke-landing-zone/blob/main/docs/runbooks/reconciler-alerts.md"
              # $value is the staleness in seconds — 25m minus the frozen t=0
              # sample. It names the lane, which the old observe-scoped rule
              # could not.
              description: The openbao-gauges reconciler has not completed a successful pass in 10 of its own intervals (1500s ago). Its loop may be wedged — and every gauge it publishes is still being served at its last-known-good value, so the alerts fed by those gauges are silently unfalsifiable until this clears.
      # The whole point: OpenBao could be sealed and this would still read 0.
      # LLZOpenBaoSealed is silent, and LLZReconcilerStale above is the only
      # thing telling the operator the 0 is fiction.
      - eval_time: 25m
        alertname: LLZOpenBaoSealed
        exp_alerts: []

  # The healthy case must stay quiet — a staleness rule that fires on a live
  # lane is worse than none.
  - interval: 30s
    name: a live lane is never stale
    input_series:
      - series: 'llz_reconcile_interval_seconds{namespace="llz-reconciler",reconciler="observe"}'
        values: "30x80"
      - series: 'llz_reconcile_last_success_timestamp_seconds{namespace="llz-reconciler",reconciler="observe"}'
        values: "0+30x80"
      - series: 'llz_reconcile_interval_seconds{namespace="llz-reconciler",reconciler="token-inventory"}'
        values: "86400x80"
      - series: 'llz_reconcile_last_success_timestamp_seconds{namespace="llz-reconciler",reconciler="token-inventory"}'
        values: "0x80"
    alert_rule_test:
      # token-inventory is a daily lane: 10 intervals is 10 days, so a 40m-old
      # sample is not stale for it. The per-lane cadence is doing the work — a
      # single hard-coded threshold would have paged for this.
      - eval_time: 40m
        alertname: LLZReconcilerStale
        exp_alerts: []

  # Convergence: state 0 from an empty corpus is not evidence of convergence.
  - interval: 30s
    name: convergence reported from zero Applications is loud
    input_series:
      - series: 'llz_convergence_state{namespace="llz-reconciler"}'
        values: "0x80"
      - series: 'llz_convergence_apps_observed{namespace="llz-reconciler"}'
        values: "0x80"
      - series: 'llz_convergence_apps_failed{namespace="llz-reconciler"}'
        values: "0x80"
    alert_rule_test:
      - eval_time: 20m
        alertname: LLZConvergenceUnobserved
        exp_alerts:
          - exp_labels:
              severity: warning
              service: llz-reconciler
            exp_annotations:
              summary: convergence is being reported from zero Argo Applications
              runbook_url: "https://github.com/akamai-consulting/lke-landing-zone/blob/main/docs/runbooks/reconciler-alerts.md"
              description: The reconciler classified no Argo Applications at all, so llz_convergence_state carries no evidence either way. Either bootstrap has not created the Applications yet, or the list read is returning nothing (RBAC, a renamed namespace, an unparseable response).
      # state 0 is "converged", so the not-converged alert stays silent — which
      # is precisely why the corpus needs its own alert.
      - eval_time: 20m
        alertname: LLZClusterNotConverged
        exp_alerts: []
      - eval_time: 20m
        alertname: LLZConvergenceSignalAbsent
        exp_alerts: []

  # A real cluster with a real corpus must not trip the corpus alert.
  - interval: 30s
    name: convergence backed by a corpus is quiet
    input_series:
      - series: 'llz_convergence_state{namespace="llz-reconciler"}'
        values: "0x80"
      - series: 'llz_convergence_apps_observed{namespace="llz-reconciler"}'
        values: "24x80"
    alert_rule_test:
      - eval_time: 20m
        alertname: LLZConvergenceUnobserved
        exp_alerts: []
      - eval_time: 20m
        alertname: LLZConvergenceSignalAbsent
        exp_alerts: []

  # The observe lane never publishes the gauge at all: every convergence
  # threshold is a rule over a series that does not exist, so only absent() can
  # speak.
  - interval: 30s
    name: a missing convergence series is not a converged cluster
    input_series:
      - series: 'llz_reconcile_up{namespace="llz-reconciler",reconciler="observe"}'
        values: "1x80"
    alert_rule_test:
      - eval_time: 20m
        alertname: LLZConvergenceSignalAbsent
        exp_alerts:
          # absent() synthesizes the labels named in its argument, so the
          # namespace matcher rides through onto the alert.
          - exp_labels:
              severity: warning
              service: llz-reconciler
              namespace: llz-reconciler
            exp_annotations:
              summary: llz convergence gauge is not being published
              runbook_url: "https://github.com/akamai-consulting/lke-landing-zone/blob/main/docs/runbooks/reconciler-alerts.md"
              description: No llz_convergence_state series exists. The observe reconciler is not publishing it, so LLZClusterNotConverged and LLZConvergenceUnobserved cannot fire — the cluster's convergence is unmonitored, not healthy.
      - eval_time: 20m
        alertname: LLZClusterNotConverged
        exp_alerts: []
      - eval_time: 20m
        alertname: LLZConvergenceUnobserved
        exp_alerts: []

  # The rotation-class split. Every credential in the gauge set publishes a real
  # age, but only the classes something can actually bring back down are
  # alertable. This pins the consequence twice over: widening credPaths must NOT
  # turn LLZCredentialRotationOverdue into a rule that fires forever on paths
  # nothing rotates — AND the operator-triggered class must not be silently
  # exempted from the rule that asks a human to act.
  #
  # 2m interval, 26h of samples. The spacing has to stay inside Prometheus'
  # 5m lookback or the series goes stale BETWEEN samples, which resolves the
  # alert and restarts its `for` clock — an hourly series can never satisfy
  # for:1h, let alone the for:24h rule.
  - interval: 2m
    name: rotation-overdue fires only for credentials something can act on
    input_series:
      # Automated + overdue: a rotator exists and is late. This is the real page.
      - series: 'llz_credential_age_days{namespace="llz-reconciler",cred="loki-object-store",class="automated"}'
        values: "95x780"
      # Automated + inside SLA: silent.
      - series: 'llz_credential_age_days{namespace="llz-reconciler",cred="obj-platform",class="automated"}'
        values: "10x780"
      # ON-DEMAND + overdue: rotation exists but is operator-triggered. Must fire
      # — classing this `static` would exempt the highest-value credential in the
      # deployment from the only actionable alert.
      - series: 'llz_credential_age_days{namespace="llz-reconciler",cred="db-admin-shared",class="on-demand"}'
        values: "120x780"
      # ON-DEMAND but NOT db-admin: the opt-in cloud-firewall token, re-seeded by
      # hand. Same class, DIFFERENT remedy — pins that the description branches on
      # the credential and doesn't hand this operator the db-admin dispatch.
      - series: 'llz_credential_age_days{namespace="llz-reconciler",cred="linode-cloud-firewall",class="on-demand"}'
        values: "150x780"
      # Generate-once, well past 90d but under a year: the old unscoped rule
      # would have paged here every day forever.
      - series: 'llz_credential_age_days{namespace="llz-reconciler",cred="grafana-admin",class="generate-once"}'
        values: "200x780"
      # Static bootstrap seed, past 90d: NOT on the SLA rule — re-seeding by hand
      # is the only remedy, so a warning would never clear.
      - series: 'llz_credential_age_days{namespace="llz-reconciler",cred="harbor-robot",class="static"}'
        values: "200x780"
      # Tracks-source, past a year: only the info-level never-rotated rule.
      - series: 'llz_credential_age_days{namespace="llz-reconciler",cred="harbor-admin",class="tracks-source"}'
        values: "400x780"
    alert_rule_test:
      # Exactly the two actionable ones. grafana-admin (200d generate-once),
      # harbor-robot (200d static) and harbor-admin (400d tracks-source) are
      # deliberately absent — nothing would clear them.
      - eval_time: 2h
        alertname: LLZCredentialRotationOverdue
        exp_alerts:
          # on-demand: the description must send the operator to the DISPATCH,
          # and must carry the no-overlap-window warning — running it blind
          # breaks every consumer until ESO re-syncs.
          - exp_labels:
              severity: warning
              service: llz-reconciler
              cred: db-admin-shared
              class: on-demand
            exp_annotations:
              summary: credential db-admin-shared rotation is overdue
              runbook_url: "https://github.com/akamai-consulting/lke-landing-zone/blob/main/docs/runbooks/linode-credential-rotation.md"
              description: 'db-admin-shared was last rotated 120 days ago (SLA 90d). Rotation is operator-triggered — no schedule will clear this. Dispatch secret-rotation.yml with scope=db-admin; it resets the password IN PLACE with no overlap window, so consumers break until ESO re-syncs — read the runbook first.'
          # Same class, different credential: the SAME rule must produce the
          # re-seed remedy here, not the db-admin dispatch.
          - exp_labels:
              severity: warning
              service: llz-reconciler
              cred: linode-cloud-firewall
              class: on-demand
            exp_annotations:
              summary: credential linode-cloud-firewall rotation is overdue
              runbook_url: "https://github.com/akamai-consulting/lke-landing-zone/blob/main/docs/runbooks/linode-credential-rotation.md"
              description: 'linode-cloud-firewall was last rotated 150 days ago (SLA 90d). Rotation is operator-triggered — no schedule will clear this. Re-seed it with `llz openbao set` (see the runbook for this credential''s scope).'
          # automated: the remedy is the opposite — the rotator is late, not un-run.
          - exp_labels:
              severity: warning
              service: llz-reconciler
              cred: loki-object-store
              class: automated
            exp_annotations:
              summary: credential loki-object-store rotation is overdue
              runbook_url: "https://github.com/akamai-consulting/lke-landing-zone/blob/main/docs/runbooks/linode-credential-rotation.md"
              description: 'loki-object-store was last rotated 95 days ago (SLA 90d). A rotator owns this path, so it is LATE rather than un-run: check the llz-reconciler linode-creds lane and the secret-rotation.yml schedule.'
      # 24h+ in, the year-old unrotatable credential surfaces as info — and the
      # 200d ones still do not, because they are under 365d. The on-demand series
      # must NOT appear here: it is already covered by the actionable rule above,
      # and double-alerting one credential trains people to ignore both.
      - eval_time: 25h
        alertname: LLZCredentialNeverRotated
        exp_alerts:
          - exp_labels:
              severity: info
              service: llz-reconciler
              cred: harbor-admin
              class: tracks-source
            exp_annotations:
              summary: credential harbor-admin has never been rotated
              runbook_url: "https://github.com/akamai-consulting/lke-landing-zone/blob/main/docs/runbooks/linode-credential-rotation.md"
              description: harbor-admin (class tracks-source) is 400 days old and has no rotation automation. Re-seed it by hand, or accept the age deliberately.

  # ── presence, read in BOTH directions ────────────────────────────────────────
  #
  # llz_credential_configured is the one series in this ruleset whose "good"
  # value is not uniform. Eight of the nine measured GitHub-held credentials want
  # 1; OPENBAO_ROOT_TOKEN wants 0, because bootstrap revokes it and the recovery
  # quorum is what survives. A ruleset that could only say "configured is good"
  # would have had to leave the root token unwatched, so `expect` is a label and
  # two rules read it in opposite directions.
  #
  # This group exists mostly to pin that the two rules cannot be collapsed: swap
  # either expr's matcher for the other and the paired expectation below fails.
  #
  # 2m interval, same reason as the group above — an hourly series goes stale
  # inside Prometheus' 5m lookback and can never satisfy `for: 1h`.
  - interval: 2m
    name: unconfigured credentials and parked root tokens are both visible
    input_series:
      # Present and expected present: silent. This is the steady state.
      - series: 'llz_credential_configured{namespace="llz-reconciler",cred="tf-state-access-key",class="on-demand",expect="present"}'
        values: "1x90"
      # ABSENT and expected present. Before llz_credential_configured existed this
      # credential published NOTHING — no age series, so neither age rule could
      # evaluate for it, so a never-seeded recovery key looked exactly like a
      # healthy one. That silence is the whole reason this rule was added.
      - series: 'llz_credential_configured{namespace="llz-reconciler",cred="openbao-recovery-key-2",class="static",expect="present"}'
        values: "0x90"
      # Absent and expected absent: the healthy root-token state. Must be silent
      # under BOTH rules — the unconfigured rule must not claim it is missing.
      - series: 'llz_credential_configured{namespace="llz-reconciler",cred="openbao-root-token",class="on-demand",expect="absent"}'
        values: "0x90"
    alert_rule_test:
      - eval_time: 2h
        alertname: LLZCredentialUnconfigured
        exp_alerts:
          - exp_labels:
              severity: warning
              service: llz-reconciler
              cred: openbao-recovery-key-2
              class: static
            exp_annotations:
              summary: credential openbao-recovery-key-2 is not configured
              runbook_url: "https://github.com/akamai-consulting/lke-landing-zone/blob/main/docs/secrets.md"
              description: openbao-recovery-key-2 is expected as a GitHub Actions secret on this deployment and the secrets API reports it absent. It has no age because it has no value — nothing else in this ruleset can fire for it. Seed it (docs/secrets.md), or drop it from ghSecretTargets if this instance genuinely does not use it.
      # The expect=absent series is 0 here, which is the value the OTHER rule
      # alerts on when it is 1. Pinning "no alert" proves the two matchers are
      # actually distinct rather than accidentally both matching everything.
      - eval_time: 2h
        alertname: LLZRootTokenParked
        exp_alerts: []

  # The same root token, left behind by a break-glass whose revoke never ran.
  - interval: 2m
    name: a root token left set after break-glass is a finding
    input_series:
      - series: 'llz_credential_configured{namespace="llz-reconciler",cred="openbao-root-token",class="on-demand",expect="absent"}'
        values: "1x90"
      # A present credential that WANTS to be present, carried alongside to pin
      # that LLZRootTokenParked keys on `expect` and not merely on the value 1.
      - series: 'llz_credential_configured{namespace="llz-reconciler",cred="openbao-seal-key",class="static",expect="present"}'
        values: "1x90"
    alert_rule_test:
      - eval_time: 2h
        alertname: LLZRootTokenParked
        exp_alerts:
          - exp_labels:
              severity: warning
              service: llz-reconciler
              cred: openbao-root-token
            exp_annotations:
              summary: an OpenBao root token is parked in openbao-root-token
              runbook_url: "https://github.com/akamai-consulting/lke-landing-zone/blob/main/docs/runbooks/bootstrap-openbao.md"
              description: openbao-root-token is set. A root token is ephemeral by design — bootstrap revokes it and the recovery quorum is what survives — so this is a full-admin credential left behind by a break-glass that never ran its revoke. Dispatch llz-breakglass-openbao.yml with action=revoke; it revokes the token AND deletes the secret.
      - eval_time: 2h
        alertname: LLZCredentialUnconfigured
        exp_alerts: []

  # ── the funnel, watched at its source ───────────────────────────────────────
  #
  # Every write-time credential age depends on one probe running. When it does
  # not, the symptom is SILENCE — no entries, no series, no rule to evaluate —
  # which is why this is expressed as a positive signal from the writer rather
  # than as `absent(llz_credential_age_days)`. Absence cannot tell a broken probe
  # apart from a deployment that holds none of these credentials.
  - interval: 2m
    name: a write-time probe that cannot authenticate is an alert, not a log line
    input_series:
      - series: 'llz_credential_secret_probe_ok{namespace="llz-reconciler"}'
        values: "0x300"
    alert_rule_test:
      - eval_time: 7h
        alertname: LLZCredentialSecretProbeUnavailable
        exp_alerts:
          - exp_labels:
              severity: warning
              service: llz-reconciler
            exp_annotations:
              summary: the credential write-time probe cannot run
              runbook_url: "https://github.com/akamai-consulting/lke-landing-zone/blob/main/docs/adr/0009-unmeasurable-credential-coverage.md"
              description: 'llz ci token-inventory could not build its GitHub secrets-metadata client, so no write-time credential age was measured this run. Every credential with no expiry — the state-backend key pair, the state-encryption passphrase, the OpenBao seal key and recovery quorum, the Harbor robot copies — is unmeasured while this fires. Check that the credential-single-pane job exports GH_REPO and a token with Secrets access.'
      # Under the 6h `for`, so a single bad run does not page: the job is daily
      # and a transient GitHub 5xx is not a broken funnel.
      - eval_time: 5h
        alertname: LLZCredentialSecretProbeUnavailable
        exp_alerts: []

  # An `optional` credential matches NEITHER presence rule. The Harbor robot pair
  # is published by the ACTIVE peer's provisioner, so a standby peer legitimately
  # has neither until it has run — and the first draft of this work classed both
  # `present`, which would have paged every healthy standby and failed its daily
  # credential job. The value of pinning it here is that `expect` is a free-text
  # label: a rule widened to `expect!="absent"` would silently re-acquire them.
  - interval: 2m
    name: an optional credential is visible but never alerts
    input_series:
      - series: 'llz_credential_configured{namespace="llz-reconciler",cred="harbor-password",class="static",expect="optional"}'
        values: "0x90"
      - series: 'llz_credential_configured{namespace="llz-reconciler",cred="harbor-pull-password",class="static",expect="optional"}'
        values: "1x90"
    alert_rule_test:
      - eval_time: 2h
        alertname: LLZCredentialUnconfigured
        exp_alerts: []
      - eval_time: 2h
        alertname: LLZRootTokenParked
        exp_alerts: []
