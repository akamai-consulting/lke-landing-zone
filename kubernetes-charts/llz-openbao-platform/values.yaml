# Default values for openbao-platform.
#
# This chart wraps the upstream OpenBao Helm chart (a subchart dependency) and
# layers on the cluster integration the bare chart omits: a cert-manager serving
# cert, NetworkPolicies, a ServiceMonitor, and a Promtail audit-shipper config.
# The defaults below capture the operational
# scars this platform hit on Linode LKE-Enterprise + apl-core, so a sibling
# deployment overrides only what genuinely differs (region, repo, CIDRs, names).
#
# Two kinds of values live here:
#   • `openbao:`  — passed straight through to the upstream openbao subchart.
#   • everything else (`platform`, `openbaoPromtail`) —
#     consumed by THIS chart's own templates/ (cert, NP, ServiceMonitor, etc.).

# ── Platform identity (the decoupled org/cluster knobs) ──────────────────────
# These are the values a sibling system team changes. Defaults are this repo's
# current Linode LKE-E values. Names that other cluster components reference by
# string (the openbao-tls Secret, the platform-openbao release/StatefulSet identity,
# the platform-openbao-internal headless Service) are LOAD-BEARING — kept here as
# defaults so they remain overridable, but changing them is a coordinated rename.
platform:
  # The Helm release name OpenBao's StatefulSet + Services derive from. This is
  # a load-bearing identity: the cert SANs, raft retry_join FQDNs, ServiceMonitor
  # selector, and the consuming Argo Application's releaseName/ignoreDifferences
  # all assume it. The upstream subchart derives the StatefulSet name from the
  # release name (here `platform-openbao`), NOT from this value — this is the
  # documented mirror used by THIS chart's cert/NP templates. Keep them in sync.
  releaseName: platform-openbao
  # Headless Service the raft peers resolve each other through. Derived by the
  # subchart as `<releaseName>-internal`; mirrored here for the cert SANs.
  internalServiceName: platform-openbao-internal

  tls:
    # Name of the cert-manager Certificate AND the Secret it writes. LOAD-BEARING:
    # OpenBao mounts `openbao-tls` at /openbao/tls (see openbao.server.volumes),
    # openbao-cert-watcher watches this Certificate, and the rotation
    # CronWorkflow mounts this Secret's ca.crt. Do not rename without a sweep.
    secretName: openbao-tls
    # cert-manager issuer that signs the OpenBao serving cert. `openbao-ca` is a
    # STABLE self-signed ClusterIssuer (cert-manager/raw/openbao-bootstrap-ca.yaml)
    # with no OpenBao dependency, so the cert issues BEFORE OpenBao starts and the
    # serving CA never rotates mid-bootstrap. A sibling cluster points this at its
    # own bootstrap CA issuer.
    issuerRef:
      name: openbao-ca
      kind: ClusterIssuer
    duration: 8760h
    renewBefore: 720h

  # ── Client-side mTLS ───────────────────────────────────────────────────────
  # The listener requires and verifies client certificates (see the listener
  # stanza in openbao.server.ha.raft.config). Three Certificates come off this
  # block, all issued by the CLIENT root — a different trust anchor from
  # platform.tls.issuerRef above, so a client cert can never serve as a server
  # cert (rationale in components/certManagerBootstrapCA/llz-client-ca.yaml).
  clientTls:
    # Issuer for every client identity in this chart. Provided by the
    # certManagerBootstrapCA component; a sibling cluster points this at its own.
    issuerRef:
      name: llz-client-ca
      kind: ClusterIssuer
    # Secret whose ca.crt becomes tls_client_ca_file. The leaf is unused — the
    # Certificate exists only to land the client CA in this namespace.
    caSecretName: openbao-client-ca
    # Client identity the raft followers present on retry_join.
    raftSecretName: openbao-raft-client-tls
    # Client identity the Prometheus scrape presents. The Secret must live in the
    # ServiceMonitor's namespace (this one) — prometheus-operator resolves
    # endpoint tlsConfig secret refs relative to the ServiceMonitor, not to
    # Prometheus, and mounts them into the Prometheus pod as scrape assets.
    scrapeSecretName: openbao-scrape-client-tls
    duration: 2160h    # 90 days
    renewBefore: 720h  # 30 days

  # ── apl-core CA, for the Keycloak JWKS fetch ───────────────────────────────
  # OpenBao's `keycloak` auth mount fetches the realm JWKS over HTTPS and pins
  # the CA (jwks_ca_pem, see ci_openbao_configure.go). Keycloak's serving cert is
  # issued by apl-core, not by us, so we need apl-core's root in this namespace —
  # landed by the same ca.crt indirection used everywhere else in this chart.
  #
  # ⚠️  UNVERIFIED PREREQUISITE. Two facts must hold on the target cluster and
  # BOTH assumptions have now been checked on a live cluster. One held, one did not:
  #   1. HOLDS — apl-core exposes a ClusterIssuer named `custom-ca`
  #      (`llz ci health` reports "ClusterIssuer custom-ca Ready").
  #   2. FALSE — Keycloak's internal Service does NOT serve TLS on 8443. apl-core
  #      runs Keycloak with `args: [start]`, KC_HTTP_ENABLED=true and proxy-mode
  #      xforwarded, and gives it no TLS key material, so it never opens an HTTPS
  #      listener. The port is declared on the Service and container and is dead;
  #      because Keycloak IS meshed, its Envoy sidecar accepts the connection and
  #      then resets it (`read: connection reset by peer`, not `refused`).
  #
  # This CA is still exactly right, because the TLS that DOES exist for Keycloak
  # is terminated by the Istio ingress gateway, serving apl-core's `otomi-wildcard`
  # Certificate — SAN *.<domainSuffix>, issued by this same `custom-ca`
  # (values/cert-manager/cert-manager-raw.gotmpl). That wildcard covers
  # keycloak.<domain>, so this leaf's ca.crt verifies it. Only the ENDPOINT was
  # wrong; see keycloakJWKSURL and `llz ci pin-keycloak-gateway-alias`.
  #
  # ADOPTERS: apl-core issues the same wildcard from Let's Encrypt when
  # cert-manager.issuer is `letsencrypt`. This leaf will NOT verify that chain —
  # set enabled:false and drop jwks_ca_pem so OpenBao uses system roots (a public
  # CA is verifiable without pinning).
  aplCA:
    enabled: true
    secretName: openbao-apl-ca
    issuerRef:
      name: custom-ca
      kind: ClusterIssuer

  # NetworkPolicy: namespaces allowed to reach OpenBao on :8200, and the
  # observability namespace OpenBao ships audit logs to on :80. These are
  # apl-core namespace names; a sibling deployment with different namespace
  # names overrides the list. The intra-raft (:8200/:8201) and DNS/K8s-API
  # (53/443/6443) rules are structural and stay in the template.
  networkPolicy:
    enabled: true
    # Namespaces permitted to connect to OpenBao's API port (8200). Whole-namespace
    # grants — use only for dedicated llz infra namespaces.
    allowedClientNamespaces:
      # apl-core 6.x runs the (now core) ESO controller in `external-secrets`;
      # its pods reach OpenBao :8200 to resolve every ExternalSecret.
      - external-secrets
      - llz-cert-automation
      - llz-observability
    # Pod-scoped clients: a single workload in a SHARED namespace that needs :8200,
    # where a whole-namespace grant would over-expose OpenBao. The in-cluster
    # harbor robot provisioner CronJob logs into OpenBao via Kubernetes-auth;
    # without this its kubernetes-auth login is L4-blocked (TCP timeout → the
    # harbor-docker-config ExternalSecret can never sync, pinning the convergence
    # gate). OpenBao's k8s-auth roles still gate what each SA can actually
    # read/write; this is just the L4 door. Match on the pod's
    # app.kubernetes.io/name. (The linode-cred-rotator CronJob was retired — its
    # work moved to the in-cluster reconciler, which has its own entry below.)
    allowedClientPods:
      - namespace: harbor
        name: harbor-robot-provisioner
      # The in-cluster reconciler logs into OpenBao (Kubernetes-auth `reconciler`
      # role) for --reconcile-openbao-gauges (seal-status + credential-rotation
      # metadata) and --reconcile-linode-creds (rotates the object-storage keys and
      # writes them back). Harmless when those flags are off (the pod simply never
      # opens the :8200 connection).
      - namespace: llz-reconciler
        name: llz-reconciler
      # apl-core's Prometheus (pod app.kubernetes.io/name=prometheus, in the shared
      # `monitoring` namespace) scrapes OpenBao's /v1/sys/metrics on :8200 via the
      # platform-openbao ServiceMonitor. Without this the default-deny NetworkPolicy
      # L4-blocks the scrape (TCP reset / timeout), so every vault_* series is absent
      # and the openbao-alerts (OpenBaoSealed/NoActiveLeader/RaftQuorumDegraded) are
      # silently never-fire (DEAD?). Pod-scoped, not a whole-namespace grant, since
      # `monitoring` is apl-core's shared namespace.
      - namespace: monitoring
        name: prometheus
      # The broad-PAT rotator CronJob (dedicated llz-pat-rotator namespace) logs into
      # OpenBao via Kubernetes-auth (`broad-pat-rotator` role) to read + rotate the
      # account-wide broad Linode PAT at secret/linode/broad-pat. Pod-scoped for
      # symmetry with the other CronJob clients; without it the k8s-auth login at
      # :8200 is L4-blocked (TCP timeout → `kubernetes auth login … context deadline
      # exceeded`, the rotator Job then fails on its 300s deadline).
      - namespace: llz-pat-rotator
        name: broad-pat-rotator
    # Namespace OpenBao's audit Promtail ships to (Loki gateway), allowed on :80.
    # `monitoring`, not llz-observability: that is where apl-core runs Loki, and
    # this allow existed for a Service that was never there — see the lokiPushUrl
    # note. The egress was correct in shape and wrong in target, so it granted
    # nothing and hid the broken pipeline behind a policy that looked complete.
    observabilityNamespace: monitoring
    # Namespace of apl-core's Istio ingress gateway. OpenBao's `keycloak` OIDC
    # auth mount (team-scoped writes) fetches the realm JWKS to validate
    # team-login id_tokens, and reaches it through the GATEWAY on :443 — not
    # through Keycloak directly.
    #
    # Keycloak itself cannot serve this: apl-core runs it with no TLS key
    # material, so its :8443 is a declared-but-dead port, and :8080 is the
    # plaintext fetch ADR 0010 exists to eliminate (this request carries signing
    # keys, so anything that can answer it can mint tokens OpenBao will accept).
    # The gateway terminates TLS with apl-core's `otomi-wildcard` certificate
    # (SAN *.<domainSuffix>, issued by the custom-ca ClusterIssuer), and
    # openbao-apl-ca is a leaf of that SAME CA — so the cert OpenBao already
    # mounts verifies it.
    #
    # `llz ci pin-keycloak-gateway-alias` pins keycloak.<domain> to this Service's
    # ClusterIP in the pods' /etc/hosts, so the request stays in-cluster (the
    # public name resolves to the external LB IP, and hairpinning through it is
    # unsupported on LKE-E) while Host/SNI still match the certificate.
    #
    # Defaults to `istio-system`, so the egress renders on every instance. Set it
    # empty to drop the rule on an instance with no spec.teams — the OIDC mount,
    # the only user of this egress, exists only when teams are declared.
    gatewayNamespace: istio-system

  # Prometheus ServiceMonitor for OpenBao's /v1/sys/metrics endpoint. In the
  # source chart this rendered only when the release was named `platform-prom`
  # (a magic-release-name gate); decoupled here into an explicit flag plus the
  # label set the Prometheus Operator selects on. Set enabled:false if Prometheus
  # isn't installed.
  serviceMonitor:
    enabled: true
    # Labels the Prometheus Operator's serviceMonitorSelector matches. apl-core's
    # kube-prometheus-stack selects on `prometheus: system` (its serviceMonitorSelector
    # is {matchLabels: {prometheus: system}}, NOT a release label — the old
    # `release: platform-prom` matched nothing). A sibling cluster whose Prometheus
    # selects differently overrides this map.
    selectorLabels:
      prometheus: system

# ── OpenBao subchart values (passed through to openbao/openbao-helm 0.13.0) ──
#
# OpenBao is the OpenSSF/Linux Foundation fork of HashiCorp Vault, Apache 2.0
# licensed. API-compatible with Vault at the OSS feature level.
#
# Mode: HA with integrated Raft storage, 3 replicas. Single-cluster durability
# and leader election without an external storage backend. Per-region cluster —
# the secondary region runs its own independent OpenBao cluster. Cross-region
# consistency is achieved by operator-side dual-write (see
# `llz openbao set` and `docs/secrets.md`), not by OpenBao
# replication. OpenBao OSS has no Performance Replication equivalent — that is a
# Vault Enterprise feature, intentionally not in OpenBao.
#
# After first sync the pods auto-unseal from the static seal key (see the
# `seal "static"` stanza in server.ha.raft.config); bootstrap then runs
# `bao operator init` + configuration. Fully automated: run
# .github/workflows/bootstrap-openbao.yml for each region.
#
# Chart repo: https://openbao.github.io/openbao-helm
openbao:
  enabled: true

  global:
    tlsDisable: false

  # OpenBao does not ship a secret-injection sidecar equivalent to Vault Injector
  # today. CI fetches secrets via the HTTP API directly. If workloads move onto
  # LKE and need runtime injection, swap in External Secrets Operator or the
  # OpenBao CSI provider here.
  injector:
    enabled: false

  server:
    image:
      repository: openbao/openbao
      tag: "2.5.0@sha256:d24890f589bc57658a43c18faab2afc4fbedaadad3806d5a638e1adaed2dff8d"

    # The openbao namespace is labeled with Pod Security Standards
    # `restricted:v1.31`. Without these securityContext settings the StatefulSet
    # controller can't create pods (violates PodSecurity restricted:v1.31:
    # unrestricted capabilities, seccompProfile ...).
    statefulSet:
      securityContext:
        pod:
          runAsNonRoot: true
          runAsGroup: 1000
          runAsUser: 100
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        container:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

    ha:
      enabled: true
      # Raft replica count. 3 is the minimum for a quorum that tolerates one node
      # loss. NOTE: the retry_join blocks in the `config` below are written out
      # per-pod for exactly 3 peers, and the openbao-tls cert SANs
      # (platform.tls.secretName) enumerate platform-openbao-0..2 — changing this
      # number means editing both the retry_join list here AND the cert dnsNames
      # in templates/openbao-tls-cert.yaml. Kept literal here because the upstream
      # subchart reads this exact path.
      replicas: 3
      raft:
        enabled: true
        setNodeId: true
        config: |
          ui = true

          # Static-key auto-unseal (no managed KMS on Linode LKE). Each pod
          # unseals itself at boot from a 32-byte AES-256 key, replacing the old
          # Shamir submit-keys flow + the openbao-auto-unseal re-unseal cron. The
          # key is mounted from the `openbao-unseal-key` Secret (server.volumes
          # below) at /openbao/seal/unseal.key and lives ONLY in that Secret
          # (etcd, encrypted at rest on LKE-E), never inline in this ConfigMap.
          # The Secret is created out-of-band by `llz ci bao-seed-seal-key`
          # before bootstrap; until it exists the pod waits in ContainerCreating
          # (a missing Secret volume does NOT crash-loop), so the seed step need
          # only complete, not strictly precede this Argo sync. `current_key_id`
          # is a PERMANENT identifier — OpenBao rejects a changed id for the same
          # key material — and the key is never rotated: losing it loses the data
          # (the recovery keys from `bao operator init` authorize generate-root
          # but CANNOT decrypt the root key), so the seed command backs it up to
          # the infra-<region> environment offline.
          seal "static" {
            current_key_id = "llz-openbao-static-1"
            current_key    = "file:///openbao/seal/unseal.key"
          }

          # NETWORK listener — mTLS REQUIRED. Every connection that crosses the
          # pod network must present a client certificate chaining to
          # `llz-client-ca` (mounted at /openbao/client-ca/ca.crt from the
          # `openbao-client-ca` Secret; see templates/openbao-client-ca-cert.yaml).
          #
          # This is the control that makes the pod→OpenBao hop mutually
          # authenticated rather than merely encrypted. Before it, the listener
          # accepted any TCP peer and every client ran with VAULT_SKIP_VERIFY=1,
          # so neither end authenticated the other: NetworkPolicy decided who
          # could connect and a bearer token decided what they could do, with
          # nothing binding the transport to either.
          #
          # `tls_require_and_verify_client_cert` is a HARD gate — a client with
          # no cert, an expired cert, or a cert from another CA is rejected at
          # the TLS handshake, before any token is read. Every consumer therefore
          # needs a leaf BEFORE this is enabled; see the staged rollout in
          # docs/adr/0010-in-cluster-mtls.md. Enabling this while a consumer is
          # still cert-less takes that consumer down, and ESO being cert-less
          # takes down every ExternalSecret in the cluster.
          #
          # unauthenticated_metrics_access stays TRUE: it exempts /v1/sys/metrics
          # from OpenBao's TOKEN check, not from TLS. The Prometheus scrape still
          # completes the client-cert handshake (see openbao-scrape-client-cert.yaml)
          # — it just does not need a Vault token on top. Removing it would force
          # a token into the ServiceMonitor for no security gain.
          listener "tcp" {
            tls_disable      = 0
            address          = "[::]:8200"
            cluster_address  = "[::]:8201"
            tls_cert_file    = "/openbao/tls/tls.crt"
            tls_key_file     = "/openbao/tls/tls.key"
            tls_min_version  = "tls12"

            tls_client_ca_file                  = "/openbao/client-ca/ca.crt"
            tls_require_and_verify_client_cert  = true

            telemetry {
              unauthenticated_metrics_access = true
            }
          }

          # LOOPBACK listener — 127.0.0.1 only, NO client-cert requirement.
          #
          # WHY THIS EXISTS: the operator/bootstrap paths shell into the pod and
          # drive the local server (`bao operator init`, unseal/seal status,
          # generate-root, the readiness probes in `llz ci health`). Those run as
          # `bao` inside the container and have no client certificate — they
          # cannot use the mTLS listener above, and minting a leaf into the
          # server's own pod just to talk to itself would hand a client identity
          # to anything that can exec into it.
          #
          # WHY IT IS SAFE: 127.0.0.1 is reachable ONLY from inside this pod's
          # network namespace — no NetworkPolicy applies to loopback because no
          # packet leaves the pod. The reachable set is the openbao container and
          # the promtail sidecar. Neither gains anything: every API call on this
          # listener still requires a Vault TOKEN exactly as before, so the
          # authorization story is unchanged; only the transport-level client
          # check is relaxed, on an interface with no network exposure.
          #
          # It still serves TLS, and the openbao-tls cert now carries 127.0.0.1
          # in ipAddresses (templates/openbao-tls-cert.yaml), so in-pod callers
          # VERIFY the server against /openbao/tls/ca.crt instead of running
          # VAULT_SKIP_VERIFY=true. That retires the last skip-verify in the
          # codebase — see `baoEnv` in tools/cmd/llz/openbao.go.
          #
          # NO cluster_address here: raft peer traffic belongs on the network
          # listener above (8201), and a second cluster_address is a config error.
          listener "tcp" {
            tls_disable      = 0
            address          = "127.0.0.1:8210"
            tls_cert_file    = "/openbao/tls/tls.crt"
            tls_key_file     = "/openbao/tls/tls.key"
            tls_min_version  = "tls12"

            telemetry {
              unauthenticated_metrics_access = true
            }
          }

          telemetry {
            prometheus_retention_time = "30s"
            disable_hostname = true
          }

          storage "raft" {
            path = "/openbao/data"

            # retry_join blocks let each follower discover the active leader
            # automatically on startup, removing the manual
            # `bao operator raft join` step from cluster bootstrap. Each pod
            # carries blocks for ALL three peer FQDNs (including its own —
            # OpenBao silently ignores self-joins); whichever is leader at
            # the moment of join wins, and the others retry until they hit
            # the leader.
            #
            # The FQDNs MUST appear as SANs on the openbao-tls cert that
            # the leader is currently serving (see templates/openbao-tls-cert.yaml,
            # which enumerates the same per-pod names). The CA file path mirrors
            # the standard volume mount of the openbao-tls Secret.
            #
            # leader_client_cert_file / leader_client_key_file: retry_join speaks
            # the leader's HTTP API on :8200, which is the mTLS listener — so a
            # JOINING PEER IS A CLIENT and must present a certificate like any
            # other. Without these three lines every follower fails to join with a
            # TLS handshake error and the raft cluster never forms, which on a
            # fresh install means OpenBao never becomes available at all. The
            # identity is `openbao-raft-client`, issued from llz-client-ca into
            # this namespace (templates/openbao-raft-client-cert.yaml).
            #
            # This applies ONLY to retry_join. Raft's own cluster-port (8201)
            # replication uses certificates OpenBao generates and rotates
            # internally; it does not consult the listener's client CA.
            retry_join {
              leader_api_addr         = "https://platform-openbao-0.platform-openbao-internal.llz-openbao.svc.cluster.local:8200"
              leader_ca_cert_file     = "/openbao/tls/ca.crt"
              leader_client_cert_file = "/openbao/raft-client/tls.crt"
              leader_client_key_file  = "/openbao/raft-client/tls.key"
            }
            retry_join {
              leader_api_addr         = "https://platform-openbao-1.platform-openbao-internal.llz-openbao.svc.cluster.local:8200"
              leader_ca_cert_file     = "/openbao/tls/ca.crt"
              leader_client_cert_file = "/openbao/raft-client/tls.crt"
              leader_client_key_file  = "/openbao/raft-client/tls.key"
            }
            retry_join {
              leader_api_addr         = "https://platform-openbao-2.platform-openbao-internal.llz-openbao.svc.cluster.local:8200"
              leader_ca_cert_file     = "/openbao/tls/ca.crt"
              leader_client_cert_file = "/openbao/raft-client/tls.crt"
              leader_client_key_file  = "/openbao/raft-client/tls.key"
            }
          }

          service_registration "kubernetes" {}

          # Declarative file audit device. OpenBao 2.5.0 rejects the historical
          # API-based path (`bao audit enable file ...`) with HTTP 400; declarative
          # config is the only supported path now.
          #
          # CRITICAL — OpenBao 2.5.0's HCL parser does NOT infer `type` from the
          # labeled block syntax (`audit "file"`) like Vault does. Without an
          # explicit `type = "file"` line the server fails to load config with
          # "audit type must be specified" and every pod crashes on start. Always
          # include `type =` here. `mode = "0640"` — group-readable so the
          # Promtail sidecar (uid=10000 gid=1000) can tail audit.log; default 0600
          # left Promtail with "permission denied" and the audit stream never
          # reached Loki.
          audit "file" {
            type = "file"
            path = "file"
            options = {
              file_path = "/openbao/audit/audit.log"
              mode      = "0640"
            }
          }

    dataStorage:
      enabled: true
      size: 10Gi
      storageClass: block-storage-retain
      accessMode: ReadWriteOnce

    # Audit log goes to an emptyDir (NOT a PVC) — the named `audit` volume below.
    # The Promtail sidecar tails /openbao/audit/audit.log and ships to Loki within
    # seconds; the local file is only a buffer. Removing the PVC saves 30GB across
    # the 3-pod raft. Caveat: OpenBao audit devices are blocking — if the emptyDir
    # fills, OpenBao stops serving. Monitor `kubelet_volume_stats`, alert at 75%.
    auditStorage:
      enabled: false

    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

    service:
      enabled: true
      type: ClusterIP
      port: 8200

    # BOTH PROBES MUST BE `exec`, NOT `httpGet`. This is a hard constraint, not a
    # preference, and it is the whole reason this block exists.
    #
    # ADR 0010 made the :8200 network listener require a client certificate. A
    # kubelet probe holds no identity, so it cannot use :8200 — its handshake is
    # rejected with `remote error: tls: certificate required`, liveness fails,
    # and kubelet SIGKILLs the container on a loop (observed live: 18 restarts).
    #
    # The obvious repair — repoint the probes at the cert-free loopback listener
    # via `port: 8210` — DOES NOT WORK, and fails in a way that looks like the
    # same bug. A Kubernetes httpGet probe has no `host` field in this subchart's
    # template (server-statefulset.yaml renders only path/port/scheme), and
    # httpGet defaults its host to the POD IP, never 127.0.0.1. The loopback
    # listener binds 127.0.0.1:8210 only, so kubelet would get `connection
    # refused` on the pod IP and restart the container exactly as before. The
    # live evidence for the default is the pre-fix liveness failure, which
    # resolved to the pod IP rather than loopback:
    #
    #   Liveness probe failed: Get "https://10.4.6.135:8200/v1/sys/health?..."
    #
    # Binding the health listener on the pod network instead would re-expose a
    # certificate-free API port to the cluster, which is precisely what ADR 0010
    # removed. So health checks must not traverse the network at all: an `exec`
    # probe runs INSIDE the pod's network namespace.
    #
    # An exec probe then reaches :8200 over loopback and CAN present a client
    # certificate, which is what makes the rest of this block work — see
    # extraEnvironmentVars below.
    readinessProbe:
      # Left as the subchart's DEFAULT exec (`bao status -tls-skip-verify`).
      # That exec takes its address from the container's BAO_ADDR, which the
      # subchart hardcodes to https://127.0.0.1:8200 and exposes no knob for —
      # so rather than fight it, extraEnvironmentVars below hands the exec a
      # CLIENT CERTIFICATE, which is the one thing :8200 was missing. Setting
      # `path` here would switch the template to httpGet and reintroduce the
      # unreachability bug above.
      #
      # The default exec also carries the seal semantics we want for free:
      # `bao status` exits 0 for any unsealed node INCLUDING a raft standby and
      # non-zero while sealed/uninitialized. (Note that with the subchart's
      # publishNotReadyAddresses=true on every Service, readiness does not
      # actually gate endpoint membership here — it is a status signal for Argo,
      # operators and `llz ci health`, not a traffic gate.)
      enabled: true

    livenessProbe:
      enabled: true
      # An exec, for the reason at the top of this block. The exit-code mapping
      # replaces the sealedcode/uninitcode query parameters the httpGet form
      # used: `bao status` exits 0 unsealed, 2 sealed-or-uninitialized, 1 on a
      # real error. A freshly deployed OpenBao comes up sealed and stays that way
      # until bootstrap-openbao.yml runs `bao operator init`, so liveness MUST
      # tolerate exit 2 through the bootstrap window — treating it as failure is
      # what used to SIGKILL the container before bootstrap could reach it.
      #
      # `-c`, not `-ec`: under `set -e` the sealed exit status would abort the
      # shell before the mapping below ever ran, turning "sealed" back into
      # "dead". `|| s=$?` captures the status without tripping the errexit trap.
      #
      # Address and client identity come from the container env below, the same
      # way the readiness exec gets them, so the two probes cannot drift.
      # -tls-skip-verify only skips verifying the SERVER, which is this same
      # process over loopback; the CLIENT certificate is still presented, and
      # that is what :8200 requires.
      execCommand:
        - /bin/sh
        - -c
        - 's=0; bao status -tls-skip-verify >/dev/null 2>&1 || s=$?; [ "$s" -eq 0 ] || [ "$s" -eq 2 ]'
      initialDelaySeconds: 60
      # The subchart default (period 5s, threshold 2) kills after 10s of failure.
      # That is far too eager for a restart-the-server action whose only true
      # positive is a wedged process: an exec probe also fails on a slow node or
      # a momentary CRI hiccup. 6 × 10s = a full minute of sustained failure.
      periodSeconds: 10
      failureThreshold: 6

    # LOAD-BEARING, and the half of the mTLS repair that is not about probes at all.
    #
    # The subchart hardcodes BAO_ADDR=https://127.0.0.1:8200 into the container
    # and exposes NO knob to change it. Every in-pod client inherits it — both
    # probes above, and any operator shell. ADR 0010 made that address require a
    # client certificate, so all of them broke at the TLS handshake.
    #
    # It cannot be fixed by overriding BAO_ADDR here. Doing so emits a SECOND
    # `BAO_ADDR` entry (extraEnvironmentVars renders after the subchart's own),
    # and `container.env` is a server-side-apply list-map keyed on `name`:
    # duplicate keys are REJECTED by the apiserver, not last-write-wins. This
    # Application syncs with ServerSideApply=true, so the StatefulSet is never
    # created at all — the whole app sits OutOfSync with no workload and no pod
    # to diagnose. That failure looks nothing like an env problem, which is
    # exactly why it gets a guard (TestOpenBaoExtraEnvNeverShadowsSubchartEnv).
    #
    # So instead of arguing with :8200 about WHERE to connect, give the client
    # the IDENTITY that address demands. These three names are NOT set by the
    # subchart, so they add cleanly.
    #
    # The certificate reused here is `openbao-raft-client` — already mounted,
    # already required for the pod to start (raft retry_join presents it to the
    # leader's :8200 for exactly the same reason), and already trusted by this
    # listener's tls_client_ca_file. Reusing it therefore adds NO new startup
    # dependency; minting a second identity would add a Secret the pod must wait
    # on before it can boot, to say the same thing.
    #
    # Note this does not help `llz`'s `kubectl exec … bao …` paths: those pass
    # their own env on the command line (baoLoopbackEnv), which is a process
    # environment and not a PodSpec list, so they may — and do — set BAO_ADDR to
    # the cert-free loopback listener without any duplicate-key problem.
    extraEnvironmentVars:
      # cert-manager writes tls.crt/tls.key into the openbao-raft-client-tls
      # Secret, mounted read-only at /openbao/raft-client (see server.volumes).
      BAO_CLIENT_CERT: "/openbao/raft-client/tls.crt"
      BAO_CLIENT_KEY: "/openbao/raft-client/tls.key"
      # Server verification for in-pod clients that do not pass -tls-skip-verify.
      # The serving cert carries a 127.0.0.1 SAN (templates/openbao-tls-cert.yaml),
      # so loopback verifies cleanly.
      BAO_CACERT: "/openbao/tls/ca.crt"

    # --- Audit log shipping via Promtail sidecar ------------------------------
    # A Promtail sidecar tails the file audit device and ships to the in-cluster
    # Loki gateway. Its config lives in the `platform-openbao-promtail` ConfigMap
    # rendered by templates/openbao-promtail-config.yaml in this chart.
    extraContainers:
      - name: promtail
        image: grafana/promtail:3.6.11@sha256:a761cb834cfaeee29745440d4884d6748f0a08d8f68928db1d707018c1dcfbe9
        imagePullPolicy: Always
        args:
          - -config.file=/etc/promtail/promtail.yaml
          # The promtail config sets `pod: ${HOSTNAME}` (openbao-promtail-config.yaml).
          # Promtail does NOT expand ${VAR} in its config without this flag — without
          # it every shipped audit line gets the LITERAL label `pod="${HOSTNAME}"`
          # (indistinguishable across the 3 raft pods). `${HOSTNAME}` is the only
          # variable in the config, so expanding env is safe.
          - -config.expand-env=true
        env:
          # Guarantee HOSTNAME = the pod name (platform-openbao-N) for the label
          # above, rather than relying on the container runtime to inject it.
          - name: HOSTNAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
        securityContext:
          runAsNonRoot: true
          runAsUser: 10000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
          - name: audit
            mountPath: /openbao/audit
            readOnly: true
          - name: promtail-config
            mountPath: /etc/promtail
            readOnly: true
          - name: promtail-positions
            mountPath: /var/promtail
          - name: promtail-tmp
            mountPath: /tmp
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi

    # `server.volumes` are raw Pod-spec volume entries. With auditStorage
    # disabled, we provide the `audit` volume ourselves as an emptyDir sized at
    # 2Gi (matches the prior PVC quota). The promtail-config ConfigMap name
    # matches templates/openbao-promtail-config.yaml; openbao-tls matches
    # platform.tls.secretName.
    volumes:
      - name: audit
        emptyDir:
          sizeLimit: 2Gi
      - name: promtail-config
        configMap:
          name: platform-openbao-promtail
      - name: promtail-positions
        emptyDir: {}
      - name: promtail-tmp
        emptyDir: {}
      - name: openbao-tls
        secret:
          secretName: openbao-tls
      # Client-verification bundle for the mTLS listener. Only `ca.crt` off this
      # Secret is consumed (tls_client_ca_file) — it is the llz-client-ca root.
      # The Secret is a cert-manager Certificate issued FROM llz-client-ca purely
      # so its ca.crt lands in this namespace; the leaf itself is unused. That
      # indirection is the platform's stand-in for a CA-reflector controller and
      # matches how ESO's caProvider sources openbao-ca off the openbao-tls Secret.
      - name: openbao-client-ca
        secret:
          secretName: openbao-client-ca
          defaultMode: 0444
          # ca.crt ONLY. Without this filter the whole Secret is projected,
          # including the anchor leaf's tls.key — a private key nothing reads,
          # published world-readable inside the pod for no reason. Every other CA
          # anchor mount in this change filters; this one is the odd one out.
          items:
            - { key: ca.crt, path: ca.crt }
      # Client identity the raft followers present to the leader on retry_join
      # (see leader_client_cert_file in the raft stanza). 0440 — the private key
      # must not be world-readable; the openbao process reads it via fsGroup 1000.
      - name: openbao-raft-client
        secret:
          secretName: openbao-raft-client-tls
          defaultMode: 0440
      # apl-core's CA, for the Keycloak JWKS fetch (jwks_ca_pem). OPTIONAL on
      # purpose: this Certificate is issued by apl-core's `custom-ca`, not by us,
      # and if that issuer is absent the Secret never appears. A required volume
      # would then park every OpenBao pod in ContainerCreating — i.e. an
      # unverified apl-core assumption would take down the secret store. Optional
      # means OpenBao starts regardless and only the Keycloak team-login path is
      # affected; `llz ci bao-configure` fails loudly on the missing file rather
      # than quietly configuring an unverified JWKS fetch.
      - name: openbao-apl-ca
        secret:
          secretName: openbao-apl-ca
          optional: true
          defaultMode: 0444
          # ca.crt only — same reason as openbao-client-ca above.
          items:
            - { key: ca.crt, path: ca.crt }
      # 32-byte static auto-unseal key, referenced as file:///openbao/seal/unseal.key
      # by the `seal "static"` stanza in server.ha.raft.config. Created by
      # `llz ci bao-seed-seal-key` before bootstrap (a missing Secret leaves the
      # pod in ContainerCreating, not crash-looping). defaultMode 0440: readable
      # by the openbao process (gid 1000 via the pod fsGroup) but not world-readable.
      - name: openbao-seal-key
        secret:
          secretName: openbao-unseal-key
          defaultMode: 0440

    # NOTE: this chart uses `server.volumeMounts` (not `extraVolumeMounts`) to
    # mount /openbao/tls. The `extraVolumeMounts` key is silently ignored,
    # leaving /openbao/tls unmounted and OpenBao crash-looping with
    # "open /openbao/tls/tls.crt: no such file".
    volumeMounts:
      - name: openbao-tls
        mountPath: /openbao/tls
        readOnly: true
      # tls_client_ca_file for the mTLS listener (ca.crt only).
      - name: openbao-client-ca
        mountPath: /openbao/client-ca
        readOnly: true
      # leader_client_cert_file / leader_client_key_file for raft retry_join.
      - name: openbao-raft-client
        mountPath: /openbao/raft-client
        readOnly: true
      # jwks_ca_pem for the Keycloak JWKS fetch. Empty dir when the optional
      # Secret is absent — see the volume note.
      - name: openbao-apl-ca
        mountPath: /openbao/apl-ca
        readOnly: true
      - name: openbao-seal-key
        mountPath: /openbao/seal
        readOnly: true
      - name: audit
        mountPath: /openbao/audit

  ui:
    enabled: true
    serviceType: ClusterIP  # expose via ingress/port-forward; do not LoadBalancer-expose the UI.

  csi:
    enabled: false

# ── Promtail audit-shipper config (templates/openbao-promtail-config.yaml) ───
# Override per cluster via the Application's spec.source.helm.parameters in the
# env overlay.
openbaoPromtail:
  enabled: true
  # Loki gateway service URL, resolvable from the openbao namespace.
  # Loki runs in apl-core's `monitoring` namespace, NOT llz-observability — this
  # pointed at llz-observability, where nothing creates a loki-gateway Service, so
  # OpenBao's audit log was not reaching Loki at all (a broken pipeline, flagged in
  # ADR 0010 and left for whoever repaired the URL). Confirmed against apl-core:
  # its Loki release is `loki` in `monitoring`, and apl-core's own otel-operator
  # config ships to `http://loki-gateway.monitoring/otlp`.
  #
  # STILL PLAINTEXT, and still registered in plaintextAllowed. The gateway is
  # nginx serving plain HTTP — apl-core gives it no TLS material and talks to it
  # over http:// itself — so https here would connect to nothing. What crosses is
  # OpenBao audit records: values are hashed, but request paths, operations and
  # auth.display_name are in clear. Closing it needs the hop meshed, which is what
  # enrolling `llz-openbao` and `monitoring` in ambient would do.
  lokiPushUrl: http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push
  region: primary
  cluster: platform-openbao  # stable label — matches the Helm release name.
