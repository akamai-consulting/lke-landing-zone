{{- if .Values.platform.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: platform-openbao
  namespace: {{ .Release.Namespace }}
  labels:
    # Labels the Prometheus Operator's serviceMonitorSelector matches. apl-core's
    # kube-prometheus-stack selects on `prometheus: system` (NOT a release label),
    # so a ServiceMonitor without it is silently ignored and vault_* never scrapes.
    {{- toYaml (.Values.platform.serviceMonitor.selectorLabels | default (dict "prometheus" "system")) | nindent 4 }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      app.kubernetes.io/name: openbao
  endpoints:
    # The OpenBao Service exposes 8200 as a port named `https` (TLS listener); the
    # old `http` name matched no Service port, so the operator generated no target.
    - port: https
      scheme: https
      path: /v1/sys/metrics
      params:
        format:
          - prometheus
      interval: 30s
      scrapeTimeout: 10s
      # mTLS to the OpenBao listener. Was `insecureSkipVerify: true`, which meant
      # Prometheus encrypted the scrape but authenticated nothing at either end.
      # Now both directions are proven:
      #
      #   ca         — verify OpenBao's serving cert against the openbao-ca root
      #                (ca.crt on the openbao-tls Secret, the same anchor ESO's
      #                caProvider reads). serverName is required because the
      #                scrape connects to a Pod IP, which is not a SAN on that
      #                cert; without it verification fails on hostname mismatch.
      #   cert/key   — present the openbao-metrics-scraper client identity, which
      #                the listener's tls_require_and_verify_client_cert demands.
      #                Missing it means every scrape fails at the handshake and
      #                vault_* disappears cluster-wide.
      #
      # All three Secrets live in THIS namespace beside the ServiceMonitor —
      # prometheus-operator resolves these refs relative to the ServiceMonitor,
      # not to the Prometheus pod, and mounts them as scrape assets.
      tlsConfig:
        ca:
          secret:
            name: {{ .Values.platform.tls.secretName }}
            key: ca.crt
        cert:
          secret:
            name: {{ .Values.platform.clientTls.scrapeSecretName }}
            key: tls.crt
        keySecret:
          name: {{ .Values.platform.clientTls.scrapeSecretName }}
          key: tls.key
        serverName: {{ .Values.platform.releaseName }}.{{ .Release.Namespace }}.svc.cluster.local
{{- end }}
